<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ratatatata! — Rat Bros: Rodent Reckoning</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#08080a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:#08080a;}
  #stage{flex:1 1 100%;position:relative;overflow:hidden;background:#0a0d0f;}
  #panel{display:none;visibility:hidden;position:fixed;inset:0;z-index:8;pointer-events:none;}
  #panel canvas{position:absolute;inset:0;pointer-events:auto;}
  #mobilePause{display:none;position:fixed;left:max(10px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));
    z-index:11;width:38px;height:38px;border:1px solid rgba(255,255,255,.34);border-radius:10px;
    background:rgba(8,12,14,.36);color:rgba(255,255,255,.78);font:bold 15px Arial,sans-serif;backdrop-filter:blur(3px);}
  #pauseModal{display:none;position:fixed;inset:0;z-index:12;align-items:center;justify-content:center;background:rgba(2,4,5,.70);}
  #pauseCard{min-width:min(330px,72vw);padding:25px;border:1px solid rgba(232,194,90,.48);border-radius:14px;
    background:linear-gradient(#172024,#080b0d);box-shadow:0 18px 60px #000;text-align:center;color:#e8c25a;}
  #pauseCard h2{font-size:30px;letter-spacing:2px;margin-bottom:18px;text-shadow:2px 2px #42120e;}
  #pauseCard button{display:block;width:100%;margin:10px 0;padding:12px;border:1px solid rgba(255,255,255,.26);border-radius:8px;
    background:rgba(255,255,255,.07);color:#eee;font:18px Impact,sans-serif;letter-spacing:1px;}
  @media (orientation:landscape) and (pointer:coarse){#panel,#mobilePause{display:block;}}
  canvas{display:block;width:100%;height:100%;}
  #stage canvas{box-shadow:inset 0 -14px 26px rgba(0,0,0,.7);}
  #rotate{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:28px;background:
    radial-gradient(circle at 50% 42%,#263b3b 0,#0b1214 52%,#050708 100%);color:#e8d6a8;}
  #rotate .phone{width:54px;height:92px;border:5px solid #e8c25a;border-radius:10px;
    transform:rotate(90deg);margin:12px 0 26px;box-shadow:0 0 30px rgba(232,194,90,.24);}
  #rotate h1{font-size:clamp(28px,9vw,48px);letter-spacing:1px;color:#e8c25a;
    text-shadow:3px 3px 0 #42120e;}
  #rotate p{font-family:Arial,sans-serif;font-weight:bold;font-size:15px;line-height:1.45;
    max-width:340px;color:#b9c6b0;margin-top:10px;}
  @media (orientation:portrait) and (pointer:coarse){
    #app{display:none;}#rotate{display:flex;}
  }
</style>
</head>
<body>
<div id="rotate" role="button" aria-label="Rotate device to landscape" tabindex="0">
  <div class="phone"></div>
  <h1>TURN IT SIDEWAYS!</h1>
  <p>Ratatatata! is a landscape-only operation. Rotate your phone, then tap anywhere to deploy.</p>
</div>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="panel"><canvas id="pad"></canvas></div>
</div>
<button id="mobilePause" aria-label="Pause game">Ⅱ</button>
<div id="pauseModal"><div id="pauseCard"><h2>PAUSED</h2><button id="pauseContinue">CONTINUE</button><button id="pauseMenu">MAIN MENU</button></div></div>
<script>
(function(){
'use strict';

/* ==================== CANVAS / VIEW ==================== */
var stageEl=document.getElementById('stage'), panelEl=document.getElementById('panel');
var rotateEl=document.getElementById('rotate'),landscapeAsked=false;
var mobilePause=document.getElementById('mobilePause'),pauseModal=document.getElementById('pauseModal');
var gcv=document.getElementById('game'), g=gcv.getContext('2d');
var pcv=document.getElementById('pad'),  pg=pcv.getContext('2d');
var titleLogo=new Image();titleLogo.src='assets/images/ui/ratatatata-title-cutout.png';

var view={w:520,h:900,scale:1,cssW:360,cssH:640};
var pad ={cssW:360,cssH:160};
var DPR=1, VIEW_BOTTOM=612, camY0=-300;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  var r=stageEl.getBoundingClientRect();
  view.cssW=Math.max(1,r.width); view.cssH=Math.max(1,r.height);
  gcv.width=Math.round(view.cssW*DPR); gcv.height=Math.round(view.cssH*DPR);
  var a=view.cssW/view.cssH;
  if(a<520/560){ view.w=520; view.h=520/a; } else { view.h=560; view.w=560*a; }
  view.scale=view.cssW/view.w;
  camY0=VIEW_BOTTOM-view.h;
  var q=panelEl.getBoundingClientRect();
  pad.cssW=Math.max(1,q.width); pad.cssH=Math.max(1,q.height);
  pcv.width=Math.round(pad.cssW*DPR); pcv.height=Math.round(pad.cssH*DPR);
  layoutPad();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);});
function requestLandscape(){
  if(!matchMedia('(pointer:coarse)').matches)return;
  var root=document.documentElement,p=Promise.resolve();
  if(!document.fullscreenElement&&root.requestFullscreen)p=root.requestFullscreen().catch(function(){});
  p.then(function(){
    if(screen.orientation&&screen.orientation.lock)
      screen.orientation.lock('landscape').catch(function(){});
  });
  landscapeAsked=true;
}
function setPauseModal(show){pauseModal.style.display=show?'flex':'none';}
mobilePause.addEventListener('click',function(e){e.preventDefault();initAudio();requestLandscape();if(state==='PLAY'){state='PAUSE';setPauseModal(true);}});
document.getElementById('pauseContinue').addEventListener('click',function(){state='PLAY';setPauseModal(false);SFX.start();});
document.getElementById('pauseMenu').addEventListener('click',function(){Music.menu();state='TITLE';stateT=0;setPauseModal(false);});
rotateEl.addEventListener('click',requestLandscape);
rotateEl.addEventListener('touchend',function(e){e.preventDefault();requestLandscape();},{passive:false});

/* ==================== MATH ==================== */
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var rnd=function(a,b){return a+Math.random()*(b-a);};
var lerp=function(a,b,t){return a+(b-a)*t;};
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lin(c,x0,y0,x1,y1,st){var q=c.createLinearGradient(x0,y0,x1,y1),i;
  for(i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}
function rad(c,x,y,r0,r1,st){var q=c.createRadialGradient(x,y,r0,x,y,r1),i;
  for(i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}
function rr(c,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,6.283);}
function ink(c,col,lw){c.strokeStyle=col||'rgba(10,8,10,.75)';c.lineWidth=lw||2;c.stroke();}

/* ==================== INPUT ==================== */
var NAMES=['left','right','up','down','jump','fire','nade','swap','start','pause'];
var kb={},tc={},inp={},prev={},keyPulse=false,anyKey=false;
var KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
  KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyZ:'jump',Space:'jump',KeyK:'jump',
  KeyX:'fire',KeyJ:'fire',KeyC:'nade',KeyL:'nade',ShiftLeft:'swap',KeyQ:'swap',
  Enter:'start',KeyR:'start',KeyP:'pause',Escape:'pause'};
window.addEventListener('keydown',function(e){var n=KEYS[e.code];
  if(!e.repeat){keyPulse=true;initAudio();}
  if(n){kb[n]=true;e.preventDefault();}});
window.addEventListener('keyup',function(e){var n=KEYS[e.code];if(n){kb[n]=false;e.preventDefault();}});
window.addEventListener('blur',function(){var i;for(i=0;i<NAMES.length;i++){kb[NAMES[i]]=false;tc[NAMES[i]]=false;}
  stick.ax=0;stick.ay=0;});
function poll(){var i,n;anyKey=keyPulse;keyPulse=false;for(i=0;i<NAMES.length;i++){n=NAMES[i];prev[n]=inp[n];inp[n]=!!(kb[n]||tc[n]);}}
function pressed(n){return inp[n]&&!prev[n];}
function anyButtonPressed(){for(var i=0;i<NAMES.length;i++)if(pressed(NAMES[i]))return true;return false;}

/* ---- arcade panel layout + touch ---- */
var stick={cx:0,cy:0,r:0,ax:0,ay:0,vx:0,vy:0,id:-1};
var weaponSwipeY=null;
var BTNS=[
  {n:'nade', l:'C', sub:'BOMB',  x:0,y:0,r:0,p:0,hue:'#e8b23a'},
  {n:'swap', l:'D', sub:'SWAP',  x:0,y:0,r:0,p:0,hue:'#e8b23a'},
  {n:'jump', l:'A', sub:'JUMP',  x:0,y:0,r:0,p:0,hue:'#e2402f'},
  {n:'fire', l:'B', sub:'FIRE',  x:0,y:0,r:0,p:0,hue:'#e2402f'}
];
var SMALL=[
  {n:'start',l:'START',x:0,y:0,r:0,p:0},
  {n:'pause',l:'PAUSE',x:0,y:0,r:0,p:0}
];
function layoutPad(){
  var w=pad.cssW,h=pad.cssH;
  stick.r=Math.min(h*0.14,w*0.09,72);
  stick.cx=Math.max(w*0.14,stick.r+24+parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')||0));
  stick.cy=h*0.74;
  var br=Math.min(h*0.074,w*0.047,42);
  var cx=w*0.84, cy=h*0.71, dx=br*1.42, dy=br*1.28;
  BTNS[0].x=cx-dx; BTNS[0].y=cy-dy;
  BTNS[1].x=cx+dx; BTNS[1].y=cy-dy;
  BTNS[2].x=cx-dx; BTNS[2].y=cy+dy;
  BTNS[3].x=cx+dx; BTNS[3].y=cy+dy;
  var i;for(i=0;i<4;i++)BTNS[i].r=br;
  var sr=0;SMALL[0].r=sr;SMALL[1].r=sr;
}
function padTouch(e){
  e.preventDefault(); initAudio();if(!landscapeAsked)requestLandscape();
  var i,k; for(k=0;k<NAMES.length;k++) tc[NAMES[k]]=false;
  for(k=0;k<4;k++)BTNS[k].p=0;
  SMALL[0].p=0;SMALL[1].p=0;
  var sx=0,sy=0,held=false;
  var r=pcv.getBoundingClientRect();
  for(i=0;i<e.touches.length;i++){
    var t=e.touches[i];
    var x=(t.clientX-r.left)/r.width*pad.cssW, y=(t.clientY-r.top)/r.height*pad.cssH;
    if(x>pad.cssW*.92){
      if(weaponSwipeY===null)weaponSwipeY=y;
      else if(Math.abs(y-weaponSwipeY)>34){cycleWeapon(y<weaponSwipeY?1:-1);weaponSwipeY=y;}
      continue;
    }
    if(x<pad.cssW*0.40){
      var dx=x-stick.cx, dy=y-stick.cy, d=Math.hypot(dx,dy)||1, m=Math.min(1,d/(stick.r*1.15));
      sx=dx/d*m; sy=dy/d*m; held=true; continue;
    }
    var got=false;
    for(k=0;k<4;k++){
      var b=BTNS[k];
      if(Math.hypot(x-b.x,y-b.y)<b.r*1.32){tc[b.n]=true;b.p=1;got=true;break;}
    }
    if(got)continue;
    for(k=0;k<2;k++){
      var s=SMALL[k];
      if(Math.hypot(x-s.x,y-s.y)<s.r*2.0){tc[s.n]=true;s.p=1;break;}
    }
  }
  stick.ax=held?sx:0; stick.ay=held?sy:0;
  var DZ=0.34;
  tc.left = stick.ax<-DZ; tc.right= stick.ax>DZ;
  tc.up   = stick.ay<-DZ; tc.down = stick.ay>DZ;
  if(!e.touches.length)weaponSwipeY=null;
}
['touchstart','touchmove','touchend','touchcancel'].forEach(function(n){
  pcv.addEventListener(n,padTouch,{passive:false});
});
var tapped=false,selectDeployTap=false;
function stageTouch(e){
  e.preventDefault();initAudio();if(!landscapeAsked)requestLandscape();
  if(state==='SELECT'&&e.touches&&e.touches.length){
    var r=gcv.getBoundingClientRect(),x=(e.touches[0].clientX-r.left)/r.width*view.cssW;
    var y=(e.touches[0].clientY-r.top)/r.height*view.cssH;
    var cw=view.cssW*.42,ch=view.cssH*.52,cy=view.cssH*.22;
    if(y>=cy&&y<=cy+ch){
      if(x>=view.cssW*.05&&x<=view.cssW*.05+cw){if(selIdx!==0)SFX.selectMove();selIdx=0;}
      else if(x>=view.cssW*.53&&x<=view.cssW*.53+cw){if(selIdx!==1)SFX.selectMove();selIdx=1;}
    } else if(x>=view.cssW*.30&&x<=view.cssW*.70&&y>=view.cssH*.79&&y<=view.cssH*.90)selectDeployTap=true;
    else if(y>=view.cssH*.91){aimHelp=x>=view.cssW*.5;SFX.selectMove();}
    return;
  }
  tapped=true;
}
gcv.addEventListener('touchstart',stageTouch,{passive:false});
gcv.addEventListener('mousedown',function(e){
  initAudio();
  if(state==='SELECT'){
    var r=gcv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*view.cssW,y=(e.clientY-r.top)/r.height*view.cssH;
    var cw=view.cssW*.42,ch=view.cssH*.52,cy=view.cssH*.22;
    if(y>=cy&&y<=cy+ch){
      if(x>=view.cssW*.05&&x<=view.cssW*.05+cw){selIdx=0;SFX.selectMove();}
      else if(x>=view.cssW*.53&&x<=view.cssW*.53+cw){selIdx=1;SFX.selectMove();}
    } else if(y>=view.cssH*.91){aimHelp=x>=view.cssW*.5;SFX.selectMove();}
    else selectDeployTap=true;
    return;
  }
  tapped=true;
});

/* ==================== AUDIO ==================== */
var actx=null;
function initAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  if(actx)Music.init();
}
function tone(f,dur,type,vol,slide){
  if(!actx)return;
  var o=actx.createOscillator(),q=actx.createGain(),t=actx.currentTime;
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  q.gain.setValueAtTime(vol||0.05,t); q.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(q);q.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,filt){
  if(!actx)return;
  var len=Math.floor(actx.sampleRate*dur),b=actx.createBuffer(1,len,actx.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  var s=actx.createBufferSource();s.buffer=b;
  var q=actx.createGain();q.gain.value=vol||0.12;
  var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=filt||1200;
  s.connect(f);f.connect(q);q.connect(actx.destination);s.start();
}
var SFX={
  shoot:function(){noise(.045,.075,4200);tone(980,.045,'square',.035,260);tone(145,.075,'triangle',.028,80);},
  mgun:function(){noise(.032,.055,3200);tone(tick%2?520:610,.038,'square',.032,190);tone(115,.045,'triangle',.018,70);},
  spread:function(){noise(.18,.16,1250);tone(185,.16,'sawtooth',.065,48);setTimeout(function(){noise(.06,.045,2800);},35);},
  flame:function(){noise(.10,.055,720);tone(118,.09,'sawtooth',.022,72);},
  swing:function(){noise(0.11,0.09,1200);tone(105,.08,'triangle',.022,65);},
  jump:function(){tone(280,0.12,'square',0.04,600);},
  hurt:function(){tone(200,0.22,'sawtooth',0.07,60);noise(0.10,0.06,700);},
  pick:function(){tone(680,0.08,'triangle',0.06,1250);},
  cheese:function(){tone(520,0.07,'triangle',0.06,760);setTimeout(function(){tone(790,0.1,'triangle',0.055,1040);},70);},
  boom:function(){noise(0.40,0.22,600);tone(80,0.34,'sawtooth',0.07,32);},
  ehit:function(){tone(170,0.05,'square',0.03,90);},
  die:function(){tone(380,0.55,'sawtooth',0.08,55);},
  enemyDeath:function(kind,elite){
    var v=elite?1.28:1;
    if(kind==='mouse'){tone(920,.16,'square',.045*v,430);setTimeout(function(){tone(610,.12,'triangle',.03*v,260);},45);}
    else if(kind==='bat'){tone(1450,.22,'sawtooth',.038*v,310);noise(.10,.035*v,3600);}
    else if(kind==='weasel'){tone(520,.30,'square',.045*v,115);setTimeout(function(){tone(240,.17,'sawtooth',.028*v,75);},55);}
    else {tone(205,.38,'sawtooth',.065*v,48);noise(.18,.055*v,620);}
  },
  clear:function(){var n=[392,523,659,784],i;for(i=0;i<4;i++)(function(j){
    setTimeout(function(){tone(n[j],0.16,'square',0.05);},j*120);})(i);},
  swap:function(){tone(560,0.07,'triangle',0.05,880);},
  selectMove:function(){tone(420,0.055,'square',0.045,620);setTimeout(function(){tone(620,0.05,'square',0.035,760);},48);},
  selectConfirm:function(){var n=[330,440,660,880];for(var i=0;i<n.length;i++)(function(j){
    setTimeout(function(){tone(n[j],0.12,'square',0.05,n[j]*1.2);},j*65);})(i);},
  start:function(){tone(110,0.22,'sawtooth',0.045,55);setTimeout(function(){tone(440,0.10,'square',0.04,660);},80);
    setTimeout(function(){tone(880,0.16,'triangle',0.035,1180);},165);},
  roll:function(){noise(0.16,0.055,850);tone(190,0.11,'triangle',0.025,90);},
  bite:function(){tone(240,0.075,'square',0.045,95);noise(0.055,0.045,1500);}
};
var Music={buffers:{},source:null,gain:null,filter:null,delay:null,delayGain:null,mode:'',pending:null,loading:false,
  segmentSeconds:9,stage:1,combat:false,
  init:function(){
    if(this.loading||!actx)return;this.loading=true;var self=this;
    Promise.all(['menu-theme.wav','ambient-themes.wav','boss-theme.wav'].map(function(name){
      return fetch('assets/audio/'+name+'?v=2').then(function(r){return r.arrayBuffer();}).then(function(b){return actx.decodeAudioData(b);});
    })).then(function(b){self.buffers.menu=b[0];self.buffers.ambient=b[1];self.buffers.boss=b[2];
      if(self.pending){var p=self.pending;self.pending=null;p.mode==='menu'?self.menu():self.game(p.stage);}}).catch(function(){});
  },
  stop:function(){if(this.source){try{this.source.stop();}catch(e){}this.source=null;}},
  connect:function(src,vol,cutoff){
    this.gain=actx.createGain();this.gain.gain.value=vol;
    this.filter=actx.createBiquadFilter();this.filter.type='lowpass';this.filter.frequency.value=cutoff||3300;this.filter.Q.value=.45;
    src.connect(this.filter);this.filter.connect(this.gain);this.gain.connect(actx.destination);this.source=src;
    this.delay=actx.createDelay(.5);this.delay.delayTime.value=.17;
    this.delayGain=actx.createGain();this.delayGain.gain.value=.075;
    this.filter.connect(this.delay);this.delay.connect(this.delayGain);this.delayGain.connect(actx.destination);
  },
  menu:function(){
    this.mode='menu';if(!this.buffers.menu){this.pending={mode:'menu'};this.init();return;}this.stop();
    var s=actx.createBufferSource();s.buffer=this.buffers.menu;s.loop=true;this.connect(s,.10,3100);s.start();
  },
  game:function(n){
    this.mode='game';this.stage=n;this.combat=false;
    if(!this.buffers.ambient){this.pending={mode:'game',stage:n};this.init();return;}this.playAmbient();
  },
  playAmbient:function(){
    this.stop();this.combat=false;var idx=clamp(this.stage-1,0,9),start=idx*this.segmentSeconds,s=actx.createBufferSource();s.buffer=this.buffers.ambient;
    s.loop=true;s.loopStart=start;s.loopEnd=start+this.segmentSeconds;this.connect(s,.078,2050);s.start(0,start);
  },
  playBoss:function(){
    if(!this.buffers.boss)return;this.stop();this.combat=true;var s=actx.createBufferSource();s.buffer=this.buffers.boss;s.loop=true;
    this.connect(s,.145,4400);s.start();
  },
  update:function(){
    if(this.mode!=='game'||!this.source||!this.gain||!level)return;
    var mini=null,threat=0;for(var i=0;i<enemies.length;i++){var e=enemies[i];if(!e.dead&&Math.abs(e.x-P.x)<420)threat++;
      if(e.miniBoss&&!e.dead&&(e.engaged||Math.abs(e.x-P.x)<560))mini=e;}

function safeRespawn(x){
  var best=null,i,p;
  for(i=0;i<level.plats.length;i++){
    p=level.plats[i];
    if(!p.ground||p.w<90)continue;
    if(x>=p.x&&x<=p.x+p.w){best=p;break;}
    if(p.x+p.w<x&&(!best||p.x>best.x))best=p;

}

  var safe=[],offsets=[0,62,-62,124,-124,190,-190,260,-260,340,-340];

    var s=lv.spawns[i],z=enemySpawnSize(s.t),placed=false;

      if(s.inB){

function addBuilding(lv,rng,x,gy,kind){
  var fh=82, floors=3+(rng()<0.55?1:0), w=Math.round(360+rng()*60);
  var b={x:x,y:gy-floors*fh,w:w,h:floors*fh,gy:gy,fh:fh,floors:floors,cut:0,
         slabs:[],steps:[],stairs:[],windows:[],door:{x:x+18,w:38},doorOpen:0,seed:rng(),lit:rng(),kind:kind||'downtown'};
  var f,i;
  lv.plats.push({x:x-7,y:b.y-11,w:w+14,h:11,roof:true});          // roof: always solid
  lv.plats.push({x:x-9,y:b.y,w:10,h:b.h,inside:b});               // walls: solid only from inside
  lv.plats.push({x:x+w-1,y:b.y,w:10,h:b.h,inside:b});
  for(f=1;f<floors;f++){
    var fy=gy-f*fh, lower=gy-(f-1)*fh;
    var steps=6, stw=24, sth=fh/steps, runW=steps*stw, riser=sth+15;
    // A flight can only be climbed from its low end, so odd storeys run left-to-right
    // starting just past the door, and even storeys run back the other way. The top
    // tread always meets its landing, and there is headroom under the upper treads.
    var goRight=(f%2===1), lowX=goRight?(x+66):(x+w-40-runW), sl;
    b.stairs.push({lowX:goRight?lowX:lowX+runW,lowY:lower,
      highX:goRight?lowX+runW:lowX,highY:fy,goRight:goRight,floor:f});
    for(i=0;i<steps;i++){
      var stx=lowX+(goRight?i:(steps-1-i))*stw, sty=lower-(i+1)*sth;
      lv.plats.push({x:stx,y:sty,w:stw+1,h:riser,inside:b,step:true});
      b.steps.push({x:stx,y:sty,w:stw+1,h:riser});
    }
    if(goRight) sl={x:lowX+runW+3,y:fy,w:(x+w-8)-(lowX+runW+3),h:11};
    else        sl={x:x+8,y:fy,w:(lowX-3)-(x+8),h:11};
    if(sl.w>40){b.slabs.push(sl);lv.plats.push({x:sl.x,y:sl.y,w:sl.w,h:sl.h,inside:b,interiorFloor:true});}
  }
  for(f=0;f<floors;f++){
    var base=gy-f*fh;
    for(i=0;i<3;i++){
      var wx=x+28+i*((w-96)/2);
      if(wx+40>x+w-18)continue;
      if(f===0&&wx+40>b.door.x-16&&wx<b.door.x+b.door.w+16)continue;   // no window in the doorway
      var landing=(f===0);
      for(var q=0;q<b.slabs.length;q++){
        var sb=b.slabs[q];
        if(Math.abs(sb.y-base)<2&&wx+34>sb.x&&wx+6<sb.x+sb.w){landing=true;break;}
      }
      var win={x:wx,y:base-54,w:40,h:46,open:false,broken:false,f:f,base:base,b:b};
      b.windows.push(win);
    }
    // A narrow window in the right edge is the building's deliberate escape
    // point. Façade windows still shatter, but never change interior state.
    b.windows.push({x:x+w-24,y:base-50,w:22,h:42,open:false,broken:false,
      f:f,base:base,b:b,sideExit:true});
  }
  lv.buildings.push(b);
  return b;
}

function assignEnemyTerritory(e){

  }

    if(cx<p.x+2||cx>p.x+p.w-2||p.roof||p.step)continue;
    var d=Math.abs(p.y-foot);

function holdEnemyTerritory(e){

    e.blastLoose--;

      var original=e.territory,foot=e.y+e.h;
      var same=original&&!original.air&&Math.abs(foot-original.y)<4&&e.x+e.w>original.x1&&e.x<original.x2;

    } else if(e.t!=='bat'&&e.blastLoose<=0){

    }
    return;
  }
  var t=e.territory;
  if(!t){if(e.onGround)assignEnemyTerritory(e);return;}
  if(t.air){
    if(e.x<t.x1){e.x=t.x1;e.vx=Math.abs(e.vx);}
    if(e.x+e.w>t.x2){e.x=t.x2-e.w;e.vx=-Math.abs(e.vx);}

    if(e.y+e.h>t.y2){e.y=t.y2-e.h;e.vy=-Math.abs(e.vy);}
    return;
  }
  if(e.x<t.x1){e.x=t.x1;e.vx=Math.abs(e.vx);e.patrolDir=1;}
  if(e.x+e.w>t.x2){e.x=t.x2-e.w;e.vx=-Math.abs(e.vx);e.patrolDir=-1;}

  }
}

    if(e.squash>0)e.squash--;
    if(e.hidden)continue;
    if(e.inB&&e.inB!==P.inB)continue;
    if(canStomp(e)){doStomp(e);}
    else if(e.touchCd<=0&&hit(P,e)){
      if(P.bro===1&&P.rollT>0){e.touchCd=12;burst(P.x+P.w/2,P.y+P.h/2,'#a8e8ff',4,2);}
      else {hurtPlayer(e.dmg,ecx);e.touchCd=30;}

}
function updateBoss(){
  if(!boss)return;
  boss.anim+=0.1;
  if(boss.flash>0)boss.flash--;
  var pcx=P.x+P.w/2,bcx=boss.x+boss.w/2;
  boss.facing=pcx<bcx?-1:1;
  if(boss.state==='dead'){
    boss.timer--;
    if(boss.timer%6===0){
      burst(boss.x+rnd(0,boss.w),boss.y+rnd(0,boss.h),'#ffb347',9,4.5);
      addLight(boss.x+rnd(0,boss.w),boss.y+rnd(20,120),180,'#ff9a3a',20);
      SFX.boom();cam.shake=9;
    }
    if(boss.timer<=0){state='WIN';stateT=0;SFX.clear();}
    return;
  }
  boss.vy+=0.6;boss.timer--;
  var sm=boss.phase===2?1.5:1;
  switch(boss.state){
    case 'enter':
      boss.vx=-1.6;
      if(boss.x<level.length*0.55){boss.vx=0;boss.state='idle';boss.timer=40;}
      break;
    case 'idle':
      boss.vx*=0.85;
      if(boss.timer<=0){
        var pk=Math.random();
        if(pk<0.4){boss.state='volley';boss.timer=20;boss.shots=boss.phase===2?5:3;}
        else if(pk<0.72){boss.state='jump';boss.timer=26;}
        else {boss.state='summon';boss.timer=40;}
      }
      break;
    case 'volley':
      boss.vx*=0.9;
      if(boss.timer<=0&&boss.shots>0){
        boss.shots--;boss.timer=Math.round(20/sm);
        var oy=boss.y+56+(boss.shots%2)*38;
        aimedShot(bcx+boss.facing*58,oy,P.x+P.w/2,P.y+16,5.0,{rocket:true,dmg:24,r:8});
        if(boss.phase===2)aimedShot(bcx+boss.facing*58,oy,P.x+P.w/2,P.y-54,4.6,{rocket:true,dmg:20,r:7});
        addLight(bcx+boss.facing*70,oy,140,'#ff9a4a',10);
        tone(140,0.16,'sawtooth',0.05,55);noise(0.12,0.07,800);
      }
      if(boss.shots<=0&&boss.timer<=0){boss.state='idle';boss.timer=45;}
      break;
    case 'jump':
      if(boss.onGround&&boss.timer<=0){boss.vy=-13;boss.vx=(pcx<bcx?-1:1)*4.2*sm;boss.timer=200;}
      if(boss.onGround&&boss.vy===0&&boss.timer<190&&boss.timer>0){
        cam.shake=16;SFX.boom();
        var k;for(k=0;k<2;k++)ebullets.push({x:bcx,y:boss.y+boss.h-14,vx:(k?1:-1)*5,vy:0,
          life:120,r:9,dmg:18,shock:true});
        burst(bcx,boss.y+boss.h,'#c9a06a',22,5);
        addLight(bcx,boss.y+boss.h,220,'#ffd08a',18);
        boss.state='idle';boss.timer=40;
      }
      break;
    case 'summon':
      if(boss.timer<=0){
        var alive=0,z;for(z=0;z<enemies.length;z++)if(!enemies[z].dead)alive++;
        if(alive<7){
          spawnEnemy('mouse',cam.x+40,380);
          spawnEnemy('mouse',cam.x+view.w-60,380);
          spawnEnemy('bat',bcx,140);
        }
        tone(500,0.2,'square',0.05,210);
        boss.state='idle';boss.timer=50;
      }
      break;
  }
  boss.x+=boss.vx;boss.y+=boss.vy;boss.onGround=false;
  if(boss.y+boss.h>=470){boss.y=470-boss.h;boss.vy=0;boss.onGround=true;boss.vx*=0.8;}
  boss.x=clamp(boss.x,20,level.length-boss.w-20);
  if(hit(P,boss))hurtPlayer(20,boss.x+boss.w/2);
}

function shatterWindow(win){

  win.open=true;win.broken=true;cam.shake=Math.max(cam.shake,2.5);
  var i,cx=win.x+win.w/2,cy=win.y+win.h/2;
  for(i=0;i<18;i++)addPart(cx+rnd(-18,18),cy+rnd(-18,18),rnd(-3.2,3.2),rnd(-4.2,1.2),
    i%3?'#bfe8ed':'#efffff',rnd(24,48),rnd(1.5,4),0.22);
  addLight(cx,cy,70,'#d9ffff',8);noise(0.16,0.10,4200);tone(1100,0.06,'triangle',0.025,420);
}
function updateProjectiles(){
  var i,j,b,e,p;
  for(i=bullets.length-1;i>=0;i--){
    b=bullets[i];b.px=b.x;b.py=b.y;b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.fire){b.vy+=0.06;b.r*=0.985;}
    var kill=(b.life<=0||b.x<cam.x-60||b.x>cam.x+view.w+60||b.y<cam.y-60||b.y>640);
    if(!kill&&level.buildings)for(var bi=0;bi<level.buildings.length;bi++){
      var wins=level.buildings[bi].windows;
      for(j=0;j<wins.length;j++)if(!wins[j].open&&b.x>wins[j].x&&b.x<wins[j].x+wins[j].w&&
        b.y>wins[j].y&&b.y<wins[j].y+wins[j].h){shatterWindow(wins[j]);kill=true;break;}
      if(kill)break;
    }
    if(!kill&&level.obstacles)for(var oi=0;oi<level.obstacles.length;oi++){
      var ob=level.obstacles[oi];
      if(!ob.dead&&!ob.decorative&&b.x>ob.x&&b.x<ob.x+ob.w&&b.y>ob.y&&b.y<ob.y+ob.h){
        damageObstacle(ob,b.dmg);kill=!b.fire;break;
      }
    }
    if(!kill)for(j=0;j<level.plats.length;j++){
      p=level.plats[j];
      if(p.dead||(p.obstacle&&p.obstacle.dead))continue;
      if(p.inside&&p.inside!==P.inB)continue;
      // Interior gunfire crosses stair treads and floor slabs so enemies on
      // adjacent storeys remain valid targets; outer walls still stop shots.
      if(P.inB&&p.inside===P.inB&&(p.step||p.interiorFloor))continue;
      if(!p.oneway&&b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        kill=true;if(b.rocket)explode(b.x,b.y,72,38,true);else burst(b.x,b.y,'#cfc8b0',4,2.2);break;}
    }
    if(!kill)for(j=0;j<enemies.length;j++){
      e=enemies[j];
      if(e.hidden||(e.inB||null)!==(P.inB||null))continue;
      if(!e.dead&&b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
        damageEnemy(e,b.dmg);if(b.rocket)explode(b.x,b.y,68,28,true);if(!b.fire)kill=true;break;}
    }
    if(!kill&&boss&&boss.state!=='dead'&&b.x>boss.x+8&&b.x<boss.x+boss.w-6&&
       b.y>boss.y-38&&b.y<boss.y+boss.h){damageBoss(b.dmg);if(!b.fire)kill=true;}
    if(kill)bullets.splice(i,1);
  }
  for(i=ebullets.length-1;i>=0;i--){
    b=ebullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.rocket&&tick%2===0)addPart(b.x,b.y,rnd(-.4,.4),rnd(-.4,.2),'rgba(190,190,190,1)',16,3,0.01);
    if(b.shock)b.vy=0;
    var k2=(b.life<=0||b.x<cam.x-90||b.x>cam.x+view.w+90||b.y>640);
    if(!k2)for(j=0;j<level.plats.length;j++){
      p=level.plats[j];
      if(p.dead||(p.obstacle&&p.obstacle.dead))continue;
      if(p.inside&&p.inside!==P.inB)continue;
      if(!p.oneway&&b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        if(b.rocket)explode(b.x,b.y,60,0,false);else burst(b.x,b.y,'#ffbb66',4,2);
        k2=true;break;}
    }
    if(!k2&&hit(P,{x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2})){
      hurtPlayer(b.dmg||14,b.x);
      if(b.rocket)explode(b.x,b.y,50,0,false);
      k2=true;
    }
    if(k2)ebullets.splice(i,1);
  }
  for(i=nades.length-1;i>=0;i--){
    var n=nades[i];n.vy+=0.42;n.x+=n.vx;n.y+=n.vy;n.life--;n.sp+=n.vx*0.05;
    var landed=false;
    for(j=0;j<level.plats.length;j++){
      var q=level.plats[j];if(q.oneway)continue;
      if(q.inside&&q.inside!==P.inB)continue;
      if(n.x>q.x&&n.x<q.x+q.w&&n.y+6>q.y&&n.y<q.y+q.h){
        n.y=q.y-6;n.vy*=-0.35;n.vx*=0.6;
        if(Math.abs(n.vy)<1.2)landed=true;
      }
    }
    if(n.life<=0||(landed&&n.mine===false)||(landed&&n.life<60)){
      explode(n.x,n.y,n.mine?86:66,n.mine?70:20,n.mine);
      nades.splice(i,1);continue;
    }
    if(n.y>640)nades.splice(i,1);
  }
  for(i=swings.length-1;i>=0;i--){
    var s=swings[i];s.life--;
    s.x=P.x+(P.facing>0?P.w-4:-(s.w-4));s.y=P.y+(P.prone?P.h-26:2);
    for(j=0;j<enemies.length;j++){
      e=enemies[j];
      if(!e.dead&&hit(s,e)&&!s.done['e'+j]){s.done['e'+j]=true;damageEnemy(e,s.dmg);
        e.vx=P.facing*(s.kind==='bite'?2.2:4);e.vy=s.kind==='bite'?-2.2:-4;
        if(s.kind==='bite')burst(e.x+e.w/2,e.y+e.h/2,'#f0e2c0',5,2.2);
        cam.shake=Math.max(cam.shake,s.kind==='bite'?3:5);}
    }
    if(s.kind!=='bite')for(j=ebullets.length-1;j>=0;j--){
      var eb=ebullets[j];
      if(hit(s,{x:eb.x-eb.r,y:eb.y-eb.r,w:eb.r*2,h:eb.r*2})){
        burst(eb.x,eb.y,'#ffe07a',8,3.4);ebullets.splice(j,1);tone(880,0.06,'square',0.05,1500);}
    }
    if(boss&&boss.state!=='dead'&&hit(s,boss)&&!s.done.boss){s.done.boss=true;damageBoss(s.dmg);}
    if(s.life<=0)swings.splice(i,1);
  }
  for(i=items.length-1;i>=0;i--){
    var it=items[i];it.bob+=0.08;
    if(hit(P,it)){
      if(it.kind==='mission'){SFX.pick();completeObjective();}
      else if(it.kind==='cheese'){P.hp=Math.min(P.maxHp,P.hp+38);SFX.cheese();score+=50;
        burst(it.x+13,it.y+13,'#ffd94a',12,3);}
      else if(it.kind==='nade'){P.nades=Math.min(9,P.nades+3);SFX.pick();score+=50;}
      else {
        var pickupIsStronger=WEAPONS[it.wep].power>WEAPONS[P.weapon].power;
        equipWeapon(it.wep,WEAPONS[it.wep].ammo,pickupIsStronger);SFX.pick();score+=100;
        burst(it.x+13,it.y+13,WEAPONS[it.wep].col||'#fff',14,3);}
      addLight(it.x+13,it.y+13,110,'#ffe6a8',14);
      items.splice(i,1);
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var pa=parts[i];pa.x+=pa.vx;pa.y+=pa.vy;pa.vy+=pa.gr;pa.vx*=0.985;pa.life--;
    if(pa.life<=0)parts.splice(i,1);
  }
  for(i=flashes.length-1;i>=0;i--){flashes[i].life--;if(flashes[i].life<=0)flashes.splice(i,1);}
  for(i=lights.length-1;i>=0;i--){lights[i].life--;if(lights[i].life<=0)lights.splice(i,1);}
}

var _skyG=null,_skyK='';
function paintSky(){

  g.fillRect(x0,y0,vw,vh);
  g.fillStyle='rgba(255,246,225,.72)';ell(g,mx,my,26,26);g.fill();

function silhouette(band,color,par,baseY){
  var th=level.theme,i,x0=cam.x,vw=view.w;
  g.fillStyle=color;
  g.beginPath();
  var bottom=cam.y+view.h;
  g.moveTo(x0-40,bottom);
  for(i=0;i<level.props.length;i++){
    var pr=level.props[i];if(pr.band!==band)continue;
    var sx=pr.x+cam.x*(par-1), w=pr.w, top=baseY-pr.h*(band?0.7:1);
    if(sx+w<x0-60||sx>x0+vw+60)continue;
    if(th.prop==='city'){
      g.lineTo(sx,bottom);g.lineTo(sx,top);g.lineTo(sx+w,top);g.lineTo(sx+w,bottom);
    } else if(th.prop==='pipe'){
      g.lineTo(sx,bottom);g.lineTo(sx,top+30);
      g.quadraticCurveTo(sx+w/2,top-24,sx+w,top+30);g.lineTo(sx+w,bottom);
    } else if(th.prop==='junk'){
      g.lineTo(sx,bottom);g.lineTo(sx+w*0.2,top+40);g.lineTo(sx+w*0.55,top);
      g.lineTo(sx+w*0.8,top+55);g.lineTo(sx+w,bottom);
    } else {
      g.lineTo(sx,bottom);g.lineTo(sx+w*0.12,top);g.lineTo(sx+w*0.3,top);
      g.lineTo(sx+w*0.3,top+50);g.lineTo(sx+w,top+50);g.lineTo(sx+w,bottom);
    }
  }
  g.lineTo(x0+vw+40,bottom);g.closePath();g.fill();
  // Small lit/readable marks prevent the parallax masses from feeling flat.
  for(i=0;i<level.props.length;i++){
    var dp=level.props[i];if(dp.band!==band)continue;
    var dx=dp.x+cam.x*(par-1),dw=dp.w,dtop=baseY-dp.h*(band?0.7:1);
    if(dx+dw<x0-60||dx>x0+vw+60)continue;
    if(th.prop==='city'){
      g.fillStyle=hexA(th.lamp,band?0.075:0.045);
      for(var wy=dtop+18;wy<Math.min(baseY-22,dtop+dp.h*.62);wy+=25)
        for(var wx=dx+13;wx<dx+dw-10;wx+=22)if(((wx+wy+dp.x)|0)%3)g.fillRect(wx,wy,7,10);
    } else if(th.prop==='pipe'){
      g.strokeStyle='rgba(150,180,165,'+(band?.08:.05)+')';g.lineWidth=3;
      g.beginPath();g.moveTo(dx+8,dtop+28);g.quadraticCurveTo(dx+dw/2,dtop-14,dx+dw-8,dtop+28);g.stroke();
    } else if(th.prop==='junk'){
      g.strokeStyle='rgba(205,150,75,'+(band?.07:.04)+')';g.lineWidth=2;
      g.beginPath();g.moveTo(dx+dw*.18,baseY-12);g.lineTo(dx+dw*.55,dtop+8);g.lineTo(dx+dw*.82,baseY-18);g.stroke();
    }
  }
}

        for(j=38;j<p.w-45;j+=128){rr(g,p.x+j,p.y+5,54,12,2);g.fill();
          g.strokeStyle='rgba(150,185,160,.18)';g.lineWidth=1;rr(g,p.x+j+.5,p.y+5.5,53,11,2);g.stroke();

function playerReachedExit(){

function drawBrother(x,y,face,broIdx,aim,walk,prone,inAir,alpha,wep,fireT){
  var B=BROS[broIdx],big=B.big,i;
  g.save();
  g.globalAlpha=alpha===undefined?1:alpha;
  g.translate(x,y);g.scale(face*0.55,0.55);
  var cr=prone?34:0;
  var sw=Math.sin(walk),bob=inAir?0:Math.abs(Math.cos(walk))*1.6;
  var hip=-34+cr*0.42-bob*0.3;
  var chest=-62+cr-bob, neck=-64+cr-bob;
  var bw=big?18:13;
  var la=inAir?-8:sw*9, lb=inAir?9:-sw*9;

  // ================= tail =================
  g.strokeStyle=B.tail;g.lineWidth=big?7.5:4.5;g.lineCap='round';
  g.beginPath();g.moveTo(-bw+5,hip+3);
  g.quadraticCurveTo(-bw-27,hip-8+sw*7,-bw-37,hip+20+sw*4);g.stroke();
  g.lineCap='butt';

  // ================= back arm =================
  g.save();g.translate(-4,chest+10);g.rotate(inAir?-0.5:sw*0.5+0.35);
  limb(0,0,0,15,big?9:7,big?B.furD:B.coatD);
  g.fillStyle=B.glove;ell(g,0,17,4.6,4.2);g.fill();
  g.restore();

  // ================= legs =================
  if(big){
    // knee-length cargo shorts, bare shins, work boots
    g.strokeStyle=B.pantsD;g.lineWidth=15;g.lineCap='round';
    g.beginPath();g.moveTo(-5,hip);g.lineTo(-5+la*0.4,hip+13);g.stroke();
    g.strokeStyle=B.pants;
    g.beginPath();g.moveTo(6,hip);g.lineTo(6+lb*0.4,hip+13);g.stroke();
    g.strokeStyle=B.furD;g.lineWidth=9;g.lineCap='round';               // shins
    g.beginPath();g.moveTo(-5+la*0.4,hip+13);g.lineTo(-5+la,hip+24);g.stroke();
    g.strokeStyle=B.fur;
    g.beginPath();g.moveTo(6+lb*0.4,hip+13);g.lineTo(6+lb,hip+24);g.stroke();
    g.lineCap='butt';
    var bY=-14;
    g.fillStyle=lin(g,0,bY,0,0,[[0,B.bootL],[1,B.boot]]);
    rr(g,-14+la,bY,20,14,4);g.fill();ink(g,'rgba(8,6,8,.8)',1.9);
    rr(g,-1+lb,bY,20,14,4);g.fill();ink(g,'rgba(8,6,8,.8)',1.9);
    g.fillStyle='rgba(0,0,0,.5)';                                        // soles
    rr(g,-15+la,-4,22,4,2);g.fill();rr(g,-2+lb,-4,22,4,2);g.fill();
  } else {
    // full-length dark cargo pants with rolled cuffs + red sneakers
    g.strokeStyle=B.pantsD;g.lineWidth=11;g.lineCap='round';
    g.beginPath();g.moveTo(-5,hip);g.lineTo(-5+la*0.5,hip+14);g.lineTo(-5+la,hip+24);g.stroke();
    g.strokeStyle=B.pants;
    g.beginPath();g.moveTo(5,hip);g.lineTo(5+lb*0.5,hip+14);g.lineTo(5+lb,hip+24);g.stroke();
    g.lineCap='butt';
    var sY=-11;
    g.fillStyle=B.boot;
    rr(g,-13+la,sY,19,11,4);g.fill();ink(g,'rgba(8,6,8,.8)',1.7);
    rr(g,0+lb,sY,19,11,4);g.fill();ink(g,'rgba(8,6,8,.8)',1.7);
    g.fillStyle=B.bootL;                                                  // white soles + toe caps
    rr(g,-14+la,-4.5,21,5,2);g.fill();rr(g,-1+lb,-4.5,21,5,2);g.fill();
    ell(g,-9+la,sY+6,4.6,4.6);g.fill();ell(g,4+lb,sY+6,4.6,4.6);g.fill();
  }

  // ================= torso =================
  if(big){
    // dark chest fur showing through the open vest
    g.fillStyle=lin(g,-bw,chest,bw,hip+6,[[0,B.chest],[1,B.chestD]]);
    g.beginPath();
    g.moveTo(-bw,chest+3);
    g.quadraticCurveTo(-bw-4,chest+16,-bw+1,hip+7);
    g.lineTo(bw-1,hip+7);
    g.quadraticCurveTo(bw+4,chest+15,bw,chest+3);
    g.quadraticCurveTo(0,chest-3,-bw,chest+3);
    g.closePath();g.fill();ink(g,'rgba(8,6,8,.75)',2);
    // vest panels (worn red, zipper down the middle)
    g.fillStyle=lin(g,-bw-3,chest,-bw+10,hip+8,[[0,B.coatL],[1,B.coatD]]);
    rr(g,-bw-3,chest+1,12,hip-chest+7,3);g.fill();ink(g,'rgba(8,6,8,.8)',2);
    g.fillStyle=lin(g,bw-10,chest,bw+3,hip+8,[[0,B.coat],[1,B.coatD]]);
    rr(g,bw-10,chest+1,13,hip-chest+7,3);g.fill();ink(g,'rgba(8,6,8,.8)',2);
    // popped collar
    g.fillStyle=B.coatL;
    g.beginPath();g.moveTo(bw-9,chest+2);g.lineTo(bw+2,chest-9);
    g.lineTo(bw+4,chest+4);g.closePath();g.fill();ink(g,'rgba(8,6,8,.7)',1.6);
    g.fillStyle=B.coatD;
    g.beginPath();g.moveTo(-bw+2,chest+2);g.lineTo(-bw-2,chest-7);
    g.lineTo(-bw+7,chest+3);g.closePath();g.fill();
    // ---- shell belt around the waist
    g.fillStyle='#6b5332';rr(g,-bw-2,hip+1,bw*2+4,8,2);g.fill();ink(g,'rgba(8,6,8,.75)',1.5);
    for(i=0;i<5;i++){
      var sx=-bw+2+i*(bw*2/4.7);
      g.fillStyle=B.trim;rr(g,sx,hip+1,5,8,1.5);g.fill();
    }
  } else {
    // open blue bomber jacket over a light shirt
    g.fillStyle=B.shirt;
    rr(g,-7,chest+1,14,hip-chest+6,2);g.fill();
    g.fillStyle=lin(g,-bw,chest,bw,hip+6,[[0,B.coatL],[0.55,B.coat],[1,B.coatD]]);
    g.beginPath();
    g.moveTo(-bw,chest+2);
    g.quadraticCurveTo(-bw-3,chest+16,-bw+1,hip+7);
    g.lineTo(-4,hip+7);g.lineTo(-4,chest+2);
    g.closePath();g.fill();ink(g,'rgba(8,6,8,.78)',1.8);
    g.beginPath();
    g.moveTo(bw,chest+2);
    g.quadraticCurveTo(bw+3,chest+15,bw-1,hip+7);
    g.lineTo(5,hip+7);g.lineTo(5,chest+2);
    g.closePath();g.fill();ink(g,'rgba(8,6,8,.78)',1.8);
    // collar
    g.fillStyle=B.coatD;
    g.beginPath();g.moveTo(bw-1,chest+2);g.lineTo(4,chest-6);g.lineTo(3,chest+6);g.closePath();g.fill();
    g.beginPath();g.moveTo(-bw+1,chest+2);g.lineTo(-4,chest-5);g.lineTo(-3,chest+6);g.closePath();g.fill();
    // one clean cream shirt block keeps the blue jacket silhouette readable
    g.fillStyle='rgba(255,255,255,.18)';rr(g,-4,chest+5,8,hip-chest-1,2);g.fill();
  }
  // rim light on the leading edge
  g.strokeStyle='rgba(255,228,182,.26)';g.lineWidth=2;
  g.beginPath();g.moveTo(bw-1,chest+5);g.quadraticCurveTo(bw+4,chest+16,bw-1,hip+6);g.stroke();

  // ================= head =================
  g.save();g.translate(3,neck-12);
  ratHead(B,big,aim.y<0);
  g.restore();

  // ================= material detail / readable gear =================
  g.strokeStyle=big?'rgba(255,195,150,.18)':'rgba(180,220,255,.22)';g.lineWidth=1.25;
  g.beginPath();g.moveTo(-bw+3,chest+9);g.quadraticCurveTo(0,chest+13,bw-3,chest+9);g.stroke();
  g.fillStyle='rgba(255,255,255,.18)';
  if(big){
    rr(g,-bw-1,chest+15,7,9,1.5);g.fill();                    // worn vest patch
    g.strokeStyle='rgba(255,220,170,.25)';g.lineWidth=1;
    g.beginPath();g.moveTo(-bw,hip-6);g.lineTo(-bw+7,hip-2);g.moveTo(bw-8,chest+7);g.lineTo(bw-3,chest+13);g.stroke();
  } else {
    g.fillStyle=B.trim;ell(g,0,chest+14,1.2,1.2);g.fill();ell(g,0,chest+21,1.2,1.2);g.fill();
    g.strokeStyle='rgba(230,240,255,.28)';g.lineWidth=1.2;g.beginPath();g.moveTo(-bw+2,hip+3);g.lineTo(bw-2,hip+3);g.stroke();
  }

  // ================= front arm + weapon =================
  g.save();
  g.translate(big?6:4,chest+11);
  drawWeaponArm(B,Math.atan2(aim.y,aim.x*face),wep,fireT);
  g.restore();
  g.restore();
}

function paintProjectiles(){
  var i;

    var gv=grenadeVelocity(P.nadeCharge),gx=P.x+P.w/2,gy=P.y+8;
    g.fillStyle=gv.tier===2?'rgba(255,210,80,.82)':gv.tier===1?'rgba(185,225,130,.72)':'rgba(210,225,220,.62)';
    for(var gt=3;gt<=30;gt+=3){
      var ga=1-gt/36;g.globalAlpha=ga;ell(g,gx+gv.vx*gt,gy+gv.vy*gt+0.21*gt*gt,2.3,2.3);g.fill();
    }
    g.globalAlpha=1;
    for(var gp=0;gp<3;gp++){
      g.fillStyle=gp<=gv.tier?'#e8c25a':'rgba(255,255,255,.18)';ell(g,gx-10+gp*10,P.y-10,3.2,3.2);g.fill();
    }
  }
  for(i=0;i<bullets.length;i++){
    var b=bullets[i];
    if(b.fire){
      g.globalCompositeOperation='lighter';
      var a=Math.min(1,b.life/24);
      g.fillStyle=rad(g,b.x,b.y,0,b.r*2.4,[[0,'rgba(255,230,150,'+a+')'],

      g.beginPath();g.arc(b.x,b.y,b.r*2.4,0,6.283);g.fill();
      g.globalCompositeOperation='source-over';

      var ln=Math.hypot(b.vx,b.vy),ux=b.vx/ln,uy=b.vy/ln;
      g.strokeStyle='rgba(255,214,130,.35)';g.lineWidth=b.r*1.4;
      g.beginPath();g.moveTo(b.x-ux*16,b.y-uy*16);g.lineTo(b.x,b.y);g.stroke();
      g.fillStyle=b.col;ell(g,b.x,b.y,b.r*1.5,b.r);g.fill();
      g.fillStyle='#fff';ell(g,b.x,b.y,b.r*0.55,b.r*0.45);g.fill();
    }
  }
  for(i=0;i<ebullets.length;i++){
    var e=ebullets[i];
    if(e.rocket){
      g.save();g.translate(e.x,e.y);g.rotate(Math.atan2(e.vy,e.vx));
      g.fillStyle=lin(g,-11,-5,11,5,[[0,'#8e2f24'],[1,'#d0503a']]);
      rr(g,-11,-4.5,20,9,3);g.fill();ink(g,'rgba(6,4,4,.8)',1.4);
      g.fillStyle='#e8e2d6';
      g.beginPath();g.moveTo(9,-4.5);g.lineTo(17,0);g.lineTo(9,4.5);g.closePath();g.fill();
      g.fillStyle='#2a2a2e';
      g.beginPath();g.moveTo(-11,-4);g.lineTo(-16,-8);g.lineTo(-13,0);g.closePath();g.fill();
      g.globalCompositeOperation='lighter';
      g.fillStyle=rad(g,-16,0,0,16,[[0,'rgba(255,200,90,.85)'],[1,'rgba(255,80,0,0)']]);
      g.beginPath();g.arc(-16,0,16,0,6.283);g.fill();
      g.globalCompositeOperation='source-over';
      g.restore();
    } else if(e.shock){
      g.fillStyle='rgba(214,178,120,.75)';
      g.beginPath();g.moveTo(e.x-9,e.y+4);g.lineTo(e.x,e.y-20);g.lineTo(e.x+9,e.y+4);g.closePath();g.fill();
    } else {
      if(e.pistol){
        var el=Math.hypot(e.vx,e.vy)||1;
        g.strokeStyle='rgba(255,226,150,.45)';g.lineWidth=e.r;
        g.beginPath();g.moveTo(e.x-e.vx/el*15,e.y-e.vy/el*15);g.lineTo(e.x,e.y);g.stroke();
        g.fillStyle='#ffe08a';ell(g,e.x,e.y,e.r*1.3,e.r);g.fill();
      } else {g.fillStyle='#ff8a4c';ell(g,e.x,e.y,e.r,e.r);g.fill();}
    }
  }
  for(i=0;i<nades.length;i++){
    var n=nades[i];
    g.save();g.translate(n.x,n.y);g.rotate(n.sp);
    g.fillStyle=n.mine?'#5a6b3a':'#5a3a34';
    ell(g,0,0,7,8);g.fill();ink(g,'rgba(6,6,4,.8)',1.6);
    g.fillStyle='#2a2f18';g.fillRect(-3,-9,6,4);
    g.restore();

      g.fillStyle=rad(g,n.x,n.y-10,0,14,[[0,'rgba(255,120,60,.9)'],[1,'rgba(255,0,0,0)']]);
      g.beginPath();g.arc(n.x,n.y-10,14,0,6.283);g.fill();
      g.globalCompositeOperation='source-over';
    }
  }
  for(i=0;i<swings.length;i++){
    var s=swings[i],a=s.life/(s.max||10);
    if(s.kind==='bite'){
      var bx=P.x+P.w/2+P.facing*29,by=P.y+(P.prone?9:14),open=Math.sin(a*Math.PI)*8;
      g.strokeStyle='rgba(245,230,195,'+(a*.95)+')';g.lineWidth=4;g.lineCap='round';
      g.beginPath();g.arc(bx,by-open*.35,14,P.facing>0?-.75:Math.PI-.75,P.facing>0?.75:Math.PI+.75);g.stroke();
      g.beginPath();g.arc(bx,by+open*.35,14,P.facing>0?-.75:Math.PI-.75,P.facing>0?.75:Math.PI+.75);g.stroke();g.lineCap='butt';
    } else {
      g.strokeStyle='rgba(255,240,200,'+(a*0.8)+')';g.lineWidth=6;g.beginPath();
      g.arc(P.x+P.w/2,P.y+16,44,P.facing>0?-1.15:2.0,P.facing>0?1.15:4.28);g.stroke();
    }
  }
  for(i=0;i<parts.length;i++){
    var p=parts[i],al=Math.max(0,p.life/p.max);
    g.globalAlpha=al;g.fillStyle=p.col;
    ell(g,p.x,p.y,p.s*0.7,p.s*0.55);g.fill();
    g.globalAlpha=1;
  }
}
function paintLighting(){
  var i;
  g.globalCompositeOperation='lighter';
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],a=f.life/f.max,L=34*f.s*a+10;
    g.save();g.translate(f.x,f.y);g.rotate(f.a);
    g.fillStyle='rgba(255,226,150,'+(0.9*a)+')';
    g.beginPath();g.moveTo(0,0);g.lineTo(L,-L*0.36);g.lineTo(L*1.3,0);g.lineTo(L,L*0.36);g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,'+(0.7*a)+')';
    g.beginPath();g.arc(0,0,L*0.30,0,6.283);g.fill();
    g.restore();
  }
  for(i=0;i<lights.length;i++){
    var l=lights[i],aa=l.life/l.max;
    g.fillStyle=rad(g,l.x,l.y,0,l.r,[[0,hexA(l.col,0.42*aa)],[0.5,hexA(l.col,0.14*aa)],[1,'rgba(0,0,0,0)']]);
    g.beginPath();g.arc(l.x,l.y,l.r,0,6.283);g.fill();
  }
  g.globalCompositeOperation='source-over';
}
function paintWeather(){
  var th=level.theme,i;

  g.globalCompositeOperation='lighter';
  for(i=0;i<motes.length;i++){
    var m=motes[i];
    var mx=cam.x+((m.x*view.w + tick*m.sp*0.6)%view.w);
    var my=cam.y+((m.y*view.h + Math.sin(tick*0.01+m.ph)*24+view.h)%view.h);

    g.strokeStyle='rgba(190,215,235,'+(0.22*(1-P.interiorFade))+')';g.lineWidth=1.2;

function comicBurst(cx,cy,rx,ry){

    var x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r;

    pg.strokeStyle='rgba(0,0,0,.5)';pg.lineWidth=1.5;pg.stroke();
    if(!b.p){
      pg.fillStyle='rgba(255,255,255,.45)';
      ell(pg,b.x-b.r*0.26,b.y-b.r*0.30,b.r*0.24,b.r*0.15);pg.fill();
    }
    pg.fillStyle=b.p?'rgba(255,255,255,.95)':'rgba(30,10,8,.68)';
    pg.font='bold '+(b.r*0.72)+'px Impact,sans-serif';
    pg.textAlign='center';pg.textBaseline='middle';
    pg.fillText(b.l,b.x,b.y+(b.p?b.r*0.06:0)-b.r*0.14);
    pg.fillStyle=b.p?'rgba(255,255,255,.85)':'rgba(40,14,10,.60)';
    pg.font=Math.max(7,b.r*0.30)+'px Impact,sans-serif';
    pg.fillText(b.sub,b.x,b.y+(b.p?b.r*0.06:0)+b.r*0.46);
    pg.textAlign='left';pg.textBaseline='alphabetic';
  }
  // ---- small buttons ----
  for(i=0;i<SMALL.length;i++){
    var s=SMALL[i];
    pg.fillStyle=lin(pg,s.x,s.y-s.r,s.x,s.y+s.r,[[0,'#3b3b41'],[1,'#111113']]);
    ell(pg,s.x,s.y,s.r*1.35,s.r*1.3);pg.fill();
    pg.fillStyle=rad(pg,s.x-s.r*0.3,s.y-s.r*0.3,s.r*0.05,s.r*1.2,
      s.p?[[0,'#c0392b'],[1,'#6d1108']]:[[0,'#ff8b7a'],[0.5,'#e0392c'],[1,'#7d1109']]);
    ell(pg,s.x,s.y,s.r*(s.p?0.92:1),s.r*(s.p?0.92:1));pg.fill();
    pg.strokeStyle='rgba(0,0,0,.5)';pg.lineWidth=1;pg.stroke();
    pg.fillStyle='rgba(255,255,255,.62)';
    pg.font=Math.max(6.5,s.r*0.62)+'px Impact,sans-serif';
    pg.textAlign='center';pg.fillText(s.l,s.x,s.y+s.r*2.3);pg.textAlign='left';
  }
  // vent slots
  pg.fillStyle='rgba(0,0,0,.5)';
  for(i=0;i<6;i++){rr(pg,w*0.44+i*4,h*0.86,2,h*0.07,1);pg.fill();}
}

/* ==================== LOOP ==================== */
function updateCamera(){
  var mobile=matchMedia('(pointer:coarse)').matches;
  var compact=mobile?clamp((520-Math.min(view.cssW,view.cssH))/260,0,1):0;
  var mobileBase=mobile?(1.16+compact*.14):1;
  var targetZoom=P.inB?mobileBase+.18:mobileBase;
  cam.zoom=lerp(cam.zoom,targetZoom,P.inB?0.075:0.055);
  var visibleW=view.w/cam.zoom,visibleH=view.h/cam.zoom,t,ty;
  if(P.inB){
    t=P.inB.x+P.inB.w/2-visibleW/2;
    ty=P.inB.y+P.inB.h/2-visibleH/2+12;
  } else {
    t=P.x+P.w/2-visibleW*0.44+P.facing*22;
    ty=VIEW_BOTTOM-visibleH;
  }
  cam.x+=(t-cam.x)*(P.inB?0.085:0.13);
  cam.x=clamp(cam.x,0,Math.max(0,level.length-visibleW));
  cam.y=lerp(cam.y,ty,P.inB?0.085:0.10);
  if(cam.shake>0.4)cam.shake*=0.87;else cam.shake=0;
}
function step(){
  tick++;poll();
  var anyStart=anyKey||anyButtonPressed()||tapped;
  if(state==='TITLE'){ if(anyStart){Music.menu();SFX.start();state='SELECT';stateT=0;tapped=false;} return; }
  if(state==='SELECT'){
    if(pressed('left')&&selIdx!==0){selIdx=0;SFX.selectMove();}
    if(pressed('right')&&selIdx!==1){selIdx=1;SFX.selectMove();}
    if(pressed('fire')||pressed('start')||tapped||selectDeployTap){
      tapped=false;selectDeployTap=false;SFX.selectConfirm();makePlayer(selIdx);lives=3;score=0;
      campaignSeed=(Date.now()^(Math.random()*0x7fffffff))>>>0;
      campaign=CAMPAIGNS[campaignSeed%CAMPAIGNS.length];startStage(1);
    }
    return;
  }
  if(state==='INTRO'){
    stateT++;var itl=introTimeline();
    if(stateT>=itl.objectiveStart&&stateT<itl.ready-14&&stateT%4===0&&introTypeMark!==stateT){
      introTypeMark=stateT;tone(720+rnd(-45,45),.018,'square',.006,610);
    }
    if(stateT>itl.ready&&(anyButtonPressed()||tapped)){tapped=false;state='PLAY';stateT=0;SFX.start();}
    return;
  }
  tapped=false;
  if(state==='EXITING'){
    stateT++;P.vx=0;P.vy=0;P.y+=P.exitDown?2.1:-2.1;P.anim+=.18;updateCamera();Music.update();
    if(stateT>58){state='CLEAR';stateT=0;}
    return;
  }
  if(state==='PAUSE'){if(pressed('pause')||pressed('start')){state='PLAY';setPauseModal(false);}return;}
  if(state==='DEAD'){
    stateT++;updateProjectiles();
    if(stateT>90){
      if(lives<=0){state='GAMEOVER';stateT=0;if(score>hiScore)hiScore=score;}
      else{
        P.dead=false;P.hp=P.maxHp;P.inv=140;P.vx=0;P.vy=0;P.h=42;P.inB=null;P.doorT=0;
        var sp=safeRespawn(P.checkX);P.x=sp.x;P.y=sp.y;
        for(var ei=enemies.length-1;ei>=0;ei--){
          var nearby=enemies[ei];
          // Never erase enemies required to unlock the stage during respawn cleanup.
          if(!nearby.miniBoss&&!nearby.objective&&Math.abs(nearby.x-sp.x)<300){
            burst(nearby.x+12,nearby.y+12,'#7a7a7a',6,3);enemies.splice(ei,1);
          }
        }
        if(WEAPONS[P.weapon].ammo!==Infinity&&P.ammo<=0)equipWeapon('scratch');
        P.nades=Math.max(P.nades,3);ebullets=[];nades=[];
        state='PLAY';
      }
    }
    return;
  }
  if(state==='CLEAR'){stateT++;if(stateT>150)startStage(stage+1);return;}
  if(state==='GAMEOVER'||state==='WIN'){
    stateT++;
    if(stateT>60&&(anyKey||anyButtonPressed()||tapped)){
      tapped=false;
      if(score>hiScore)hiScore=score;Music.menu();state='TITLE';stateT=0;
    }
    return;
  }
  if(pressed('pause')){state='PAUSE';if(matchMedia('(pointer:coarse)').matches)setPauseModal(true);return;}
  updatePlayer();updateEnemies();updateBoss();updateProjectiles();updateCamera();Music.update();
  if(!level.boss&&playerReachedExit()){
    P.exitDown=level.exit.kind==='toilet'||level.exit.kind==='containerdrop';
    state='EXITING';stateT=0;score+=1000+stage*250;SFX.clear();
  }
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,view.cssW,view.cssH);
  if(state==='TITLE'){drawTitle();paintVignette();return;}
  if(state==='SELECT'){drawSelect();paintVignette();return;}
  if(state==='INTRO'){drawIntro();paintVignette();return;}

  var shx=cam.shake?rnd(-cam.shake,cam.shake):0, shy=cam.shake?rnd(-cam.shake,cam.shake):0;
  var sc=DPR*view.scale*cam.zoom;
  g.setTransform(sc,0,0,sc,(-cam.x+shx)*sc,(-cam.y+shy)*sc);

  paintSky();
  silhouette(0,level.theme.sil,0.55,520);
  paintFog();
  silhouette(1,level.theme.sil2,0.78,540);
  paintRays();
  paintLamps();
  paintGround();
  paintSetpieces();
  paintIngress();
  paintInteriorFocus();
  paintBuildings();
  paintObstacles();
  paintExit();
  paintItems();
  // enemies
  var i;
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.x-cam.x<-90||e.x-cam.x>view.w+90)continue;
    if((e.inB||null)!==(P.inB||null))continue;
    if(e.t!=='bat'){var gy=groundYAt(level,e.x+e.w/2);if(gy!==null&&Math.abs(gy-(e.y+e.h))<60)shadowBlob(e.x+e.w/2,gy+2,e.w*0.55,0.32);}
    if(e.hidden)continue;
    if(e.objective&&level.objective&&!level.objective.taskDone){
      g.fillStyle='#e8c25a';g.font='bold 17px Impact,sans-serif';g.textAlign='center';
      g.fillText('!',e.x+e.w/2,e.y-9-Math.sin(tick*.11)*3);g.textAlign='left';
    }
    if(e.miniBoss){
      var ep=e.miniPhase||miniPhaseFor(e),ec=ep===1?'235,70,55':ep===2?'255,195,55':'90,225,110';
      g.globalCompositeOperation='lighter';g.strokeStyle='rgba('+ec+','+(.32+.16*Math.sin(tick*.13))+')';g.lineWidth=e.specialT>0?7:4;
      g.beginPath();g.arc(e.x+e.w/2,e.y+e.h/2,Math.max(e.w,e.h)*.72,0,6.283);g.stroke();g.globalCompositeOperation='source-over';
      g.fillStyle=ep===1?'#ff7768':ep===2?'#ffd25c':'#82ec8d';g.font='bold 13px Impact,sans-serif';g.textAlign='center';g.fillText(e.name,e.x+e.w/2,e.y-18);g.textAlign='left';
    }
    if(e.t==='mouse')drawMouseThug(e);
    else if(e.t==='bat')drawBatBomber(e);
    else if(e.t==='weasel')drawWeasel(e);
    else if(e.t==='lizard')drawLizard(e);
    else drawCatBrute(e);
  }
  if(boss){shadowBlob(boss.x+boss.w/2,472,boss.w*0.52,0.42);drawBoss();}
  paintAimGuide();
  // player
  if(!P.dead&&(P.inv<=0||Math.floor(tick/4)%2===0)){
    var pgy=groundYAt(level,P.x+P.w/2);
    if(pgy!==null&&pgy>P.y)shadowBlob(P.x+P.w/2,pgy+2,P.w*0.6*(P.onGround?1:0.7),P.onGround?0.36:0.20);
    if(P.rollT>0){
      var rp=(P.rollMax-P.rollT)/P.rollMax;
      if(P.bro===1){
        g.save();g.globalCompositeOperation='lighter';
        for(var gh=2;gh>0;gh--){
          g.globalAlpha=.10*gh;g.translate(-P.rollDir*9,0);
          g.fillStyle='#78d8ff';ell(g,P.x+P.w/2,P.y+P.h/2,18+gh*3,12+gh*2);g.fill();
        }
        g.restore();
      }
      g.save();g.translate(P.x+P.w/2,P.y+P.h/2);g.rotate(P.rollDir*rp*6.283);g.translate(0,-P.h/2);
      drawBrother(0,P.h,P.facing,P.bro,{x:P.facing,y:0},P.anim,true,P.rollAir,1,P.weapon,0);g.restore();
    } else {
      if(P.bro===0&&!P.onGround&&P.vy>0.8){
        g.strokeStyle='rgba(255,205,90,'+(0.45+Math.sin(tick*.2)*.18)+')';g.lineWidth=3;
        g.beginPath();g.arc(P.x+P.w/2,P.y+P.h+2,13,0,6.283);g.stroke();
      }
      drawBrother(P.x+P.w/2,P.y+P.h,P.facing,P.bro,aimVector(),P.anim,P.prone,!P.onGround,1,P.weapon,P.fireT);
    }
  }
  paintProjectiles();
  paintLighting();
  paintWeather();
  paintForegroundParallax();
  // foreground darkening at the very bottom (cabinet depth)
  g.fillStyle=lin(g,0,560,0,VIEW_BOTTOM,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.75)']]);
  g.fillRect(cam.x-10,560,view.w+20,60);

  S();
  paintVignette();
  paintHUD();
  if(state==='PAUSE')overlay('PAUSED','','PRESS START','#e8c25a');
  if(state==='DEAD')overlay('SQUEAK!','a brother down','','#e05a4a');
  if(state==='CLEAR')overlay('STAGE CLEAR','+'+(1000+stage*250)+' PTS','','#8fbf6a');
  if(state==='GAMEOVER')overlay('GAME OVER','SCORE '+score,'PRESS ANY KEY','#e05a4a');
  if(state==='WIN'){
    overlay('P.C.U.-9 IS SCRAP','FINAL SCORE '+score,'PRESS ANY KEY','#e8c25a');
    txt('the sewer belongs to the brothers again',view.cssW/2,view.cssH*0.44+92,
      Math.min(14,view.cssW*0.034),'#8fbf6a','center');
  }
  var fadeA=0;
  if(state==='EXITING')fadeA=Math.max(fadeA,clamp((stateT-10)/48,0,1));
  if(state==='CLEAR'&&stateT<20)fadeA=Math.max(fadeA,1-stateT/20);
  if(fadeA>0){g.fillStyle='rgba(0,0,0,'+clamp(fadeA,0,1)+')';g.fillRect(0,0,view.cssW,view.cssH);}
}
var last=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  var dt=Math.min(50,t-last);last=t;acc+=dt;
  var guard=0;
  while(acc>=16.667&&guard<4){step();acc-=16.667;guard++;}
  if(guard>=4)acc=0;
  render();
  var touchControls=matchMedia('(pointer:coarse)').matches&&state==='PLAY';
  panelEl.style.visibility=touchControls?'visible':'hidden';
  if(touchControls)drawPad();
  else if(matchMedia('(pointer:coarse)').matches){
    pg.setTransform(DPR,0,0,DPR,0,0);pg.clearRect(0,0,pad.cssW,pad.cssH);
  }
  mobilePause.style.visibility=(state==='PLAY'||state==='PAUSE')?'visible':'hidden';
}
resize();
makePlayer(0);
level=buildLevel(1);
makeMotes();
requestAnimationFrame(loop);
})();
</script>
