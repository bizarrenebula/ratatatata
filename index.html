    g.fillStyle='#2a1030';ell(g,0,0,42,42);g.fill();g.stroke();
    g.fillStyle=rad(g,0,0,2,38,[[0,hexA(lit,0.95)],[0.6,hexA(lit,0.35)],[1,'rgba(0,0,0,0)']]);
    ell(g,0,0,38,38);g.fill();
    g.strokeStyle='rgba(20,14,24,.85)';g.lineWidth=6;
    for(i=0;i<3;i++){var an=i*1.047;g.beginPath();g.moveTo(-42*Math.cos(an),-42*Math.sin(an));g.lineTo(42*Math.cos(an),42*Math.sin(an));g.stroke();}
    g.fillStyle='#f6f1e2';ell(g,0,0,9,9);g.fill();
  }
  g.restore();
}
/* A square of the place: its own sky and ground, with its own thing on top. */
function drawLevelThumb(x,y,s,n){
  var th=STAGES[n-1];
  g.save();
  g.beginPath();rr(g,x,y,s,s,5);g.clip();
  g.fillStyle=lin(g,x,y,x,y+s,[[0,th.sky[0]],[0.6,th.sky[1]],[1,th.sky[2]]]);
  g.fillRect(x,y,s,s);
  g.fillStyle=hexA(th.fog,0.16);g.fillRect(x,y+s*0.45,s,s*0.55);
  g.fillStyle=th.gnd;g.fillRect(x,y+s*0.80,s,s*0.20);
  g.fillStyle=th.gtop;g.fillRect(x,y+s*0.80,s,Math.max(2,s*0.035));
  drawLevelIcon(x+s*0.5,y+s*0.46,s*0.74,n,th);
  g.restore();
}
function drawLevels(){
  var w=view.cssW,h=view.cssH,box=levelListBox(),rows=levelRows(),i;
  g.fillStyle=lin(g,0,0,0,h,[[0,'#0c1014'],[1,'#05080a']]);g.fillRect(0,0,w,h);
  txt('SELECT A JOB',w*0.5,h*0.075,Math.min(28,w*0.048),'#e8c25a','center');
  txt('THE ONES YOU HAVE FINISHED CAN BE RUN AGAIN',w*0.5,h*0.075+18,
    Math.min(11.5,w*0.02),'#7d8a70','center','Arial,sans-serif');
  g.save();
  g.beginPath();rr(g,box.x-4,box.y-4,box.w+8,box.h+8,8);g.clip();
  for(i=0;i<rows.length;i++){
    var r=rows[i];
    if(r.y+r.h<box.y-10||r.y>box.y+box.h+10)continue;         // off the list, skip it
    var n=r.n,open=stageUnlocked(n),sel=(levelIdx===i),th=STAGES[n-1],fl=STAGE_FLOW[n-1];
    var pad2=6,ts=r.h-pad2*2;
    g.globalAlpha=open?1:0.42;
    g.fillStyle=sel?'rgba(201,162,74,.12)':'rgba(255,255,255,.03)';
    rr(g,r.x,r.y,r.w,r.h,7);g.fill();
    drawLevelThumb(r.x+pad2,r.y+pad2,ts,n);
    var tx=r.x+pad2*2+ts;
    txt(n+'. '+th.name,tx,r.y+r.h*0.44,Math.min(16,r.w*0.036),open?'#efe6d2':'#6b7268','left');
    txt('"'+th.sub+'"',tx,r.y+r.h*0.72,Math.min(12,r.w*0.026),open?'#9aa894':'#5c6b4a','left','Arial,sans-serif');
    if(open&&sel&&fl)
      txt(fl.label,r.x+r.w-10,r.y+r.h*0.72,Math.min(10.5,r.w*0.023),'#8fbf6a','right','Arial,sans-serif');
    if(!open){
      var lx=r.x+r.w-18,ly=r.y+r.h*0.42;
      g.fillStyle='rgba(230,222,200,.5)';rr(g,lx-6,ly,12,9,2);g.fill();
      g.strokeStyle='rgba(230,222,200,.5)';g.lineWidth=2;
      g.beginPath();g.arc(lx,ly,4,Math.PI,0);g.stroke();
    }
    g.globalAlpha=1;
    g.strokeStyle=sel?(open?'#e8c25a':'#7a4a44'):'#242a28';g.lineWidth=sel?2.5:1.2;
    rr(g,r.x,r.y,r.w,r.h,7);g.stroke();
  }
  g.restore();
  // how far down the list you are
  var maxS=levelMaxScroll();
  if(maxS>0){
    var trackH=box.h,bh2=Math.max(28,trackH*(box.h/(STAGES.length*levelRowH())));
    var by2=box.y+(trackH-bh2)*(levelScroll/maxS);
    g.fillStyle='rgba(255,255,255,.06)';rr(g,box.x+box.w+7,box.y,4,trackH,2);g.fill();
    g.fillStyle='rgba(232,194,90,.55)';rr(g,box.x+box.w+7,by2,4,bh2,2);g.fill();
  }
  var bs=levelButtons(),selRow=rows[levelIdx],canGo=selRow&&stageUnlocked(selRow.n);
  for(i=0;i<bs.length;i++){
    var b=bs[i],live=(b.id!=='go')||canGo;
    g.fillStyle=live?'rgba(201,162,74,.13)':'rgba(255,255,255,.02)';
    rr(g,b.x,b.y,b.w,b.h,8);g.fill();
    g.strokeStyle=live?'rgba(232,194,90,.75)':'#232826';g.lineWidth=2;
    rr(g,b.x,b.y,b.w,b.h,8);g.stroke();
    txt(b.label,b.x+b.w/2,b.y+b.h*0.64,Math.min(15,b.w*0.11),live?'#efe6d2':'#4a524e','center');
  }
  txt(matchMedia('(pointer:coarse)').matches?'DRAG TO SCROLL  •  TAP A JOB, THEN CONTINUE':
      '↑ ↓ to pick  •  wheel to scroll  •  X to continue  •  ESC to go back',
    w*0.5,bs[0].y+bs[0].h+18,Math.min(11,w*0.018),'#5c6b4a','center','Arial,sans-serif');
}
/* Two ways off the game over screen: buy your way back in, or leave. */
function gameOverButtons(){
  var w=view.cssW,h=view.cssH,bw=Math.min(w*0.28,250),bh=Math.min(50,h*0.095),y=h*0.62;
  return [
    {id:'token',label:'INSERT TOKEN',sub:'ONE LIFE, WHERE YOU FELL',x:w*0.5-bw-9,y:y,w:bw,h:bh},
    {id:'quit', label:'QUIT TO MENU',sub:'END THE RUN',            x:w*0.5+9,   y:y,w:bw,h:bh}
  ];
}
function gameOverPointer(x,y){
  if(state!=='GAMEOVER'||stateT<=40)return false;
  var bs=gameOverButtons(),i;
  for(i=0;i<bs.length;i++){
    var b=bs[i];
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
      if(b.id==='token'&&tokens<=0)return true;
      overTap=(b.id==='token')?1:2;
      return true;
    }
  }
  return false;
}
function levelPick(){
  var rows=levelRows(),r=rows[levelIdx];
  if(!r||!stageUnlocked(r.n))return;
  /* Chosen here, confirmed on the character screen: the job is only started when
     the player says which brother is taking it. */
  pendingStage=r.n;SFX.selectConfirm();
  Music.menu();state='SELECT';stateT=0;tapped=false;
}
/* One pointer path for wheel, mouse and thumb. A drag scrolls; only a press that
   did not travel counts as a choice. */
function levelPointer(x,y,phase){
  var rows=levelRows(),bs=levelButtons(),i;
  if(phase==='move'){
    if(!levelDrag)return;
    levelScroll=clamp(levelDrag.from+(levelDrag.y-y),0,levelMaxScroll());
    if(Math.abs(levelDrag.y-y)>6)levelDrag.moved=true;
    return;
  }
  if(phase==='up'){
    var d=levelDrag;levelDrag=null;
    if(!d||d.moved)return;                       // a scroll, not a choice
    x=d.x;y=d.y;
  }
  if(phase==='down'){
    for(i=0;i<bs.length;i++){
      var b=bs[i];
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
        SFX.selectMove();
        if(b.id==='back'){state='MODE';stateT=0;}else levelPick();
        return;
      }
    }
    levelDrag={x:x,y:y,from:levelScroll,moved:false};
    return;
  }
  var box=levelListBox();
  if(y<box.y-6||y>box.y+box.h+6)return;
  for(i=0;i<rows.length;i++){
    var r=rows[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
      if(levelIdx!==i){levelIdx=i;SFX.selectMove();}
      return;
    }
  }
}
/* Draws an image to fill a rectangle the way CSS `cover` would: scaled to
   overflow, cropped on the long axis, anchored where the interesting part is. */
function drawCover(img,dx,dy,dw,dh,ax,ay){
  var iw=img.naturalWidth,ih=img.naturalHeight;
  var s=Math.max(dw/iw,dh/ih),sw=dw/s,sh=dh/s;
  g.drawImage(img,(iw-sw)*ax,(ih-sh)*ay,sw,sh,dx,dy,dw,dh);
}
/* The whole picture, nothing cropped, on a bed of itself blown up and pushed
   back. Cropping to fill would take either the ears or the boots off at almost
   every window shape; this fills the frame without cutting anybody. */
function drawFramed(img,dx,dy,dw,dh){
  g.save();g.beginPath();g.rect(dx,dy,dw,dh);g.clip();
  drawCover(img,dx,dy,dw,dh,0.5,0.5);
  g.fillStyle='rgba(5,7,12,.74)';g.fillRect(dx,dy,dw,dh);
  var s=Math.min(dw/img.naturalWidth,dh/img.naturalHeight);
  var iw=img.naturalWidth*s,ih=img.naturalHeight*s;
  g.drawImage(img,dx+(dw-iw)/2,dy+(dh-ih)/2,iw,ih);

    txt('PRESS ANY BUTTON TO CONTINUE',w/2,h*0.83,Math.min(17,w*0.038),'#9be36a','center');

function drawFloatStick(s,label,isAim){
  s.vx=lerp(s.vx,s.ax,.35);s.vy=lerp(s.vy,s.ay,.35);
  var sx=s.cx,sy=s.cy,R=s.r,kx=sx+s.vx*R*.48,ky=sy+s.vy*R*.48;
  var live=Math.hypot(s.ax,s.ay)>.24;
  var firing=isAim&&triggerLive;
  // Pushed hard with the safety on: show the thumb is at the trigger and the
  // gun is choosing not to fire, rather than leaving it looking broken.
  var safed=isAim&&!firing&&Math.hypot(s.ax,s.ay)>AUTOFIRE_ON;
  pg.fillStyle=firing?'rgba(60,12,8,.26)':safed?'rgba(20,30,26,.24)':'rgba(5,8,10,.20)';
  ell(pg,sx,sy,R,R);pg.fill();
  pg.strokeStyle=firing?'rgba(255,120,90,.75)':safed?'rgba(150,205,150,.55)':
    live?'rgba(255,220,125,.46)':'rgba(225,235,238,.25)';
  pg.lineWidth=firing?3:2;ell(pg,sx,sy,R,R);pg.stroke();
  if(isAim){
    /* The band between "aiming" and "firing" is worth showing: inside it you can
       turn to face a threat without spending ammo. */
    pg.strokeStyle='rgba(255,140,110,.22)';pg.lineWidth=1;
    ell(pg,sx,sy,R*AUTOFIRE_MIN,R*AUTOFIRE_MIN);pg.stroke();
  }
  if(isAim){
    /* A full-circle tick ring and a live bearing line sell the 360 aim. */
    pg.strokeStyle='rgba(225,235,238,.16)';pg.lineWidth=1;
    for(var a=0;a<8;a++){
      var an=a*0.7854,c=Math.cos(an),si=Math.sin(an);
      pg.beginPath();pg.moveTo(sx+c*R*.82,sy+si*R*.82);pg.lineTo(sx+c*R*.95,sy+si*R*.95);pg.stroke();
    }
    if(live){
      var m=Math.hypot(s.vx,s.vy)||1;
      pg.strokeStyle='rgba(255,120,110,.55)';pg.lineWidth=2;
      pg.beginPath();pg.moveTo(sx,sy);pg.lineTo(sx+s.vx/m*R*.95,sy+s.vy/m*R*.95);pg.stroke();
    }
  }
  pg.fillStyle='rgba(210,220,225,.16)';ell(pg,kx,ky,R*.48,R*.48);pg.fill();
  pg.strokeStyle='rgba(245,248,250,.36)';pg.lineWidth=1.5;ell(pg,kx,ky,R*.48,R*.48);pg.stroke();
  pg.fillStyle='rgba(240,245,246,.30)';pg.textAlign='center';pg.textBaseline='middle';
  pg.font='bold '+Math.max(8,R*.19)+'px Arial,sans-serif';pg.fillText(label,sx,sy+R+9);
}

/* ==================== LOOP ==================== */
function updateCamera(){
  var mobile=matchMedia('(pointer:coarse)').matches;
  var compact=mobile?clamp((520-Math.min(view.cssW,view.cssH))/260,0,1):0;
  var mobileBase=mobile?(1.16+compact*.14):1;
  var targetZoom=P.inB?mobileBase+.18:mobileBase;
  cam.zoom=lerp(cam.zoom,targetZoom,P.inB?0.075:0.055);
  var visibleW=view.w/cam.zoom,visibleH=view.h/cam.zoom,t,ty;
  if(P.inB){
    t=P.inB.x+P.inB.w/2-visibleW/2;
    /* A block that fits is framed whole. A taller one is followed storey by
       storey, held between its own roof and ground so the shot never drifts off
       the building the brother is standing in. */
    var bTop=P.inB.y-16,bBot=P.inB.gy+26;
    if(bBot-bTop<=visibleH)ty=P.inB.y+P.inB.h/2-visibleH/2+12;
    else ty=clamp(P.y+P.h/2-visibleH*0.52,bTop,bBot-visibleH);
  } else {
    t=P.x+P.w/2-visibleW*0.44+P.facing*22;
    /* Outdoors the shot used to be nailed to the street, which is the reason
       every stage had to stay flat. It now follows what he is standing on: land
       on a crate and it lifts a little, on a catwalk a lot, on a roof all the
       way, and it stays there while he does. Height is measured against the
       street directly beneath him, so ground that merely undulates moves
       nothing. A jump on its own moves nothing either — the anchor only takes a
       new height on landing — but a fall drags it down before he can drop out
       of the frame. */
    var feet=P.y+P.h, floor=VIEW_BOTTOM-visibleH;
    if(P.onGround||P.ladder)camAnchorY=feet;
    else camAnchorY=Math.max(camAnchorY,feet-visibleH*0.12);
    var gnd=groundYAt(level,P.x+P.w/2);
    if(gnd!==null)camGroundY=gnd;
    var lift=Math.max(0,camGroundY-camAnchorY-CAM_DEADZONE);
    ty=clamp(floor-lift,Math.min(level.top===undefined?floor:level.top,floor),floor);
  }
  cam.x+=(t-cam.x)*(P.inB?0.085:0.13);
  cam.x=clamp(cam.x,0,Math.max(0,level.length-visibleW));
  cam.y=lerp(cam.y,ty,P.inB?0.085:0.10);
  if(cam.shake>0.4)cam.shake*=0.87;else cam.shake=0;
}
function step(){
  tick++;updateAimTrigger();poll();
  if(wepSwipe.shown>0)wepSwipe.shown--;
  var anyStart=anyKey||anyButtonPressed()||tapped;
  if(state==='TITLE'){
    if(anyStart){
      Music.menu();SFX.start();stateT=0;tapped=false;
      /* Arriving on a friend's link is itself the answer to the question the
         mode menu asks, so take the invitation and go straight to the lobby. */
      var invite=Net.invited();
      if(invite){Net.join(invite);selIdx=1;state='SELECT';}
      else state='MODE';
    }
    return;
  }
  if(state==='LEVELS'){
    var lastRow=STAGES.length-1;
    if((pressed('up')||pressed('left'))&&levelIdx>0){levelIdx--;levelScrollTo(levelIdx);SFX.selectMove();}
    if((pressed('down')||pressed('right'))&&levelIdx<lastRow){levelIdx++;levelScrollTo(levelIdx);SFX.selectMove();}
    if(pressed('pause')){levelDrag=null;state='MODE';stateT=0;return;}
    if(pressed('fire')||pressed('start'))levelPick();
    tapped=false;
    return;
  }
  if(state==='MODE'){
    if(pressed('left')&&modeIdx>0){modeIdx--;SFX.selectMove();}
    if(pressed('right')&&modeIdx<MODES.length-1){modeIdx++;SFX.selectMove();}
    if(pressed('fire')||pressed('start')||tapped||selectDeployTap){
      tapped=false;selectDeployTap=false;SFX.selectConfirm();
      /* Alone, you start on whichever brother you played last. In a room the
         brothers go by role — host is Rocco, guest is Vinnie — so the
         preference does not get a say. */
      if(MODES[modeIdx]==='LOCAL'){Net.reset();selIdx=Save.d.bro;state='SELECT';}
      else if(MODES[modeIdx]==='CREATE'){Net.host();selIdx=0;state='SELECT';}
      else if(MODES[modeIdx]==='JOIN'){
        var typed=null;
        try{typed=window.prompt('Enter your friend\'s game code');}catch(err){}
        if(typed){Net.join(typed);selIdx=1;state='SELECT';}
      }
      else {
        /* Open on the last job the brothers took rather than at the top: after
           eight stages, the one you want is never the first one. */
        Net.reset();levelIdx=0;levelScroll=0;levelDrag=null;
        for(var lj=STAGES.length;lj>=1;lj--)
          if(lj<=Save.d.furthest&&stageUnlocked(lj)){levelIdx=lj-1;break;}
        levelScrollTo(levelIdx);
        state='LEVELS';stateT=0;
      }
    }
    return;
  }
  if(state==='SELECT'){
    // Back out of a room the way you back out of anything else here.
    if(pressed('pause')){leaveSelect();return;}
    Net.tick();
    if(pressed('left')&&selIdx!==0){selIdx=0;SFX.selectMove();Net.say({t:'sel',bro:selIdx});}
    if(pressed('right')&&selIdx!==1){selIdx=1;SFX.selectMove();Net.say({t:'sel',bro:selIdx});}
    if(pressed('fire')||pressed('start')||tapped||selectDeployTap){
      tapped=false;selectDeployTap=false;SFX.selectConfirm();makePlayer(selIdx);lives=3;score=0;
      if(!Net.on())Save.set('bro',selIdx);
      setTokens(Math.max(tokens,TOKEN_FLOOR));
      campaignSeed=(Date.now()^(Math.random()*0x7fffffff))>>>0;
      campaign=CAMPAIGNS[campaignSeed%CAMPAIGNS.length];
      startStage(pendingStage||1);pendingStage=0;
    }
    return;
  }
  if(state==='INTRO'){
    stateT++;var itl=introTimeline();
    if(stateT>=itl.objectiveStart&&stateT<itl.ready-14&&stateT%4===0&&introTypeMark!==stateT){
      introTypeMark=stateT;tone(720+rnd(-45,45),.018,'square',.006,610);
    }
    if(stateT>itl.ready&&(anyButtonPressed()||tapped)){tapped=false;state='PLAY';stateT=0;SFX.start();}
    return;
  }
  tapped=false;
  if(state==='EXITING'){
    stateT++;P.vx=0;P.vy=0;P.y+=P.exitDown?2.1:-2.1;P.anim+=.18;updateCamera();Music.update();
    if(stateT>58){
      state='CLEAR';stateT=0;
      setTokens(tokens+2);markStageCleared(stage);
    }
    return;
  }
  if(state==='PAUSE'){if(pressed('pause')||pressed('start')){state='PLAY';setPauseModal(false);}return;}
  if(state==='DEAD'){
    stateT++;updateProjectiles();
    if(stateT>90){
      if(lives<=0){state='GAMEOVER';stateT=0;recordScore();}
      else respawnAtCheckpoint();
    }
    return;
  }
  if(state==='CLEAR'){stateT++;if(stateT>150)startStage(stage+1);return;}
  if(state==='GAMEOVER'||state==='WIN'){
    stateT++;
    /* anyStart is the snapshot taken at the top of the frame. Reading `tapped`
       here instead would never see a touch: it is cleared further up step(),
       which is why these screens used to answer only to the keyboard. */
    if(state==='GAMEOVER'&&stateT>40){
      if(tokens>0&&(pressed('fire')||pressed('start'))||overTap===1){
        /* Insert token, continue. One token, one life, and the stage carries on
           from the checkpoint rather than starting over. */
        overTap=0;
        if(tokens>0){
          setTokens(tokens-1);lives=1;
          SFX.selectConfirm();tone(880,.1,'triangle',.05,1320);
          respawnAtCheckpoint();
          return;
        }
      }
      if(pressed('pause')||overTap===2){
        // Walking away is a choice too, and should not need a token to make.
        overTap=0;
        recordScore();Music.menu();state='MODE';stateT=0;tapped=false;
        return;
      }
    }
    overTap=0;
    if(stateT>60&&anyStart&&(state==='WIN'||tokens<=0)){
      recordScore();Music.menu();state='TITLE';stateT=0;
    }
    return;
  }
  if(pressed('pause')){state='PAUSE';if(matchMedia('(pointer:coarse)').matches)setPauseModal(true);return;}
  updatePlayer();updateEnemies();updateBoss();updateProjectiles();updateCamera();Music.update();
  if(!level.boss&&playerReachedExit()){
    P.exitDown=level.exit.kind==='toilet'||level.exit.kind==='containerdrop';
    state='EXITING';stateT=0;score+=1000+stage*250;SFX.clear();
  }
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,view.cssW,view.cssH);
  if(state==='TITLE'){drawTitle();paintVignette();return;}
  if(state==='MODE'){drawMode();paintVignette();return;}
  if(state==='LEVELS'){drawLevels();paintVignette();return;}
  if(state==='SELECT'){drawSelect();paintVignette();return;}
  if(state==='INTRO'){drawIntro();paintVignette();return;}

  var shx=cam.shake?rnd(-cam.shake,cam.shake):0, shy=cam.shake?rnd(-cam.shake,cam.shake):0;
  var sc=DPR*view.scale*cam.zoom;
  g.setTransform(sc,0,0,sc,(-cam.x+shx)*sc,(-cam.y+shy)*sc);

  paintSky();
  silhouette(0,level.theme.sil,0.55,520);
  paintFog();
  silhouette(1,level.theme.sil2,0.78,540);
  paintRays();
  paintLamps();
  paintGround();
  paintSetpieces();
  paintIngress();
  paintInteriorFocus();
  paintBuildings();
  paintObstacles();
  paintExit();
  paintItems();
  // enemies
  var i;
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.x-cam.x<-90||e.x-cam.x>view.w+90)continue;
    if((e.inB||null)!==(P.inB||null))continue;
    if(e.t!=='prowler'){var gy=groundYAt(level,e.x+e.w/2);if(gy!==null&&Math.abs(gy-(e.y+e.h))<60)shadowBlob(e.x+e.w/2,gy+2,e.w*0.55,0.32);}
    if(e.hidden)continue;
    if(e.objective&&level.objective&&!level.objective.taskDone){
      g.fillStyle='#e8c25a';g.font='bold 17px Impact,sans-serif';g.textAlign='center';
      g.fillText('!',e.x+e.w/2,e.y-9-Math.sin(tick*.11)*3);g.textAlign='left';
    }
    if(e.miniBoss){
      var ec=miniRecovering(e)?'255,255,235':miniEnraged(e)?'255,195,55':'235,70,55';
      g.globalCompositeOperation='lighter';g.strokeStyle='rgba('+ec+','+(.32+.16*Math.sin(tick*.13))+')';g.lineWidth=e.specialT>0?7:4;
      g.beginPath();g.arc(e.x+e.w/2,e.y+e.h/2,Math.max(e.w,e.h)*.72,0,6.283);g.stroke();g.globalCompositeOperation='source-over';
      g.fillStyle=miniRecovering(e)?'#fffbe8':miniEnraged(e)?'#ffd25c':'#ff7768';
      g.font='bold 13px Impact,sans-serif';g.textAlign='center';
      g.fillText(miniRecovering(e)?'RELOADING':e.name,e.x+e.w/2,e.y-18);g.textAlign='left';
    }
    drawCatFoe(e);
  }
  if(boss){shadowBlob(boss.x+boss.w/2,472,boss.w*0.52,0.42);drawBoss();}
  paintAimGuide();
  // player
  if(!P.dead&&(P.inv<=0||Math.floor(tick/4)%2===0)){
    var pgy=groundYAt(level,P.x+P.w/2);
    if(pgy!==null&&pgy>P.y)shadowBlob(P.x+P.w/2,pgy+2,P.w*0.6*(P.onGround?1:0.7),P.onGround?0.36:0.20);
    if(P.rollT>0){
      var rp=(P.rollMax-P.rollT)/P.rollMax;
      if(P.bro===1){
        g.save();g.globalCompositeOperation='lighter';
        for(var gh=2;gh>0;gh--){
          g.globalAlpha=.10*gh;g.translate(-P.rollDir*9,0);
          g.fillStyle='#78d8ff';ell(g,P.x+P.w/2,P.y+P.h/2,18+gh*3,12+gh*2);g.fill();
        }
        g.restore();
      }
      g.save();g.translate(P.x+P.w/2,P.y+P.h/2);g.rotate(P.rollDir*rp*6.283);g.translate(0,-P.h/2);
      drawBrother(0,P.h,P.facing,P.bro,{x:P.facing,y:0},P.anim,true,P.rollAir,1,P.weapon,0,charScale);g.restore();
    } else {
      if(P.bro===0&&!P.onGround&&P.vy>0.8){
        g.strokeStyle='rgba(255,205,90,'+(0.45+Math.sin(tick*.2)*.18)+')';g.lineWidth=3;
        g.beginPath();g.arc(P.x+P.w/2,P.y+P.h+2,13,0,6.283);g.stroke();
      }
      /* Walking against the way he is pointing shows you his back; standing
         still on the ground with nothing asked of the aim stick turns him round
         to face you. */
      var mv=P.vx*P.facing;
      drawBrother(P.x+P.w/2,P.y+P.h,P.facing,P.bro,aimVector(),P.anim,P.prone,!P.onGround,1,P.weapon,P.fireT,charScale,
        {back:mv<-0.35,idle:P.stillT>30,moving:Math.abs(P.vx)>0.4});
    }
  }
  paintProjectiles();
  paintHeadshots();
  paintWeaponWheel();
  paintLighting();
  paintWeather();
  paintForegroundParallax();
  // foreground darkening at the very bottom (cabinet depth)
  g.fillStyle=lin(g,0,560,0,VIEW_BOTTOM,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.75)']]);
  g.fillRect(cam.x-10,560,view.w+20,60);

  S();
  paintVignette();
  paintHUD();
  if(state==='PAUSE')overlay('PAUSED','','PRESS START','#e8c25a');
  if(state==='DEAD')overlay('SQUEAK!','a brother down','','#e05a4a');
  if(state==='CLEAR')overlay('STAGE CLEAR','+'+(1000+stage*250)+' PTS','','#8fbf6a');
  if(state==='GAMEOVER'){
    overlay('GAME OVER','SCORE '+score,
      tokens>0?'':continuePrompt(),'#e05a4a');
    var gw=view.cssW,bs2=gameOverButtons(),bi;
    for(bi=0;bi<bs2.length;bi++){
      var gb=bs2[bi],liveB=(gb.id!=='token')||tokens>0;
      g.fillStyle=liveB?(gb.id==='token'?'rgba(232,194,90,.15)':'rgba(255,255,255,.05)'):'rgba(255,255,255,.02)';
      rr(g,gb.x,gb.y,gb.w,gb.h,8);g.fill();
      g.strokeStyle=liveB?(gb.id==='token'?'rgba(255,214,106,'+(0.55+0.35*Math.abs(Math.sin(tick*0.09)))+')':'rgba(200,196,180,.5)'):'#2a2a28';
      g.lineWidth=2;rr(g,gb.x,gb.y,gb.w,gb.h,8);g.stroke();
      txt(gb.label,gb.x+gb.w/2,gb.y+gb.h*0.46,Math.min(15,gb.w*0.10),
        liveB?'#efe6d2':'#5a544a','center');
      txt(gb.sub,gb.x+gb.w/2,gb.y+gb.h*0.76,Math.min(10.5,gb.w*0.062),
        liveB?'#8f9b87':'#4a453e','center','Arial,sans-serif');
    }
    txt(tokens>0?'YOU HAVE '+tokens+' TOKEN'+(tokens===1?'':'S'):'NO TOKENS LEFT',
      gw/2,bs2[0].y-14,Math.min(12,gw*0.021),tokens>0?'#e8c25a':'#8a6a20','center','Arial,sans-serif');
  }
  if(state==='WIN'){
    overlay('THE CATMAN IS FINISHED','FINAL SCORE '+score,continuePrompt(),'#e8c25a');
    txt('the sewer belongs to the brothers again',view.cssW/2,view.cssH*0.44+92,
      Math.min(14,view.cssW*0.034),'#8fbf6a','center');
  }
  var fadeA=0;
  if(state==='EXITING')fadeA=Math.max(fadeA,clamp((stateT-10)/48,0,1));
  if(state==='CLEAR'&&stateT<20)fadeA=Math.max(fadeA,1-stateT/20);
  if(fadeA>0){g.fillStyle='rgba(0,0,0,'+clamp(fadeA,0,1)+')';g.fillRect(0,0,view.cssW,view.cssH);}
}
var last=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(window.__frozen)return;
  if(!last)last=t;
  var dt=Math.min(50,t-last);last=t;acc+=dt;
  var guard=0;
  while(acc>=16.667&&guard<4){step();acc-=16.667;guard++;}
  if(guard>=4)acc=0;
  render();
  var touchControls=matchMedia('(pointer:coarse)').matches&&state==='PLAY';
  panelEl.style.visibility=touchControls?'visible':'hidden';
  if(touchControls)drawPad();
  else if(matchMedia('(pointer:coarse)').matches){
    pg.setTransform(DPR,0,0,DPR,0,0);pg.clearRect(0,0,pad.cssW,pad.cssH);
  }
  mobilePause.style.visibility=(state==='PLAY'||state==='PAUSE')?'visible':'hidden';
}
resize();
makePlayer(0);
level=buildLevel(1);
makeMotes();
requestAnimationFrame(loop);
})();
</script>
