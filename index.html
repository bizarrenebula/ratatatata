<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ratatatata! — Rat Bros: Rodent Reckoning</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#08080a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:#08080a;}
  #stage{flex:1 1 100%;position:relative;overflow:hidden;background:#0a0d0f;}
  #panel{display:none;visibility:hidden;position:fixed;inset:0;z-index:8;pointer-events:none;}
  #panel canvas{position:absolute;inset:0;pointer-events:auto;}
  #mobilePause{display:none;position:fixed;left:max(10px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));
    z-index:11;width:38px;height:38px;border:1px solid rgba(255,255,255,.34);border-radius:10px;
    background:rgba(8,12,14,.36);color:rgba(255,255,255,.78);font:bold 15px Arial,sans-serif;backdrop-filter:blur(3px);}
  #sizeCtl{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(9px,env(safe-area-inset-top));
    z-index:11;display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid rgba(255,255,255,.28);
    border-radius:10px;background:rgba(8,12,14,.42);backdrop-filter:blur(3px);}
  #sizeCtl button{width:30px;height:30px;border:1px solid rgba(255,255,255,.30);border-radius:8px;
    background:rgba(255,255,255,.08);color:rgba(255,255,255,.86);font:bold 17px Arial,sans-serif;line-height:1;}
  #sizeCtl button:active{background:rgba(232,194,90,.32);}
  #sizeVal{min-width:44px;text-align:center;color:#e8c25a;font:bold 13px Arial,sans-serif;letter-spacing:.5px;}
  #pauseModal{display:none;position:fixed;inset:0;z-index:12;align-items:center;justify-content:center;background:rgba(2,4,5,.70);}
  #pauseCard{min-width:min(330px,72vw);padding:25px;border:1px solid rgba(232,194,90,.48);border-radius:14px;
    background:linear-gradient(#172024,#080b0d);box-shadow:0 18px 60px #000;text-align:center;color:#e8c25a;}
  #pauseCard h2{font-size:30px;letter-spacing:2px;margin-bottom:18px;text-shadow:2px 2px #42120e;}
  #pauseCard button{display:block;width:100%;margin:10px 0;padding:12px;border:1px solid rgba(255,255,255,.26);border-radius:8px;
    background:rgba(255,255,255,.07);color:#eee;font:18px Impact,sans-serif;letter-spacing:1px;}
  @media (orientation:landscape) and (pointer:coarse){#panel,#mobilePause{display:block;}}
  canvas{display:block;width:100%;height:100%;}
  #stage canvas{box-shadow:inset 0 -14px 26px rgba(0,0,0,.7);}
  #rotate{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:28px;background:
    radial-gradient(circle at 50% 42%,#263b3b 0,#0b1214 52%,#050708 100%);color:#e8d6a8;}
  #rotate .phone{width:54px;height:92px;border:5px solid #e8c25a;border-radius:10px;
    transform:rotate(90deg);margin:12px 0 26px;box-shadow:0 0 30px rgba(232,194,90,.24);}
  #rotate h1{font-size:clamp(28px,9vw,48px);letter-spacing:1px;color:#e8c25a;
    text-shadow:3px 3px 0 #42120e;}
  #rotate p{font-family:Arial,sans-serif;font-weight:bold;font-size:15px;line-height:1.45;
    max-width:340px;color:#b9c6b0;margin-top:10px;}
  @media (orientation:portrait) and (pointer:coarse){
    #app{display:none;}#rotate{display:flex;}
  }
</style>
</head>
<body>
<div id="rotate" role="button" aria-label="Rotate device to landscape" tabindex="0">
  <div class="phone"></div>
  <h1>TURN IT SIDEWAYS!</h1>
  <p>Ratatatata! is a landscape-only operation. Rotate your phone, then tap anywhere to deploy.</p>
</div>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="panel"><canvas id="pad"></canvas></div>
</div>
<button id="mobilePause" aria-label="Pause game">Ⅱ</button>
<div id="sizeCtl">
  <button id="sizeDown" type="button" aria-label="Decrease character size">&minus;</button>
  <span id="sizeVal">1.00&times;</span>
  <button id="sizeUp" type="button" aria-label="Increase character size">+</button>
</div>
<div id="pauseModal"><div id="pauseCard"><h2>PAUSED</h2><button id="pauseContinue">CONTINUE</button><button id="pauseMenu">MAIN MENU</button></div></div>
<script>
(function(){
'use strict';

/* ==================== CANVAS / VIEW ==================== */
var stageEl=document.getElementById('stage'), panelEl=document.getElementById('panel');
var rotateEl=document.getElementById('rotate'),landscapeAsked=false;
var mobilePause=document.getElementById('mobilePause'),pauseModal=document.getElementById('pauseModal');
var gcv=document.getElementById('game'), g=gcv.getContext('2d');
var pcv=document.getElementById('pad'),  pg=pcv.getContext('2d');
var titleLogo=new Image();titleLogo.src='assets/images/ui/ratatatata-title-cutout.png';

var view={w:520,h:900,scale:1,cssW:360,cssH:640};
var pad ={cssW:360,cssH:160};
var DPR=1, VIEW_BOTTOM=612, camY0=-300;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  var r=stageEl.getBoundingClientRect();
  view.cssW=Math.max(1,r.width); view.cssH=Math.max(1,r.height);
  gcv.width=Math.round(view.cssW*DPR); gcv.height=Math.round(view.cssH*DPR);
  var a=view.cssW/view.cssH;
  if(a<520/560){ view.w=520; view.h=520/a; } else { view.h=560; view.w=560*a; }
  view.scale=view.cssW/view.w;
  camY0=VIEW_BOTTOM-view.h;
  var q=panelEl.getBoundingClientRect();
  pad.cssW=Math.max(1,q.width); pad.cssH=Math.max(1,q.height);
  pcv.width=Math.round(pad.cssW*DPR); pcv.height=Math.round(pad.cssH*DPR);
  layoutPad();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);});
function requestLandscape(){
  if(!matchMedia('(pointer:coarse)').matches)return;
  var root=document.documentElement,p=Promise.resolve();
  if(!document.fullscreenElement&&root.requestFullscreen)p=root.requestFullscreen().catch(function(){});
  p.then(function(){
    if(screen.orientation&&screen.orientation.lock)
      screen.orientation.lock('landscape').catch(function(){});
  });
  landscapeAsked=true;
}
function setPauseModal(show){pauseModal.style.display=show?'flex':'none';}
mobilePause.addEventListener('click',function(e){e.preventDefault();initAudio();requestLandscape();if(state==='PLAY'){state='PAUSE';setPauseModal(true);}});
document.getElementById('pauseContinue').addEventListener('click',function(){state='PLAY';setPauseModal(false);SFX.start();});
document.getElementById('pauseMenu').addEventListener('click',function(){Music.menu();state='TITLE';stateT=0;setPauseModal(false);});
rotateEl.addEventListener('click',requestLandscape);
rotateEl.addEventListener('touchend',function(e){e.preventDefault();requestLandscape();},{passive:false});

/* ==================== MATH ==================== */
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var rnd=function(a,b){return a+Math.random()*(b-a);};
var lerp=function(a,b,t){return a+(b-a)*t;};
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lin(c,x0,y0,x1,y1,st){var q=c.createLinearGradient(x0,y0,x1,y1),i;
  for(i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}
function rad(c,x,y,r0,r1,st){var q=c.createRadialGradient(x,y,r0,x,y,r1),i;
  for(i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}
function rr(c,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,6.283);}
/* House line weight. Every outline in the game is drawn relative to this, so
   the whole drawing can be made finer or heavier from one number while the
   relative weights — a boot heavier than a collar — stay as they were. */
var INK_SCALE=0.6;
function ink(c,col,lw){c.strokeStyle=col||'rgba(10,8,10,.75)';c.lineWidth=(lw||2)*INK_SCALE;c.stroke();}

/* ==================== INPUT ==================== */
/* upjump is a synthetic control: a decisive upward push of the move stick,
   kept separate from `up` so climbing (which tolerates diagonals) and jumping
   (which must not fire when you merely angle the stick) can use the same axis. */
var NAMES=['left','right','up','down','jump','upjump','fire','nade','swap','start','pause'];
var kb={},tc={},inp={},prev={},keyPulse=false,anyKey=false;
var KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
  KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyZ:'jump',Space:'jump',KeyK:'jump',
  KeyX:'fire',KeyJ:'fire',KeyC:'nade',KeyL:'nade',ShiftLeft:'swap',KeyQ:'swap',
  Enter:'start',KeyR:'start',KeyP:'pause',Escape:'pause'};
window.addEventListener('keydown',function(e){var n=KEYS[e.code];
  if(!e.repeat){keyPulse=true;initAudio();}
  if(n){kb[n]=true;e.preventDefault();}});
window.addEventListener('keyup',function(e){var n=KEYS[e.code];if(n){kb[n]=false;e.preventDefault();}});
window.addEventListener('blur',function(){var i;for(i=0;i<NAMES.length;i++){kb[NAMES[i]]=false;tc[NAMES[i]]=false;}
  moveStick.ax=0;moveStick.ay=0;aimStick.ax=0;aimStick.ay=0;wepSwipe.id=-1;padOwner={};});

/* Is there anything worth spending a round on? Same space as the brother —
   a rat in another building is not a reason to fire down a corridor — and close
   enough to matter. The boss always counts. */
function threatNear(){
  if(!level||state!=='PLAY'||P.dead)return false;
  if(boss&&boss.state!=='dead')return true;
  var px=P.x+P.w/2,py=P.y+P.h/2,i,e;
  for(i=0;i<enemies.length;i++){
    e=enemies[i];
    if(e.dead||e.hidden||e.fallDead)continue;
    if((e.inB||null)!==(P.inB||null))continue;
    if(Math.abs(e.x+e.w/2-px)>TRIGGER_REACH_X)continue;
    if(Math.abs(e.y+e.h/2-py)>TRIGGER_REACH_Y)continue;
    return true;
  }
  return false;
}
function updateAimTrigger(){
  if(!coarsePointer()){mobileAutoFire=false;triggerLive=false;return;}
  var mag=Math.hypot(aimStick.ax,aimStick.ay);
  // A wide gap between the push that fires and the push that stops: steering
  // across the line should not cost a round.
  if(aimHot){if(mag<AUTOFIRE_OFF)aimHot=false;}
  else if(mag>AUTOFIRE_ON)aimHot=true;
  /* Held out at the rim, the safety is overruled — deliberate, and it stays
     overruled until the thumb comes back, so a crate can be worked on. */
  if(mag>RIM_PUSH)rimHeld++;else rimHeld=0;
  if(rimHeld>RIM_HOLD)rimOverride=true;
  if(!aimHot)rimOverride=false;
  /* The gun stays live for a moment after the last thing worth shooting has
     gone, so finishing a burst over a body does not die mid-trigger. */
  if(threatNear())triggerGrace=TRIGGER_GRACE;
  else if(triggerGrace>0)triggerGrace--;
  triggerLive=aimHot&&(rimOverride||triggerGrace>0);
  mobileAutoFire=triggerLive;
  tc.fire=triggerLive;
}
function poll(){var i,n;anyKey=keyPulse;keyPulse=false;for(i=0;i<NAMES.length;i++){n=NAMES[i];prev[n]=inp[n];inp[n]=!!(kb[n]||tc[n]);}}
function pressed(n){return inp[n]&&!prev[n];}
function anyButtonPressed(){for(var i=0;i<NAMES.length;i++)if(pressed(NAMES[i]))return true;return false;}

/* ---- arcade panel layout + touch ---- */
/* Twin-stick mobile layout: the left stick walks and climbs, the right stick
   aims through a full 360 degrees independently of where you are moving. Each
   stick carries the buttons its own thumb is expected to reach. */
var moveStick={cx:0,cy:0,r:0,ax:0,ay:0,vx:0,vy:0,id:-1};
var aimStick ={cx:0,cy:0,r:0,ax:0,ay:0,vx:0,vy:0,id:-1};
/* Weapon switching is a swipe across the brother himself. shown counts down the
   frames the gallery stays up over his head after the last drag. */
var wepSwipe={id:-1,lastX:0,shown:0}, WEAPON_SWIPE_PX=34;
/* touch identifier -> what that finger is driving ('move' | 'aim' | 'swipe' |
   button index). Ownership is decided once, when the finger lands, and held
   until it lifts. */
var padOwner={};
/* Shooting is the aim stick's job and jumping is the move stick's, so the only
   buttons left are the occasional ones: grenades on the left, and a jump button
   on the right kept for crouch-drops (down + jump cannot be expressed by one
   stick) and for jumping while stood at a ladder. */
var BTNS=[
  {n:'nade', l:'C', sub:'BOMB',  x:0,y:0,r:0,p:0,hue:'#e8b23a',side:'L'},
  {n:'jump', l:'A', sub:'JUMP',  x:0,y:0,r:0,p:0,hue:'#e2402f',side:'R'},
  {n:'swap', l:'D', sub:'SWAP',  x:0,y:0,r:0,p:0,hue:'#e8b23a',side:'R'}
];
/* The aim stick has to carry two intentions at once — where the brother looks
   and whether he shoots — and turning to face the way you are walking put the
   thumb straight through the trigger. So the gun keeps its own safety:

   - it holds fire while nothing worth shooting is near, so corridors and empty
     rooms cost no ammo at all;
   - it goes live by itself the moment something is, with no input from the
     player and nothing to arm, so it can never be caught switched off when a
     room turns out to be occupied;
   - and pushing the stick out to the rim and holding fires anyway, which is how
     you blow the lock off a crate with nothing alive nearby.

   The push that fires is out near the rim now rather than half way, and it lets
   go again only when the thumb comes well back, so drifting across the line
   while steering does not squeeze off a round. */
var AUTOFIRE_ON=0.80, AUTOFIRE_OFF=0.60, RIM_PUSH=0.93, RIM_HOLD=10;
var TRIGGER_REACH_X=460, TRIGGER_REACH_Y=280, TRIGGER_GRACE=80;
var AUTOFIRE_MIN=AUTOFIRE_ON;              // the ring the pad draws
var mobileAutoFire=false, aimHot=false, rimHeld=0, rimOverride=false, triggerLive=false, triggerGrace=0;
var SMALL=[
  {n:'start',l:'START',x:0,y:0,r:0,p:0},
  {n:'pause',l:'PAUSE',x:0,y:0,r:0,p:0}
];
function layoutPad(){
  var w=pad.cssW,h=pad.cssH;
  var sat=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')||0);
  var r=Math.min(h*0.135,w*0.082,66), br=Math.min(h*0.070,w*0.043,38);
  /* Weapon switching lives on the character now, so nothing reserves the right
     edge and the aim stick can mirror the move stick exactly. */
  var inset=Math.max(w*0.135,r+20+sat);
  moveStick.r=aimStick.r=r;
  moveStick.cx=inset;
  aimStick.cx=w-inset;
  moveStick.cy=aimStick.cy=h*0.72;
  /* Buttons sit clear above the ring of the stick their thumb shares:
     fire + bomb over the move stick, jump + swap over the aim stick. */
  var by=moveStick.cy-r-br*1.45;
  BTNS[0].x=moveStick.cx+br*0.2;  BTNS[0].y=by;              // BOMB
  BTNS[1].x=aimStick.cx-br*1.45;  BTNS[1].y=by;              // JUMP
  BTNS[2].x=aimStick.cx+br*1.55;  BTNS[2].y=by+br*0.62;      // SWAP
  BTNS[0].r=br;BTNS[1].r=br;BTNS[2].r=br*0.86;
  SMALL[0].r=0;SMALL[1].r=0;
}
/* The pad canvas covers the whole viewport, so it — not the game canvas —
   receives every touch. Character gestures therefore have to be resolved here,
   against the stage canvas' own rect so the mapping stays correct even if the
   two canvases are ever sized differently. */
function touchOnPlayer(t){
  if(!level||state!=='PLAY'||P.dead)return false;
  var r=gcv.getBoundingClientRect();
  var cx=(t.clientX-r.left)/r.width*view.cssW, cy=(t.clientY-r.top)/r.height*view.cssH;
  var k=view.scale*cam.zoom;
  var wx=cam.x+cx/k, wy=cam.y+cy/k, pad2=30;
  return wx>P.x-pad2&&wx<P.x+P.w+pad2&&wy>P.y-pad2*1.6&&wy<P.y+P.h+pad2;
}
function stepWeaponSwipe(t){
  var dx=t.clientX-wepSwipe.lastX;
  wepSwipe.shown=90;
  /* Drag left for the next weapon, right for the previous — the gallery over
     the brother's head moves the same way the thumb does. */
  if(Math.abs(dx)>=WEAPON_SWIPE_PX){cycleWeapon(dx<0?1:-1);wepSwipe.lastX=t.clientX;}
}
/* Decides what a NEW touch belongs to. Only ever called on the frame a finger
   first lands; after that the touch keeps its owner (see padOwner) so dragging
   a thumb up out of a stick well cannot press the button sitting above it. */
function claimTouch(t,x,y){
  var k;
  for(k=0;k<BTNS.length;k++){
    var b=BTNS[k];
    if(Math.hypot(x-b.x,y-b.y)<b.r*1.32)return k;
  }
  /* Each stick owns the area around its own well, tested before the character,
     because the camera regularly parks the brother on top of the move stick. */
  if(Math.hypot(x-moveStick.cx,y-moveStick.cy)<moveStick.r*1.35)return 'move';
  if(Math.hypot(x-aimStick.cx,y-aimStick.cy)<aimStick.r*1.35)return 'aim';
  if(wepSwipe.id<0&&touchOnPlayer(t)){
    wepSwipe.id=t.identifier;wepSwipe.lastX=t.clientX;wepSwipe.shown=90;return 'swipe';
  }
  return (x<pad.cssW*0.5)?'move':'aim';
}
function padTouch(e){
  e.preventDefault(); initAudio();if(!landscapeAsked)requestLandscape();
  var i,k; for(k=0;k<NAMES.length;k++) tc[NAMES[k]]=false;
  for(k=0;k<BTNS.length;k++)BTNS[k].p=0;
  SMALL[0].p=0;SMALL[1].p=0;
  var mx=0,my=0,mHeld=false,ax=0,ay=0,aHeld=false,seen={};
  var r=pcv.getBoundingClientRect();
  for(i=0;i<e.touches.length;i++){
    var t=e.touches[i],id=t.identifier;
    var x=(t.clientX-r.left)/r.width*pad.cssW, y=(t.clientY-r.top)/r.height*pad.cssH;
    seen[id]=1;
    if(!(id in padOwner))padOwner[id]=claimTouch(t,x,y);
    var own=padOwner[id];
    if(own==='swipe'){stepWeaponSwipe(t);continue;}
    if(typeof own==='number'){var b2=BTNS[own];tc[b2.n]=true;b2.p=1;continue;}
    var s=(own==='aim')?aimStick:moveStick;
    var dx=x-s.cx, dy=y-s.cy, d=Math.hypot(dx,dy)||1, m=Math.min(1,d/(s.r*1.15));
    if(s===moveStick){mx=dx/d*m; my=dy/d*m; mHeld=true;}
    else {ax=dx/d*m; ay=dy/d*m; aHeld=true;}
  }
  for(var oid in padOwner){
    if(seen[oid])continue;
    if(padOwner[oid]==='swipe')wepSwipe.id=-1;
    delete padOwner[oid];
  }
  moveStick.ax=mHeld?mx:0; moveStick.ay=mHeld?my:0;
  aimStick.ax =aHeld?ax:0; aimStick.ay =aHeld?ay:0;
  var DZ=0.34;
  /* Movement comes from the left stick alone; the aim stick never walks the
     brother, which is what makes strafing and 360 aim independent. */
  tc.left = moveStick.ax<-DZ; tc.right= moveStick.ax>DZ;
  tc.up   = moveStick.ay<-DZ; tc.down = moveStick.ay>DZ;
  /* Jump wants a deliberate upward push, not the incidental up you get from
     steering, so the vertical axis has to dominate — but only just, because an
     up-and-back diagonal is how you ask for a backward leap. How far past the
     threshold the thumb sits is the jump's power (see stickUpThrottle). */
  tc.upjump = moveStick.ay<-0.55&&Math.abs(moveStick.ay)>Math.abs(moveStick.ax);
  /* The stick only reports where the thumb is; whether that pulls a trigger is
     decided once a frame in updateAimTrigger, which is the only place that can
     know whether there is anything to shoot at. */
}
['touchstart','touchmove','touchend','touchcancel'].forEach(function(n){
  pcv.addEventListener(n,padTouch,{passive:false});
});
var tapped=false,selectDeployTap=false;
function stageTouch(e){
  e.preventDefault();initAudio();if(!landscapeAsked)requestLandscape();
  if(state==='MODE'&&e.touches&&e.touches.length){
    var mr=gcv.getBoundingClientRect(),mx=(e.touches[0].clientX-mr.left)/mr.width*view.cssW;
    var my=(e.touches[0].clientY-mr.top)/mr.height*view.cssH,mb=modeBoxes(),mi;
    for(mi=0;mi<mb.length;mi++)
      if(mx>=mb[mi].x&&mx<=mb[mi].x+mb[mi].w&&my>=mb[mi].y&&my<=mb[mi].y+mb[mi].h){
        if(modeIdx!==mi){modeIdx=mi;SFX.selectMove();}
        selectDeployTap=true;return;
      }
    return;
  }
  if(state==='SELECT'&&e.touches&&e.touches.length){
    var r=gcv.getBoundingClientRect(),x=(e.touches[0].clientX-r.left)/r.width*view.cssW;
    var y=(e.touches[0].clientY-r.top)/r.height*view.cssH;
    if(Net.on()&&lobbyBannerHit(x,y)){copyInvite();return;}

/* ==================== NET: TWO-PLAYER LOBBY ====================
   Two browsers cannot find each other unaided, so a room code is minted at a
   rendezvous (scripts/signal-server.js locally, scripts/cloudflare/worker.js on
   Cloudflare) and each peer leaves the other a description of how to be reached.
   The moment those descriptions have been swapped the browsers talk directly:
   the lobby — who is here, which rat each has picked — rides the peer connection
   itself, and the rendezvous never sees any of it.

   Signalling lives at the same origin as the page by default, which is what the
   bundled server arranges; ?signal=https://host overrides it for a game served
   from somewhere other than its Worker. */
var SIGNAL_BASE=(function(){
  try{
    var q=new URLSearchParams(location.search).get('signal');
    if(q)return q.replace(/\/$/,'');
  }catch(err){}
  return (location.protocol==='http:'||location.protocol==='https:')?location.origin:'';
})();
var ICE=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}];
var Net={
  role:'local',            // 'local' | 'host' | 'guest'
  status:'off',            // 'off' | 'opening' | 'waiting' | 'joining' | 'live' | 'error'
  code:'', link:'', note:'',
  pc:null, chan:null, alive:false,
  peerHere:false, peerBro:1,
  on:function(){return Net.role!=='local';},
  /* P1 is whoever opened the room. That is the whole of the seating plan. */
  seat:function(){return Net.role==='guest'?2:1;},
  reset:function(){
    Net.alive=false;
    try{if(Net.chan)Net.chan.close();}catch(err){}
    try{if(Net.pc)Net.pc.close();}catch(err){}
    Net.pc=null;Net.chan=null;Net.role='local';Net.status='off';
    Net.code='';Net.link='';Net.note='';Net.peerHere=false;Net.peerBro=1;
  },
  fail:function(why){Net.status='error';Net.note=why;Net.alive=false;},
  api:function(path,opts){
    if(!SIGNAL_BASE)return Promise.reject(new Error('no signalling server'));
    return fetch(SIGNAL_BASE+path,opts).then(function(r){
      if(!r.ok)throw new Error('signal '+r.status);
      return r.json();
    });
  },
  post:function(msg){
    return Net.api('/net/send?code='+Net.code+'&from='+(Net.role==='host'?'host':'guest'),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(msg)});
  },
  /* Long-poll the mailbox until something arrives that the caller wants. */
  collect:function(want){
    var as=Net.role==='host'?'host':'guest';
    return new Promise(function(resolve,reject){
      var tries=0;
      (function round(){
        if(!Net.alive)return reject(new Error('cancelled'));
        Net.api('/net/recv?code='+Net.code+'&as='+as).then(function(data){
          var i,msgs=data.messages||[];
          for(i=0;i<msgs.length;i++)if(msgs[i]&&msgs[i].t===want)return resolve(msgs[i]);
          if(++tries>20)return reject(new Error('nobody joined'));
          round();
        }).catch(function(err){
          if(!Net.alive)return reject(err);
          if(++tries>20)return reject(err);
          setTimeout(round,900);
        });
      })();
    });
  },
  /* Both sides gather their candidates before describing themselves, so a single
     message carries a complete description and there is no trickle to relay. */
  settled:function(pc){
    if(pc.iceGatheringState==='complete')return Promise.resolve();
    return new Promise(function(resolve){
      var done=false,finish=function(){if(done)return;done=true;resolve();};
      pc.addEventListener('icegatheringstatechange',function(){
        if(pc.iceGatheringState==='complete')finish();
      });
      setTimeout(finish,2500);
    });
  },
  /* A closed tab does not always close a channel politely, so the connection's
     own state is what decides whether anyone is still there. */
  watch:function(pc){
    pc.onconnectionstatechange=function(){
      var st=pc.connectionState;
      if(!Net.alive||(st!=='disconnected'&&st!=='failed'&&st!=='closed'))return;
      if(!Net.peerHere)return;
      Net.peerHere=false;Net.status='waiting';
      Net.note=Net.role==='host'?'PLAYER 2 LEFT':'PLAYER 1 LEFT';
    };
  },
  wire:function(chan){
    Net.chan=chan;
    chan.onopen=function(){
      Net.status='live';Net.peerHere=true;Net.note='';Net.lastHeard=Date.now();
      SFX.selectConfirm();
      Net.say({t:'sel',bro:selIdx});
    };
    chan.onclose=function(){
      if(!Net.alive)return;
      Net.peerHere=false;Net.status='waiting';Net.note='PLAYER 2 LEFT';
    };
    chan.onmessage=function(e){
      var m;try{m=JSON.parse(e.data);}catch(err){return;}
      Net.lastHeard=Date.now();
      if(!Net.peerHere){Net.peerHere=true;Net.status='live';Net.note='';}
      if(m.t==='sel'){Net.peerBro=m.bro?1:0;SFX.selectMove();}
    };
  },
  /* WebRTC takes the best part of a minute to admit a peer has gone, which is
     no use to a lobby, so the two ends say hello once a second and a silence of
     a few seconds is taken as an empty chair. */
  lastHeard:0, lastPing:0,
  tick:function(){
    if(!Net.on()||Net.status!=='live')return;
    var now=Date.now();
    if(now-Net.lastPing>1000){Net.lastPing=now;Net.say({t:'ping'});}
    if(Net.lastHeard&&now-Net.lastHeard>4000){
      Net.peerHere=false;Net.status='waiting';
      Net.note=Net.role==='host'?'PLAYER 2 LEFT':'PLAYER 1 LEFT';
    }
  },
  say:function(msg){
    if(Net.chan&&Net.chan.readyState==='open'){try{Net.chan.send(JSON.stringify(msg));}catch(err){}}
  },
  host:function(){
    Net.reset();Net.role='host';Net.status='opening';Net.alive=true;
    Net.api('/net/new',{method:'POST'}).then(function(data){
      Net.code=data.code;
      Net.link=location.origin+location.pathname+(location.search||'')+'#j='+Net.code;
      Net.status='waiting';
      var pc=Net.pc=new RTCPeerConnection({iceServers:ICE});
      Net.watch(pc);
      Net.wire(pc.createDataChannel('lobby',{ordered:true}));
      return pc.createOffer().then(function(offer){
        return pc.setLocalDescription(offer);
      }).then(function(){
        return Net.settled(pc);
      }).then(function(){
        return Net.post({t:'offer',sdp:pc.localDescription.sdp});
      }).then(function(){
        return Net.collect('answer');
      }).then(function(msg){
        return pc.setRemoteDescription({type:'answer',sdp:msg.sdp});
      });
    }).catch(function(err){
      Net.fail(SIGNAL_BASE?String(err.message||err).toUpperCase():'NO SERVER: RUN node scripts/signal-server.js');
    });
  },
  join:function(code){
    Net.reset();Net.role='guest';Net.status='joining';Net.alive=true;
    Net.code=String(code||'').trim().toUpperCase();
    if(!/^[A-Z0-9]{6}$/.test(Net.code)){Net.fail('THAT IS NOT A GAME CODE');return;}
    var pc=Net.pc=new RTCPeerConnection({iceServers:ICE});
    Net.watch(pc);
    pc.ondatachannel=function(e){Net.wire(e.channel);};
    Net.collect('offer').then(function(msg){
      return pc.setRemoteDescription({type:'offer',sdp:msg.sdp});
    }).then(function(){
      return pc.createAnswer();
    }).then(function(answer){
      return pc.setLocalDescription(answer);
    }).then(function(){
      return Net.settled(pc);
    }).then(function(){
      return Net.post({t:'answer',sdp:pc.localDescription.sdp});
    }).catch(function(err){
      Net.fail(SIGNAL_BASE?'COULD NOT REACH THAT GAME':'NO SERVER: RUN node scripts/signal-server.js');
    });
  },
  /* A link with a room code in its fragment is an invitation: take it. */
  invited:function(){
    var m=/[#&]j=([A-Za-z0-9]{6})/.exec(location.hash||'');
    return m?m[1].toUpperCase():'';
  }
};

var actx=null;
function initAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();

}
function tone(f,dur,type,vol,slide){
  if(!actx)return;
  var o=actx.createOscillator(),q=actx.createGain(),t=actx.currentTime;
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  q.gain.setValueAtTime(vol||0.05,t); q.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(q);q.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,filt){
  if(!actx)return;
  var len=Math.floor(actx.sampleRate*dur),b=actx.createBuffer(1,len,actx.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  var s=actx.createBufferSource();s.buffer=b;
  var q=actx.createGain();q.gain.value=vol||0.12;
  var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=filt||1200;
  s.connect(f);f.connect(q);q.connect(actx.destination);s.start();
}

   collision box scale together, so the feel stays honest while a size is dialled

   is deliberately NOT scaled, so the traversal still plays exactly as tuned. */

function safeRespawn(x){
  var best=null,i,p;
  for(i=0;i<level.plats.length;i++){
    p=level.plats[i];
    if(!p.ground||p.w<90)continue;
    if(x>=p.x&&x<=p.x+p.w){best=p;break;}
    if(p.x+p.w<x&&(!best||p.x>best.x))best=p;
  }
  if(!best)return {x:60,y:360};
  return {x:clamp(x-56,best.x+24,best.x+best.w-56),y:best.y-60};
}
function groundYAt(lv,x){
  var i,p;
  for(i=0;i<lv.plats.length;i++){p=lv.plats[i];
    if(p.ground&&x>=p.x+10&&x<=p.x+p.w-10)return p.y;}
  return null;
}

function enemySpawnSize(t){var z=t==='cat'?{w:40,h:52}:t==='bat'?{w:34,h:24}:t==='lizard'?{w:28,h:40}:t==='weasel'?{w:26,h:38}:{w:24,h:32};

function interiorSpawnSupported(lv,s,x,y,z){

    if(p.inside===s.inB&&p.interiorFloor&&cx>p.x+3&&cx<p.x+p.w-3&&Math.abs(foot-p.y)<5)return true;
  }

function sanitizeEnemySpawns(lv){
  var safe=[],offsets=[0,62,-62,124,-124,190,-190,260,-260,340,-340];
  for(var i=0;i<lv.spawns.length;i++){
    var s=lv.spawns[i],z=enemySpawnSize(s.t),placed=false;
    if(s.perch){safe.push(s);continue;}
    for(var j=0;j<offsets.length;j++){
      var nx=s.x+offsets[j],ny=s.y;
      if(s.inB){
        if(nx<s.inB.x+16||nx+z.w>s.inB.x+s.inB.w-16)continue;
        if(!interiorSpawnSupported(lv,s,nx,ny,z))continue;
      } else if(s.t!=='bat'){
        var gy=groundYAt(lv,nx+z.w/2);if(gy===null)continue;ny=gy-z.h;
      }
      if(enemySpawnBlocked(lv,s,nx,ny))continue;
      s.x=Math.round(nx);s.y=Math.round(ny);placed=true;break;
    }
    if(placed)safe.push(s);
  }
  lv.spawns=safe;
}

function addBuilding(lv,rng,x,gy,kind){
  /* Every authored dimension here is in 1x units multiplied by S, so the whole
     structure keeps its proportions while growing to fit the scaled cast.
     Storey count drops from 3-4 to 2-3: at S=1.75 a four-storey block would
     tower off the top of the camera's fixed vertical framing. */
  var S=BUILD_SCALE;
  var fh=82*S, w=Math.round((360+rng()*60)*S);
  /* Blocks are three to five storeys, threaded by flights that alternate ends of
     the floor so each storey is crossed to reach the next. That makes them
     taller than the camera's outdoor framing, which is what a city looks like
     from the street; inside, the camera follows the storey the brother is on
     (see updateCamera) rather than trying to hold the whole block at once. */
  var floors=3+Math.floor(rng()*3);
  var b={x:x,y:gy-floors*fh,w:w,h:floors*fh,gy:gy,fh:fh,floors:floors,cut:0,scale:S,
         slabs:[],steps:[],stairs:[],windows:[],door:{x:x+18*S,w:38*S},doorOpen:0,seed:rng(),lit:rng(),kind:kind||'downtown'};
  var f,i;
  lv.plats.push({x:x-7*S,y:b.y-11*S,w:w+14*S,h:11*S,roof:true});  // roof: always solid
  lv.plats.push({x:x-9*S,y:b.y,w:10*S,h:b.h,inside:b});           // walls: solid only from inside
  lv.plats.push({x:x+w-1,y:b.y,w:10*S,h:b.h,inside:b});
  for(f=1;f<floors;f++){
    var fy=gy-f*fh, lower=gy-(f-1)*fh;
    /* Treads are half the size they used to be — twice as many, half as deep and
       half as tall — so a flight reads as a staircase instead of a ladder of
       crates. They are scenery and enemy collision only: what the player walks
       on is the flight's ramp platform below, whose surface is a continuous
       function of x. A ramp has no seams, so there is nowhere along a flight —
       visible or not — for the player to drop between two treads. */
    var steps=12, stw=12*S, sth=fh/steps, runW=steps*stw, riser=sth+6*S;
    // A flight runs from the floor it leaves to the landing it meets, so odd
    // storeys run left-to-right starting just past the door and even storeys run
    // back the other way. Both ends are flush: the low end sits on the floor
    // below and the top tread hands straight over to its landing slab.
    var goRight=(f%2===1), lowX=goRight?(x+66*S):(x+w-40*S-runW), sl;
    var flLowX=goRight?lowX:lowX+runW, flHighX=goRight?lowX+runW:lowX;
    b.stairs.push({lowX:flLowX,lowY:lower,highX:flHighX,highY:fy,goRight:goRight,floor:f});
    lv.plats.push({x:lowX,y:fy,w:runW,h:lower-fy,inside:b,step:true,
      ramp:{x1:flLowX,y1:lower,x2:flHighX,y2:fy}});
    for(i=0;i<steps;i++){
      // Tread tops straddle the ramp line, so feet always look planted on one.
      var stx=lowX+(goRight?i:(steps-1-i))*stw, sty=lower-(i+0.5)*sth;
      lv.plats.push({x:stx,y:sty,w:stw+1,h:riser,inside:b,step:true});
      b.steps.push({x:stx,y:sty,w:stw+1,h:riser});
    }
    /* The storey above is a whole floor, wall to wall, with the flight hanging
       underneath it rather than a ledge that stops at the stairwell. Walking the
       upper floor therefore carries straight on over the stairs to the rest of
       that floor; going down is a matter of asking for the stairs at their head.
       Floors are one-way besides: you land on one from above and pass straight
       up through it from below, so a jump made under a floor reaches it instead
       of stopping dead on its underside, and crouch + JUMP drops back through. */
    sl={x:x+8*S,y:fy,w:w-16*S,h:11*S};
    b.slabs.push(sl);
    lv.plats.push({x:sl.x,y:sl.y,w:sl.w,h:sl.h,inside:b,interiorFloor:true,oneway:true});
  }
  for(f=0;f<floors;f++){
    var base=gy-f*fh;
    for(i=0;i<3;i++){
      var wx=x+28*S+i*((w-96*S)/2);
      if(wx+40*S>x+w-18*S)continue;
      if(f===0&&wx+40*S>b.door.x-16*S&&wx<b.door.x+b.door.w+16*S)continue; // no window in the doorway
      var landing=(f===0);
      for(var q=0;q<b.slabs.length;q++){
        var sb=b.slabs[q];
        if(Math.abs(sb.y-base)<2&&wx+34*S>sb.x&&wx+6*S<sb.x+sb.w){landing=true;break;}
      }
      var win={x:wx,y:base-54*S,w:40*S,h:46*S,open:false,broken:false,f:f,base:base,b:b};
      b.windows.push(win);
    }
    // A narrow window in the right edge is the building's deliberate escape
    // point. Façade windows still shatter, but never change interior state.
    b.windows.push({x:x+w-24*S,y:base-50*S,w:22*S,h:42*S,open:false,broken:false,
      f:f,base:base,b:b,sideExit:true});
  }
  lv.buildings.push(b);
  return b;
}
/* ==================== THEME PROPS ====================
   Replaces the old free-floating slabs. Every stage now climbs over objects
   that belong to it: pipework in the sewers, street furniture and parked cars
   downtown, crates and haulage on the warehouse floors. Everything here is

/* A standing jump peaks at v^2/2g = 11.9^2 / (2*0.52) ~= 136px, so anything the
   player is expected to hop over stays at or under PROP_MAX_H, leaving real

var PROP_MAX_H=100;
var PROP_SETS={

    climb:{air:true,spec:{t:'pipe',w:[120,250],h:[24,44],hp:95}}
  },
  street:{

function assignEnemyTerritory(e){

  }

    var d=Math.abs(p.y-foot);

function holdEnemyTerritory(e){

      var same=original&&!original.air&&Math.abs(foot-original.y)<4&&e.x+e.w>original.x1&&e.x<original.x2;

     lands on, and takes its patch from there once the chase is over. */

    if(e.x+e.w>t.x2){e.x=t.x2-e.w;e.vx=-Math.abs(e.vx);}
    if(e.y<t.y1){e.y=t.y1;e.vy=Math.abs(e.vy);}

function equipWeapon(wep,ammo,activate){

  if(WEAPONS[wep].ammo===Infinity)P.weaponAmmo[wep]=Infinity;
  else if(ammo!==undefined)P.weaponAmmo[wep]=Math.max(P.weaponAmmo[wep]||0,ammo);
  else if(P.weaponAmmo[wep]===undefined)P.weaponAmmo[wep]=WEAPONS[wep].ammo;

/* Touch controls run the twin-stick rules: the right thumb owns facing outright,
   the left one only ever moves. */

   The move stick is the throttle for both halves of the dodge gesture: how far
   the thumb sits from the centre of the well decides how high and how far a
   jump carries, and how fast and how long a roll runs. Sideways lean picks the
   direction, so an up-and-back or down-and-back push leaps or dives backwards

function stickDownThrottle(){return coarsePointer()?stickThrottle(Math.max(0,moveStick.ay)):0;}

   familiar tap-hop that hold-to-rise then extends. Any upward push replaces
   that with its own analogue power instead, from a nudge-high hop to a
   full-height leap, plus the sideways lunge that gives the jump its reach. */
function jumpLaunch(B){
  if(!coarsePointer())return {vy:B.jump,hold:0,lunge:0};
  var t=stickUpThrottle();
  if(t<=0)return {vy:B.jump*0.70,hold:14,lunge:0};
  return {vy:B.jump*(0.70+0.30*t),hold:0,lunge:moveStick.ax*t*B.speed*1.8};
}

  if(jl.lunge){P.vx=jl.lunge*(scale||1);P.airBoost=Math.abs(P.vx);}

     shot simply follows the way the brother faces; the move stick never steers
     it, which is the whole point of the second stick. */

    if(Math.hypot(aimStick.ax,aimStick.ay)>.24){ax=aimStick.ax;ay=aimStick.ay;}
  }

    else if(d&&(l||r)){ax=l?-1:1;ay=1;}else if(d){ax=0;ay=1;}}

   straight away and the brother lobs one just past his feet; hold and the throw
   stretches out continuously, topping out after NADE_CHARGE_MAX frames. */

function grenadeVelocity(charge){
  var t=clamp((charge||0)/NADE_CHARGE_MAX,0,1),up=!!inp.up;
  var minS=up?2.2:3.4, maxS=up?3.5:7.0, minL=up?-8.5:-5.6, maxL=up?-11:-7.5;
  return {power:t,vx:P.facing*lerp(minS,maxS,t),vy:lerp(minL,maxL,t)};

function throwNade(charge){

  nades.push({x:P.x+P.w/2,y:P.y+8,vx:v.vx,vy:v.vy,life:80,r:7,mine:true,sp:0,power:v.power});
  tone(340+300*v.power,0.08,'triangle',0.04,660+420*v.power);

/* How near an end of a flight counts as being at it, both for asking for the
   stairs and for how far past the end a flight keeps hold of the brother. */
var STAIR_GRAB_X=56, STAIR_GRAB_Y=26;
/* The rise an object takes in its stride: low ledges, kerbs and stair treads are
   stepped over rather than walked into, and a floor edge this close overhead is
   pulled up onto rather than missed. */
var STEP_UP=17;

  if(p.dead||(p.obstacle&&p.obstacle.dead))return false;
  if(o===P&&P.dropT>0&&(p.oneway||p.interiorFloor))return false;
  if(p.oneway)return false;
  if(p.ramp)return false;                     // a flight supports from above, never blocks
  if(p.step&&o===P)return false;              // treads are scenery; the ramp carries the player
  if(p.inside&&p.inside!==o.inB)return false;   // interior walls/floors/stairs
  return true;
}
/* A stair flight is one continuous surface rather than a row of separate treads:
   its height is a function of x across the whole run, so once the brother is on
   a flight, walking, running and rolling up or down it work like sloped ground
   with no seam anywhere to fall through. Its ends meet the floor below and the
   landing above exactly, so a flight is simply where one floor becomes the next.
   Getting on one is a decision, though — see stairEngage. */
function rampSpans(p,cx,engaged){
  var pad=engaged?STAIR_GRAB_X:0;
  return cx>p.x-pad&&cx<p.x+p.w+pad;
}
function rampSurfaceY(p,cx){
  var r=p.ramp;

}
function rampCarries(p,o){
  var cx=o.x+o.w/2,engaged=(o===P&&P.onStair===p);
  /* A flight the brother has taken keeps hold of him for a stride past either
     end, where its surface has flattened out into the floor it meets — so
     stepping onto the stairs from a pace short of them is stepping onto the
     stairs, and the last stride off the bottom is still the same movement. */
  if(!rampSpans(p,cx,engaged)||o.vy<0)return false;
  var sy=rampSurfaceY(p,cx),feet=o.y+o.h;
  /* On the flight, the steps are underfoot in both directions: they may rise a
     stride into the next pace, and going down they fall away faster than gravity
     takes a walker, so the surface reaches up a stride for him too. That is what
     keeps a walk or a roll glued to the stairs instead of skipping down them in
     little hops. Jumping releases the flight, so this never fights a jump. */
  if(engaged)return feet>=sy-STEP_UP&&feet-o.vy<=sy+STEP_UP;
  if(feet<sy-2)return false;

/* Stairs are furniture until you ask for them. At either end of a flight, a push
   into it plus the direction you mean to travel — towards it and UP at the foot,
   towards it and DOWN at the head — puts the brother on the steps; from there
   ordinary movement carries him along until he walks off an end. */
function stairEngage(){
  if(!P.inB||!P.onGround||P.dropT>0)return false;
  var i,p,r,cx=P.x+P.w/2,feet=P.y+P.h,up,toHead,toFoot;
  for(i=0;i<level.plats.length;i++){
    p=level.plats[i];
    if(!p.ramp||p.inside!==P.inB)continue;
    r=p.ramp;up=r.x2>r.x1?1:-1;
    toHead=up>0?inp.right:inp.left;            // towards the flight, from its foot
    toFoot=up>0?inp.left:inp.right;            // towards the flight, from its head
    if(P.onStair===p)continue;                 // already on it: DOWN means roll, not board
    if(pressed('up')&&toHead&&Math.abs(cx-r.x1)<STAIR_GRAB_X&&Math.abs(feet-r.y1)<STAIR_GRAB_Y){P.onStair=p;P.stairIn=false;return true;}
    if(pressed('down')&&toFoot&&Math.abs(cx-r.x2)<STAIR_GRAB_X&&Math.abs(feet-r.y2)<STAIR_GRAB_Y){P.onStair=p;P.stairIn=false;return true;}
  }

}
function droppableSurfaceBelow(o){
  if(!o.onGround)return false;
  var foot=o.y+o.h,cx=o.x+o.w/2;
  for(var i=0;i<level.plats.length;i++){
    var p=level.plats[i];
    if(p.dead||(p.obstacle&&p.obstacle.dead)||!(p.oneway||p.interiorFloor))continue;
    if(p.inside&&p.inside!==o.inB)continue;
    if(cx>p.x+2&&cx<p.x+p.w-2&&Math.abs(foot-p.y)<5)return true;
  }
  return false;
}
function playerNeedsClearanceCrouch(){
  if(!P.onGround)return false;
  var stand=P_STAND*charScale,feet=P.y+P.h,standY=feet-stand;
  // Test the full standing body at the current feet position. Touching the
  // ground is harmless; only overlapping geometry overhead keeps us low.
  return blockedAt(P,P.x+2,standY,P.w-4,stand);
}
function blockedAt(o,x,y,w,h){
  var i,p,t={x:x,y:y,w:w||o.w,h:h||o.h};
  for(i=0;i<level.plats.length;i++){
    p=level.plats[i];
    if(!solidFor(p,o))continue;
    if(hit(t,{x:p.x,y:p.y,w:p.w,h:p.h}))return true;
  }
  return false;
}
function collidePlatforms(o,useOneway,stepAssist){
  var i,p,r,hits=[];
  o.x+=o.vx;
  for(i=0;i<level.plats.length;i++){
    p=level.plats[i];
    if(!solidFor(p,o))continue;
    if(hit(o,{x:p.x,y:p.y,w:p.w,h:p.h}))hits.push(p);
  }
  if(hits.length&&stepAssist&&o.vy>=-0.1){
    // every blocker is a low step -> climb onto the highest one instead of stopping
    var top=1e9,ok=true;
    for(i=0;i<hits.length;i++){
      var rise=(o.y+o.h)-hits[i].y;
      if(rise<=0||rise>STEP_UP){ok=false;break;}
      if(hits[i].y<top)top=hits[i].y;
    }
    if(ok&&!blockedAt(o,o.x+2,top-o.h,o.w-4)){o.y=top-o.h;o.vy=0;o.onGround=true;hits.length=0;}
  }
  for(i=0;i<hits.length;i++){
    p=hits[i];
    if(o.vx>0)o.x=p.x-o.w;else if(o.vx<0)o.x=p.x+p.w;
    o.vx=0;
  }
  o.y+=o.vy;o.onGround=false;
  for(i=0;i<level.plats.length;i++){
    p=level.plats[i];r={x:p.x,y:p.y,w:p.w,h:p.h};
    if(p.dead||(p.obstacle&&p.obstacle.dead))continue;
    if(o===P&&P.dropT>0&&(p.oneway||p.interiorFloor))continue;
    // On the stairs, the floor they pass through is a stairwell, not a lid.
    if(o===P&&P.onStair&&p.interiorFloor)continue;
    if(p.inside&&p.inside!==o.inB)continue;
    if(p.ramp){
      if(o===P&&rampCarries(p,o)){
        o.y=rampSurfaceY(p,o.x+o.w/2)-o.h;o.vy=0;o.onGround=true;
        if(P.onStair!==p){P.onStair=p;P.stairIn=true;}
      }
      continue;
    }
    if(p.step&&o===P)continue;                 // treads are scenery; the flight's ramp carries him
    if(p.oneway){
      if(!useOneway)continue;
      /* Storeys stand a shade taller than a jump, so a jump made under one would
         otherwise always die a few pixels short of the floor it was aimed at.
         Cresting within a step's height of an interior floor pulls the player up
         onto it — the same allowance ground steps get, and enough that jumping
         up to the floor above is a jump rather than a measurement. */
      var reach=(o===P&&p.interiorFloor)?STEP_UP+3:2;
      if(o.vy>=0&&o.y+o.h-o.vy<=p.y+reach&&hit(o,r)){o.y=p.y-o.h;o.vy=0;o.onGround=true;}
      continue;
    }
    if(hit(o,r)){
      if(o.vy>0){o.y=p.y-o.h;o.vy=0;o.onGround=true;}
      else if(o.vy<0){o.y=p.y+p.h;o.vy=1;}
    }
  }
}
function doorAt(){
  if(!level.buildings)return null;
  var i,b;
  for(i=0;i<level.buildings.length;i++){
    b=level.buildings[i];
    if(P.x+P.w<b.door.x-6||P.x>b.door.x+b.door.w+6)continue;
    if(P.y+P.h<b.gy-64||P.y+P.h>b.gy+14)continue;
    return b;
  }
  return null;
}
function openWindowAt(b,strict){
  var i,w,cx=P.x+P.w/2,cy=P.y+P.h/2;
  for(i=0;i<b.windows.length;i++){
    w=b.windows[i];
    if(!w.open||!w.sideExit)continue;
    if(strict){                                   // centre must be in the opening
      if(cx>w.x+5&&cx<w.x+w.w-5&&cy>w.y-2&&cy<w.y+w.h+2)return w;
    } else if(hit(P,{x:w.x,y:w.y,w:w.w,h:w.h}))return w;
  }

}
function enterBuilding(b){
  P.inB=b;P.doorT=0;P.winCd=14;P.entryLock=16;P.vx*=.25;
  P.x=clamp(P.x,b.x+12,b.x+b.w-P.w-12);P.checkX=P.x;P.checkY=P.y;
  burst(P.x+P.w/2,P.y+P.h-8,'#e8d6a8',10,2.6);
  tone(320,0.10,'triangle',0.045,520);
  if(b.objective&&level.objective&&level.objective.type==='raid')completeObjective();
}
function exitBuilding(){
  P.inB=null;P.doorT=0;P.winCd=14;P.entryLock=10;P.onStair=null;
  tone(520,0.10,'triangle',0.045,300);
}
function updateBuildingState(){
  var i,b,w,d,exitNear=0;
  if(P.winCd>0)P.winCd--;
  P.interiorFade=lerp(P.interiorFade,P.inB?1:0,P.inB?0.16:0.11);
  if(Math.abs(P.interiorFade-(P.inB?1:0))<.01)P.interiorFade=P.inB?1:0;
  if(P.inB){
    var pxc=P.x+P.w/2,pyc=P.y+P.h/2;
    for(i=0;i<P.inB.windows.length;i++){
      w=P.inB.windows[i];if(!w.sideExit)continue;
      var exd=Math.abs(pxc-(P.inB.x+P.inB.w-12)),eyd=Math.abs(pyc-(w.y+w.h/2));
      if(exd<78&&eyd<62)exitNear=Math.max(exitNear,1-Math.max(exd/78,eyd/62));
    }
  }
  P.exitFocus=lerp(P.exitFocus,exitNear,exitNear>P.exitFocus?0.18:0.12);
  /* Doors are deliberate, single-press interactions: UP enters, DOWN exits. */
  d=doorAt();P.atDoor=(d&&(!P.inB||P.inB===d))?d:null;P.doorT=0;
  if(P.atDoor&&P.winCd<=0){
    if(!P.inB&&pressed('up'))enterBuilding(P.atDoor);
    else if(P.inB&&pressed('down'))exitBuilding();
  }
  /* Side-window exits use the same deliberate crouch + jump gesture as
     dropping through a floor. DOWN alone remains free for downward aim. */
  if(P.inB&&P.winCd<=0&&P.prone&&inp.down&&pressed('jump')&&!inp.fire&&!inp.nade){
    w=openWindowAt(P.inB,true);

      var wb=P.inB,outDir=(w.x+w.w/2<wb.x+wb.w/2)?-1:1;
      exitBuilding();P.rollT=0;P.prone=false;P.h=P_STAND*charScale;
      P.x=outDir<0?wb.x-P.w-10:wb.x+wb.w+10;
      if(w.f===0){
        P.y=wb.gy-P.h;P.vx=outDir*1.8;P.vy=0;P.onGround=true;
        P.checkX=P.x;P.checkY=P.y;

      }

  // and a deliberate DOWN-at-window interaction may clear P.inB.
  if(P.inB){
    b=P.inB;

    if(P.y<b.y+5){P.y=b.y+5;P.vy=Math.max(1,P.vy);}
    if(P.y+P.h>b.gy+12){P.y=b.gy-P.h;P.vy=0;P.onGround=true;}
  }
  for(i=0;i<level.buildings.length;i++){
    b=level.buildings[i];
    b.cut=lerp(b.cut,(P.inB===b)?1:0,0.14);
    b.doorOpen=lerp(b.doorOpen,(P.inB===b)?1:0,0.20);
  }
}
/* Stairs are no longer a scripted traversal mode. A flight is terrain — its ramp
   is the floor below turning into the floor above — so walking, running, rolling
   and jumping across one all use the ordinary movement rules, in either
   direction, with nothing to attach to and nothing to release. */
function updateLadderTraversal(){
  if(P.inB||!level.ladders)return false;
  var i,L,cx=P.x+P.w/2,feet=P.y+P.h;
  if(!P.ladder){
    for(i=0;i<level.ladders.length;i++){
      L=level.ladders[i];
      if(pressed('up')&&Math.abs(cx-(L.x+L.w/2))<46&&Math.abs(feet-L.bottomY)<28){P.ladder=L;break;}
    }
    if(!P.ladder)return false;
    P.rollT=0;P.prone=false;P.h=P_STAND*charScale;P.vx=0;P.vy=0;
  }
  L=P.ladder;P.x=lerp(P.x,L.x+L.w/2-P.w/2,.28);P.y-=2.8;P.vx=0;P.vy=0;P.onGround=false;P.anim+=.3;
  if(P.y+P.h<=L.topY){P.x=L.topX;P.y=L.topY-P.h;P.onGround=true;P.ladder=null;P.checkX=P.x;P.checkY=P.y;}
  return true;
}
function updatePlayer(){
  var B=BROS[P.bro],dropNow=false,clearanceCrouch=false;
  if(P.cd>0)P.cd--;
  if(P.inv>0)P.inv--;
  if(P.swapCd>0)P.swapCd--;
  if(P.fireT>0)P.fireT--;
  if(P.rollCd>0)P.rollCd--;
  if(P.jumpLock>0)P.jumpLock--;
  if(P.dropT>0)P.dropT--;
  if(P.entryLock>0){P.entryLock--;P.vx*=.72;}
  if(pressed('swap')&&P.swapCd<=0){
    var frac=P.hp/P.maxHp;
    P.bro=1-P.bro;B=BROS[P.bro];
    P.maxHp=B.maxHp;P.hp=Math.max(14,Math.round(B.maxHp*frac));
    P.swapCd=40;P.inv=Math.max(P.inv,26);SFX.swap();
    burst(P.x+P.w/2,P.y+P.h/2,B.trim,14,3.5);
    addLight(P.x+P.w/2,P.y+P.h/2,120,'#ffffff',14);
  }
  if(updateLadderTraversal())return;
  /* Asking for the stairs is a movement input like any other, so it is resolved
     before the moves that share its buttons: the same push that steps onto a
     flight would otherwise dive into a roll or spring off the ground. */
  var tookStairs=stairEngage();

  if(dropNow){
    P.dropT=13;P.onGround=false;P.coyote=0;P.vy=3.8;P.y+=6;
    P.prone=false;P.h=P_STAND*charScale;burst(P.x+P.w/2,P.y+P.h,'#9b8d72',5,1.6);tone(210,.05,'triangle',.025,130);
  }
  if(P.onGround&&P.rollAir)P.rollAir=false;
  if(P.onGround&&P.rollT<=0)P.airRollUsed=false;
  // A lunging jump's extra reach is spent the moment the feet are back down.
  if(P.onGround)P.airBoost=0;
  var groundRoll=P.onGround&&(inp.left||inp.right||Math.abs(P.vx)>0.8);
  var airRoll=!P.onGround&&!P.airRollUsed;
  if(!dropNow&&!tookStairs&&P.rollT<=0&&P.rollCd<=0&&!P.atDoor&&pressed('down')&&(groundRoll||airRoll)){
    P.rollDir=inp.left?-1:inp.right?1:(Math.abs(P.vx)>.2?(P.vx<0?-1:1):P.facing);
    P.rollPow=rollPower();
    P.rollAir=airRoll;P.rollMax=Math.round((airRoll?20:24)*P.rollPow);P.rollT=P.rollMax;

       reads as the backward dive it is instead of spinning the brother round. */

    if(airRoll){P.airRollUsed=true;P.vx=P.rollDir*Math.max(Math.abs(P.vx),(B.big?3.8:4.4)*P.rollPow);}
    else P.vx=P.rollDir*(B.big?5.4:6.3)*P.rollPow;
    SFX.roll();
    burst(P.x+P.w/2,P.y+P.h,'#9b8d72',7,2.2);
  }
  var rolling=P.rollT>0;
  clearanceCrouch=!rolling&&playerNeedsClearanceCrouch();
  P.prone=rolling||clearanceCrouch||(inp.down&&P.onGround&&!inp.left&&!inp.right);
  var th=(P.prone?P_PRONE:P_STAND)*charScale,tw=P_W*charScale;
  if(th!==P.h){P.y+=(P.h-th);P.h=th;}
  if(tw!==P.w){P.x+=(P.w-tw)/2;P.w=tw;}
  var acc=P.onGround?(clearanceCrouch?0.52:0.85):0.55;
  var maxS=rolling?(B.big?5.4:6.3)*P.rollPow:B.speed*(clearanceCrouch?0.42:(P.prone?0:1));

  if(!rolling&&!P.onGround&&!clearanceCrouch&&P.airBoost>maxS)maxS=P.airBoost;
  if(rolling){
    P.rollT--;
    if(P.rollAir)P.vx=P.rollDir*Math.max((B.big?3.8:4.4)*P.rollPow,Math.abs(P.vx)*.992);
    else P.vx=P.rollDir*(B.big?5.4:6.3)*P.rollPow*(0.72+0.28*P.rollT/P.rollMax);
    if(!P.rollAir&&P.rollT%6===0)addPart(P.x+P.w/2,P.y+P.h,rnd(-1,1),rnd(-1.6,-.3),'#8f8069',16,2.5,.18);
    if(P.rollT<=0)P.rollCd=18;
  } else if(inp.left&&(!P.prone||clearanceCrouch)){P.vx-=acc;if(!twinStick())P.facing=-1;}

  if(twinStick()&&Math.abs(aimStick.ax)>0.2)P.facing=aimStick.ax<0?-1:1;

     launch has already been given its full height and clears jumpHold. */
  if(coarsePointer()&&P.jumpHold>0&&P.vy<0){
    if(inp.jump){P.vy-=.26;P.jumpHold--;}else {P.vy*=.68;P.jumpHold=0;}
  }

     jumps off it, or leaves the building — after which those steps are furniture
     again and he walks straight through them. */
  if(P.onStair){
    var sp=P.onStair,scx=P.x+P.w/2,onRun=scx>sp.x&&scx<sp.x+sp.w;
    if(onRun)P.stairIn=true;

       either end hands him back to the floor there and done with. */
    if(!P.inB||sp.inside!==P.inB||P.vy<-0.1||
       (!onRun&&(P.stairIn||!rampSpans(sp,scx,true))))P.onStair=null;

  if(P.onGround&&P.vy===0){P.checkX=P.x;P.checkY=P.y-4;}
  if(P.y>600)killPlayer();
  var w=WEAPONS[P.weapon];
  if(!rolling){
    /* Held auto-fire has no rising edge, so semi-autos would otherwise fire a

       bite stays on the rising edge only — rolling it into held fire made the
       brother melee forever whenever an enemy was close, and tryBite turns him
       to face his target, which would wrestle the aim stick for facing. */
    var bit=pressed('fire')&&tryBite();

      P.nadeCharge=Math.min(NADE_CHARGE_MAX,P.nadeCharge+1);

         tiers, so the throw you hear matches the throw you get. */
      if(P.nadeCharge<NADE_CHARGE_MAX){
        if(P.nadeCharge%7===0){
          var wind=P.nadeCharge/NADE_CHARGE_MAX;

/* ==================== ENEMY UPDATE ==================== */
/* Stomp: tougher enemies shrug more of it off. P.C.U.-9 cannot be stomped. */
var STOMP={mouse:9999, bat:20, weasel:16, lizard:18, cat:13};
function canStomp(e){
  if(P.bro!==0||P.dead||P.vy<=0.8)return false;             // Rocco's unique air strike
  var foot=P.y+P.h, prevFoot=foot-P.vy;
  if(prevFoot>e.y+9)return false;                            // was already below the head
  if(foot<e.y||foot>e.y+e.h*0.9)return false;
  if(P.x+P.w<e.x+4||P.x>e.x+e.w-4)return false;
  return true;
}
function doStomp(e){
  var d=STOMP[e.t]||12;
  if(e.miniBoss){
    /* A mini-boss is not squashed in one go whatever it is made of, but Rocco
       landing on it is worth a great deal — and worth twice as much while it is
       reloading, which is the fast way to take one down with him. */
    d=(e.maxHp*(miniRecovering(e)?0.20:0.11))/MINI_ARMOUR;
  }
  else if(e.t!=='mouse')d=playerDmg(d);                      // Rocco lands heavier
  var lethal=(e.hp-d<=0);
  damageEnemy(e,d);
  e.squash=10;e.touchCd=26;e.vx*=0.3;
  P.vy=inp.jump?-12.2:-8.6;                                  // hold JUMP for a higher hop
  P.jumps=1;P.coyote=0;
  cam.shake=Math.max(cam.shake,lethal?7:4);
  burst(P.x+P.w/2,e.y+3,'#f0e2c0',lethal?10:6,3.2);
  addLight(P.x+P.w/2,e.y,70,'#ffe6b0',8);
  noise(0.08,0.10,900);
  tone(lethal?260:180,0.09,'square',0.045,lethal?90:120);

   typing it, which means it needs habits a player can read and answer:

     it jumps when a round is on its way in,

   reloading it cannot shoot, it barely moves, and it takes better than twice
   the damage. Catzilla's rockets are murder to stand in front of and trivial to
   roll through, so Vinnie goes in during the volley and collects in the pause
   afterwards. Rocco has no such dodge, but he lands on people, and a stomp
   during a reload is worth two of them.

  boss.vy+=0.6;boss.timer--;
  var sm=boss.phase===2?1.5:1;
  switch(boss.state){
    case 'enter':
      boss.vx=-1.6;
      if(boss.x<level.length*0.55){boss.vx=0;boss.state='idle';boss.timer=40;}
      break;
    case 'idle':
      boss.vx*=0.85;
      if(boss.timer<=0){
        var pk=Math.random();
        if(pk<0.4){boss.state='volley';boss.timer=20;boss.shots=boss.phase===2?5:3;}
        else if(pk<0.72){boss.state='jump';boss.timer=26;}
        else {boss.state='summon';boss.timer=40;}
      }
      break;
    case 'volley':
      boss.vx*=0.9;
      if(boss.timer<=0&&boss.shots>0){
        boss.shots--;boss.timer=Math.round(20/sm);
        var oy=boss.y+56+(boss.shots%2)*38;
        aimedShot(bcx+boss.facing*58,oy,P.x+P.w/2,P.y+16,5.0,{rocket:true,dmg:24,r:8});
        if(boss.phase===2)aimedShot(bcx+boss.facing*58,oy,P.x+P.w/2,P.y-54,4.6,{rocket:true,dmg:20,r:7});
        addLight(bcx+boss.facing*70,oy,140,'#ff9a4a',10);
        tone(140,0.16,'sawtooth',0.05,55);noise(0.12,0.07,800);
      }
      if(boss.shots<=0&&boss.timer<=0){boss.state='idle';boss.timer=45;}
      break;
    case 'jump':
      if(boss.onGround&&boss.timer<=0){boss.vy=-13;boss.vx=(pcx<bcx?-1:1)*4.2*sm;boss.timer=200;}
      if(boss.onGround&&boss.vy===0&&boss.timer<190&&boss.timer>0){
        cam.shake=16;SFX.boom();
        var k;for(k=0;k<2;k++)ebullets.push({x:bcx,y:boss.y+boss.h-14,vx:(k?1:-1)*5,vy:0,
          life:120,r:9,dmg:18,shock:true});
        burst(bcx,boss.y+boss.h,'#c9a06a',22,5);
        addLight(bcx,boss.y+boss.h,220,'#ffd08a',18);
        boss.state='idle';boss.timer=40;
      }
      break;
    case 'summon':
      if(boss.timer<=0){
        var alive=0,z;for(z=0;z<enemies.length;z++)if(!enemies[z].dead)alive++;
        if(alive<7){
          spawnEnemy('mouse',cam.x+40,380);
          spawnEnemy('mouse',cam.x+view.w-60,380);
          spawnEnemy('bat',bcx,140);
        }
        tone(500,0.2,'square',0.05,210);
        boss.state='idle';boss.timer=50;
      }
      break;
  }
  boss.x+=boss.vx;boss.y+=boss.vy;boss.onGround=false;
  if(boss.y+boss.h>=470){boss.y=470-boss.h;boss.vy=0;boss.onGround=true;boss.vx*=0.8;}
  boss.x=clamp(boss.x,20,level.length-boss.w-20);
  if(hit(P,boss))hurtPlayer(20,boss.x+boss.w/2);
}

/* ==================== PROJECTILES ==================== */
function shatterWindow(win){
  if(win.open)return;
  win.open=true;win.broken=true;cam.shake=Math.max(cam.shake,2.5);
  var i,cx=win.x+win.w/2,cy=win.y+win.h/2;
  for(i=0;i<18;i++)addPart(cx+rnd(-18,18),cy+rnd(-18,18),rnd(-3.2,3.2),rnd(-4.2,1.2),
    i%3?'#bfe8ed':'#efffff',rnd(24,48),rnd(1.5,4),0.22);
  addLight(cx,cy,70,'#d9ffff',8);noise(0.16,0.10,4200);tone(1100,0.06,'triangle',0.025,420);
}
function updateProjectiles(){
  var i,j,b,e,p;
  for(i=bullets.length-1;i>=0;i--){
    b=bullets[i];b.px=b.x;b.py=b.y;b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.fire){b.vy+=0.06;b.r*=0.985;}
    var kill=(b.life<=0||b.x<cam.x-60||b.x>cam.x+view.w+60||b.y<cam.y-60||b.y>640);
    if(!kill&&level.buildings)for(var bi=0;bi<level.buildings.length;bi++){
      var wins=level.buildings[bi].windows;
      for(j=0;j<wins.length;j++)if(!wins[j].open&&b.x>wins[j].x&&b.x<wins[j].x+wins[j].w&&
        b.y>wins[j].y&&b.y<wins[j].y+wins[j].h){shatterWindow(wins[j]);kill=true;break;}
      if(kill)break;
    }
    if(!kill&&level.obstacles)for(var oi=0;oi<level.obstacles.length;oi++){
      var ob=level.obstacles[oi];
      if(!ob.dead&&!ob.decorative&&b.x>ob.x&&b.x<ob.x+ob.w&&b.y>ob.y&&b.y<ob.y+ob.h){
        damageObstacle(ob,b.dmg);kill=!b.fire;break;
      }
    }
    if(!kill)for(j=0;j<level.plats.length;j++){
      p=level.plats[j];
      if(p.dead||(p.obstacle&&p.obstacle.dead))continue;
      if(p.inside&&p.inside!==P.inB)continue;
      // Interior gunfire crosses stair treads and floor slabs so enemies on
      // adjacent storeys remain valid targets; outer walls still stop shots.
      if(P.inB&&p.inside===P.inB&&(p.step||p.interiorFloor))continue;
      if(!p.oneway&&b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        kill=true;if(b.rocket)explode(b.x,b.y,72,38,true);else burst(b.x,b.y,'#cfc8b0',4,2.2);break;}
    }
    if(!kill)for(j=0;j<enemies.length;j++){
      e=enemies[j];
      if(e.hidden||(e.inB||null)!==(P.inB||null))continue;
      if(!e.dead&&b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
        playerHitEnemy(e,b.dmg);if(b.rocket)explode(b.x,b.y,68,28,true);if(!b.fire)kill=true;break;}
    }
    if(!kill&&boss&&boss.state!=='dead'&&b.x>boss.x+8&&b.x<boss.x+boss.w-6&&
       b.y>boss.y-38&&b.y<boss.y+boss.h){playerHitBoss(b.dmg);if(!b.fire)kill=true;}
    if(kill)bullets.splice(i,1);
  }
  for(i=ebullets.length-1;i>=0;i--){
    b=ebullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.rocket&&tick%2===0)addPart(b.x,b.y,rnd(-.4,.4),rnd(-.4,.2),'rgba(190,190,190,1)',16,3,0.01);
    if(b.shock)b.vy=0;
    var k2=(b.life<=0||b.x<cam.x-90||b.x>cam.x+view.w+90||b.y>640);
    if(!k2)for(j=0;j<level.plats.length;j++){
      p=level.plats[j];
      if(p.dead||(p.obstacle&&p.obstacle.dead))continue;
      if(p.inside&&p.inside!==P.inB)continue;
      if(!p.oneway&&b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        if(b.rocket)explode(b.x,b.y,60,0,false);else burst(b.x,b.y,'#ffbb66',4,2);
        k2=true;break;}
    }
    /* A shot aimed at a rolling Vinnie is not stopped by him, it goes through:
       no hit, no detonation, and the round carries on to whatever is behind. */
    if(!k2&&!playerPhased()&&hit(P,{x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2})){
      hurtPlayer(b.dmg||14,b.x);
      if(b.rocket)explode(b.x,b.y,50,0,false);
      k2=true;
    }
    if(k2)ebullets.splice(i,1);
  }
  for(i=nades.length-1;i>=0;i--){
    var n=nades[i];n.vy+=0.42;n.x+=n.vx;n.y+=n.vy;n.life--;n.sp+=n.vx*0.05;
    var landed=false;
    for(j=0;j<level.plats.length;j++){
      var q=level.plats[j];if(q.oneway)continue;
      if(q.inside&&q.inside!==P.inB)continue;
      if(n.x>q.x&&n.x<q.x+q.w&&n.y+6>q.y&&n.y<q.y+q.h){
        n.y=q.y-6;n.vy*=-0.35;n.vx*=0.6;
        if(Math.abs(n.vy)<1.2)landed=true;
      }
    }
    if(n.life<=0||(landed&&n.mine===false)||(landed&&n.life<60)){
      explode(n.x,n.y,n.mine?86:66,n.mine?70:20,n.mine);
      nades.splice(i,1);continue;
    }
    if(n.y>640)nades.splice(i,1);
  }
  for(i=swings.length-1;i>=0;i--){
    var s=swings[i];s.life--;
    s.x=P.x+(P.facing>0?P.w-4:-(s.w-4));s.y=P.y+(P.prone?P.h-26:2);
    for(j=0;j<enemies.length;j++){
      e=enemies[j];
      if(!e.dead&&hit(s,e)&&!s.done['e'+j]){s.done['e'+j]=true;playerHitEnemy(e,s.dmg);
        e.vx=P.facing*(s.kind==='bite'?2.2:4);e.vy=s.kind==='bite'?-2.2:-4;
        if(s.kind==='bite')burst(e.x+e.w/2,e.y+e.h/2,'#f0e2c0',5,2.2);
        cam.shake=Math.max(cam.shake,s.kind==='bite'?3:5);}
    }
    if(s.kind!=='bite')for(j=ebullets.length-1;j>=0;j--){
      var eb=ebullets[j];
      if(hit(s,{x:eb.x-eb.r,y:eb.y-eb.r,w:eb.r*2,h:eb.r*2})){
        burst(eb.x,eb.y,'#ffe07a',8,3.4);ebullets.splice(j,1);tone(880,0.06,'square',0.05,1500);}
    }
    if(boss&&boss.state!=='dead'&&hit(s,boss)&&!s.done.boss){s.done.boss=true;playerHitBoss(s.dmg);}
    if(s.life<=0)swings.splice(i,1);
  }
  for(i=items.length-1;i>=0;i--){
    var it=items[i];it.bob+=0.08;
    if(hit(P,it)){
      if(it.kind==='mission'){SFX.pick();completeObjective();}
      else if(it.kind==='cheese'){P.hp=Math.min(P.maxHp,P.hp+38);SFX.cheese();score+=50;
        burst(it.x+13,it.y+13,'#ffd94a',12,3);}
      else if(it.kind==='nade'){P.nades=Math.min(9,P.nades+3);SFX.pick();score+=50;}
      else {
        var pickupIsStronger=WEAPONS[it.wep].power>WEAPONS[P.weapon].power;
        equipWeapon(it.wep,WEAPONS[it.wep].ammo,pickupIsStronger);SFX.pick();score+=100;
        burst(it.x+13,it.y+13,WEAPONS[it.wep].col||'#fff',14,3);}
      addLight(it.x+13,it.y+13,110,'#ffe6a8',14);
      items.splice(i,1);
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var pa=parts[i];pa.x+=pa.vx;pa.y+=pa.vy;pa.vy+=pa.gr;pa.vx*=0.985;pa.life--;
    if(pa.life<=0)parts.splice(i,1);
  }
  for(i=flashes.length-1;i>=0;i--){flashes[i].life--;if(flashes[i].life<=0)flashes.splice(i,1);}
  for(i=lights.length-1;i>=0;i--){lights[i].life--;if(lights[i].life<=0)lights.splice(i,1);}
  for(i=marks.length-1;i>=0;i--){marks[i].life--;if(marks[i].life<=0)marks.splice(i,1);}
}

var _skyG=null,_skyK='';
function paintSky(){
  var th=level.theme,x0=cam.x,y0=cam.y,vw=view.w,vh=view.h;
  var k=stage+'|'+Math.round(y0)+'|'+Math.round(vh);
  if(k!==_skyK){_skyK=k;_skyG=lin(g,0,y0,0,y0+vh,[[0,th.sky[0]],[0.52,th.sky[1]],[1,th.sky[2]]]);}
  g.fillStyle=_skyG;
  g.fillRect(x0,y0,vw,vh);
  // moon / backlight
  var mx=x0+vw*0.72-cam.x*0.02, my=y0+vh*0.16;
  g.fillStyle=rad(g,mx,my,4,vh*0.42,[[0,'rgba(255,240,210,.30)'],[0.35,'rgba(255,220,180,.09)'],[1,'rgba(0,0,0,0)']]);
  g.fillRect(x0,y0,vw,vh);
  g.fillStyle='rgba(255,246,225,.72)';ell(g,mx,my,26,26);g.fill();
}
function silhouette(band,color,par,baseY){
  var th=level.theme,i,x0=cam.x,vw=view.w;
  g.fillStyle=color;
  g.beginPath();
  var bottom=cam.y+view.h;
  g.moveTo(x0-40,bottom);
  for(i=0;i<level.props.length;i++){
    var pr=level.props[i];if(pr.band!==band)continue;
    var sx=pr.x+cam.x*(par-1), w=pr.w, top=baseY-pr.h*(band?0.7:1);
    if(sx+w<x0-60||sx>x0+vw+60)continue;
    if(th.prop==='city'){
      g.lineTo(sx,bottom);g.lineTo(sx,top);g.lineTo(sx+w,top);g.lineTo(sx+w,bottom);
    } else if(th.prop==='pipe'){
      g.lineTo(sx,bottom);g.lineTo(sx,top+30);
      g.quadraticCurveTo(sx+w/2,top-24,sx+w,top+30);g.lineTo(sx+w,bottom);
    } else if(th.prop==='junk'){
      g.lineTo(sx,bottom);g.lineTo(sx+w*0.2,top+40);g.lineTo(sx+w*0.55,top);
      g.lineTo(sx+w*0.8,top+55);g.lineTo(sx+w,bottom);
    } else {
      g.lineTo(sx,bottom);g.lineTo(sx+w*0.12,top);g.lineTo(sx+w*0.3,top);
      g.lineTo(sx+w*0.3,top+50);g.lineTo(sx+w,top+50);g.lineTo(sx+w,bottom);
    }
  }
  g.lineTo(x0+vw+40,bottom);g.closePath();g.fill();
  // Small lit/readable marks prevent the parallax masses from feeling flat.
  for(i=0;i<level.props.length;i++){
    var dp=level.props[i];if(dp.band!==band)continue;
    var dx=dp.x+cam.x*(par-1),dw=dp.w,dtop=baseY-dp.h*(band?0.7:1);
    if(dx+dw<x0-60||dx>x0+vw+60)continue;
    if(th.prop==='city'){
      g.fillStyle=hexA(th.lamp,band?0.075:0.045);
      for(var wy=dtop+18;wy<Math.min(baseY-22,dtop+dp.h*.62);wy+=25)
        for(var wx=dx+13;wx<dx+dw-10;wx+=22)if(((wx+wy+dp.x)|0)%3)g.fillRect(wx,wy,7,10);
    } else if(th.prop==='pipe'){
      g.strokeStyle='rgba(150,180,165,'+(band?.08:.05)+')';g.lineWidth=3;
      g.beginPath();g.moveTo(dx+8,dtop+28);g.quadraticCurveTo(dx+dw/2,dtop-14,dx+dw-8,dtop+28);g.stroke();
    } else if(th.prop==='junk'){
      g.strokeStyle='rgba(205,150,75,'+(band?.07:.04)+')';g.lineWidth=2;
      g.beginPath();g.moveTo(dx+dw*.18,baseY-12);g.lineTo(dx+dw*.55,dtop+8);g.lineTo(dx+dw*.82,baseY-18);g.stroke();
    }
  }
}
function paintFog(){

function hexA(h,a){
  var r=parseInt(h.substr(1,2),16),gg=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);
  return 'rgba('+r+','+gg+','+b+','+a+')';
}
function paintRays(){

function paintGround(){
  var th=level.theme,i,j;

      g.fillStyle='rgba(255,255,255,.10)';g.fillRect(p.x+2,p.y+1,p.w-4,2);

      g.fillStyle=lin(g,p.x,p.y,p.x,p.y+p.h,[[0,th.gtop],[0.10,th.gnd],[1,'#0a0b0d']]);
      g.fillRect(p.x,p.y,p.w,p.h);
      g.fillStyle='rgba(255,255,255,.14)';g.fillRect(p.x,p.y,p.w,3);
      g.fillStyle='rgba(0,0,0,.30)';g.fillRect(p.x,p.y+9,p.w,4);
      var rg=mulberry32(Math.round(p.x)*7+13);
      g.fillStyle='rgba(0,0,0,.28)';
      for(j=0;j<p.w;j+=17){
        var h1=6+rg()*16;
        g.fillRect(p.x+j+rg()*6,p.y+13,3+rg()*7,h1);
      }
      g.fillStyle='rgba(255,255,255,.05)';
      for(j=0;j<p.w;j+=46)g.fillRect(p.x+j+8,p.y+4,20,2);
      // Theme-specific surface dressing gives each route a hand-built identity.
      if(th.prop==='pipe'){
        g.fillStyle='rgba(8,14,12,.55)';
        for(j=38;j<p.w-45;j+=128){rr(g,p.x+j,p.y+5,54,12,2);g.fill();
          g.strokeStyle='rgba(150,185,160,.18)';g.lineWidth=1;rr(g,p.x+j+.5,p.y+5.5,53,11,2);g.stroke();
          for(var gv=0;gv<4;gv++){g.fillStyle='rgba(145,175,150,.28)';g.fillRect(p.x+j+8+gv*11,p.y+8,2,6);}}
      } else if(th.prop==='city'){
        g.strokeStyle='rgba(20,18,22,.34)';g.lineWidth=1.4;
        for(j=12;j<p.w;j+=38){g.beginPath();g.moveTo(p.x+j,p.y+2);g.lineTo(p.x+j-5,p.y+23);g.stroke();}
        g.fillStyle='rgba(190,205,210,.13)';for(j=70;j<p.w;j+=190)g.fillRect(p.x+j,p.y+5,64,2);
      } else if(th.prop==='junk'){
        for(j=45;j<p.w-60;j+=156){
          g.fillStyle='rgba(210,145,45,.34)';g.fillRect(p.x+j,p.y+4,70,8);
          g.strokeStyle='rgba(35,25,18,.65)';g.lineWidth=5;
          for(var hz=0;hz<5;hz++){g.beginPath();g.moveTo(p.x+j+hz*17,p.y+12);g.lineTo(p.x+j+hz*17+11,p.y+4);g.stroke();}
        }
      } else if(th.prop==='dock'){
        g.strokeStyle='rgba(10,22,28,.48)';g.lineWidth=2;
        for(j=20;j<p.w;j+=42){g.beginPath();g.moveTo(p.x+j,p.y+2);g.lineTo(p.x+j,p.y+22);g.stroke();}
        g.fillStyle='rgba(220,210,175,.18)';for(j=18;j<p.w;j+=84){ell(g,p.x+j,p.y+7,2,2);g.fill();}
      }

function playerReachedExit(){
  if(!level.exit||P.dead)return false;
  if(level.objective&&!level.objective.done)return false;
  if(!level.miniBossDefeated)return false;
  var e=level.exit,feet=P.y+P.h,near=P.x+P.w>e.x-40&&P.x<e.x+48&&Math.abs(feet-e.y)<34;
  if(!near||!e.open)return false;
  return (e.kind==='toilet'||e.kind==='containerdrop')?pressed('down'):pressed('up');
}

function drawBrother(x,y,face,broIdx,aim,walk,prone,inAir,alpha,wep,fireT,mul){

    g.fillStyle=B.bootL;                                                  // white soles + toe caps

/* Weapon gallery, drawn in world space over the brother's head while a swipe
   across him is live (and for a beat afterwards). Reads left-to-right: previous,
   equipped, next — the same order the thumb drags through. */
function paintWeaponWheel(){
  if(wepSwipe.shown<=0||P.dead)return;
  var inv=P.weapons||['scratch'];
  if(inv.length<2)return;
  var wi=inv.indexOf(P.weapon),i;
  var a=Math.min(1,wepSwipe.shown/16);
  var cx=P.x+P.w/2, cy=P.y-30*charScale, gr=15*charScale, gap=gr*2.3;
  g.save();g.globalAlpha=a;
  g.fillStyle='rgba(6,10,12,.62)';
  rr(g,cx-gap-gr*1.15,cy-gr*1.2,(gap+gr*1.15)*2,gr*2.4,gr*0.7);g.fill();
  g.strokeStyle='rgba(232,194,90,.34)';g.lineWidth=1.5;
  rr(g,cx-gap-gr*1.15,cy-gr*1.2,(gap+gr*1.15)*2,gr*2.4,gr*0.7);g.stroke();
  for(i=-1;i<=1;i++){
    var idx=(wi+i+inv.length)%inv.length,wep=inv[idx],wx=cx+i*gap,active=i===0;
    g.globalAlpha=a*(active?1:0.5);
    g.fillStyle=active?'rgba(201,162,74,.34)':'rgba(10,14,16,.34)';
    ell(g,wx,cy,gr*(active?1:.78),gr*(active?1:.78));g.fill();
    g.strokeStyle=active?'rgba(255,225,145,.80)':'rgba(245,248,248,.24)';
    g.lineWidth=active?2:1;g.stroke();
    drawWeaponIcon(g,wx,cy,wep,WEAPONS[wep].col||'#fff',(active?.8:.6)*gr/19*charScale);
  }
  g.globalAlpha=a;
  /* Hint sits above the panel — below it would land across the brother's face. */
  g.fillStyle='rgba(255,235,180,.7)';
  g.font='bold '+Math.max(7,5*charScale)+'px Arial,sans-serif';g.textAlign='center';
  g.fillText('◀  SWIPE  ▶',cx,cy-gr*1.75);
  g.textAlign='left';
  g.restore();g.globalAlpha=1;
}

    g.fillStyle='#8a6a20';g.beginPath();g.arc(w-pad-11-i*15,ny-4,2,0,6.283);g.fill();

function comicBurst(cx,cy,rx,ry){
  var pts=32,i,a,r;
  g.beginPath();
  for(i=0;i<pts;i++){
    a=-Math.PI/2+i*6.283/pts;r=(i%2?0.78:1)*(0.94+0.08*Math.sin(i*7.3));
    var x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r;
    if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
  }
  g.closePath();
}
function titleHeroAction(offset){
  var p=(tick+offset)%420,a={duck:false,jump:0,roll:0,slide:0,fire:0,walk:tick*0.035};
  if(p>=80&&p<128)a.fire=(p%8)<5?6:0;
  else if(p>=132&&p<180)a.duck=true;
  else if(p>=184&&p<252){
    var rt=(p-184)/68;a.duck=true;a.roll=rt*6.283;a.slide=Math.sin(rt*Math.PI)*34;
  } else if(p>=270&&p<338){
    var jt=(p-270)/68;a.jump=Math.sin(jt*Math.PI)*42;a.walk+=jt*5;
  } else if(p>=354&&p<404)a.fire=(p%10)<5?6:0;
  return a;
}

/* ==================== ARCADE PANEL ==================== */
function drawFloatStick(s,label,isAim){
  s.vx=lerp(s.vx,s.ax,.35);s.vy=lerp(s.vy,s.ay,.35);
  var sx=s.cx,sy=s.cy,R=s.r,kx=sx+s.vx*R*.48,ky=sy+s.vy*R*.48;
  var live=Math.hypot(s.ax,s.ay)>.24;
  var firing=isAim&&triggerLive;
  // Pushed hard with the safety on: show the thumb is at the trigger and the
  // gun is choosing not to fire, rather than leaving it looking broken.
  var safed=isAim&&!firing&&Math.hypot(s.ax,s.ay)>AUTOFIRE_ON;
  pg.fillStyle=firing?'rgba(60,12,8,.26)':safed?'rgba(20,30,26,.24)':'rgba(5,8,10,.20)';
  ell(pg,sx,sy,R,R);pg.fill();
  pg.strokeStyle=firing?'rgba(255,120,90,.75)':safed?'rgba(150,205,150,.55)':
    live?'rgba(255,220,125,.46)':'rgba(225,235,238,.25)';
  pg.lineWidth=firing?3:2;ell(pg,sx,sy,R,R);pg.stroke();
  if(isAim){
    /* The band between "aiming" and "firing" is worth showing: inside it you can
       turn to face a threat without spending ammo. */
    pg.strokeStyle='rgba(255,140,110,.22)';pg.lineWidth=1;
    ell(pg,sx,sy,R*AUTOFIRE_MIN,R*AUTOFIRE_MIN);pg.stroke();
  }
  if(isAim){
    /* A full-circle tick ring and a live bearing line sell the 360 aim. */
    pg.strokeStyle='rgba(225,235,238,.16)';pg.lineWidth=1;
    for(var a=0;a<8;a++){
      var an=a*0.7854,c=Math.cos(an),si=Math.sin(an);
      pg.beginPath();pg.moveTo(sx+c*R*.82,sy+si*R*.82);pg.lineTo(sx+c*R*.95,sy+si*R*.95);pg.stroke();
    }
    if(live){
      var m=Math.hypot(s.vx,s.vy)||1;
      pg.strokeStyle='rgba(255,120,110,.55)';pg.lineWidth=2;
      pg.beginPath();pg.moveTo(sx,sy);pg.lineTo(sx+s.vx/m*R*.95,sy+s.vy/m*R*.95);pg.stroke();
    }
  }
  pg.fillStyle='rgba(210,220,225,.16)';ell(pg,kx,ky,R*.48,R*.48);pg.fill();
  pg.strokeStyle='rgba(245,248,250,.36)';pg.lineWidth=1.5;ell(pg,kx,ky,R*.48,R*.48);pg.stroke();
  pg.fillStyle='rgba(240,245,246,.30)';pg.textAlign='center';pg.textBaseline='middle';
  pg.font='bold '+Math.max(8,R*.19)+'px Arial,sans-serif';pg.fillText(label,sx,sy+R+9);
}
