function shatterWindow(win){
  if(win.open)return;
  win.open=true;win.broken=true;cam.shake=Math.max(cam.shake,2.5);
  var i,cx=win.x+win.w/2,cy=win.y+win.h/2;
  for(i=0;i<18;i++)addPart(cx+rnd(-18,18),cy+rnd(-18,18),rnd(-3.2,3.2),rnd(-4.2,1.2),
    i%3?'#bfe8ed':'#efffff',rnd(24,48),rnd(1.5,4),0.22);
  addLight(cx,cy,70,'#d9ffff',8);noise(0.16,0.10,4200);tone(1100,0.06,'triangle',0.025,420);
}
function updateProjectiles(){
  var i,j,b,e,p;
  for(i=bullets.length-1;i>=0;i--){
    b=bullets[i];b.px=b.x;b.py=b.y;b.x+=b.vx;b.y+=b.vy;b.life--;
    var kill=(b.life<=0||b.x<cam.x-60||b.x>cam.x+view.w+60||b.y<cam.y-60||b.y>640);
    if(!kill&&level.buildings)for(var bi=0;bi<level.buildings.length;bi++){
      var wins=level.buildings[bi].windows;
      for(j=0;j<wins.length;j++)if(!wins[j].open&&b.x>wins[j].x&&b.x<wins[j].x+wins[j].w&&
        b.y>wins[j].y&&b.y<wins[j].y+wins[j].h){shatterWindow(wins[j]);kill=true;break;}
      if(kill)break;
    }
    if(!kill&&level.obstacles)for(var oi=0;oi<level.obstacles.length;oi++){
      var ob=level.obstacles[oi];
      if(!ob.dead&&!ob.decorative&&b.x>ob.x&&b.x<ob.x+ob.w&&b.y>ob.y&&b.y<ob.y+ob.h){
        damageObstacle(ob,b.dmg);kill=true;break;
      }
    }
    if(!kill)for(j=0;j<level.plats.length;j++){
      p=level.plats[j];
      if(p.dead||(p.obstacle&&p.obstacle.dead))continue;
      if(p.inside&&p.inside!==P.inB)continue;
      // Interior gunfire crosses stair treads and floor slabs so enemies on
      // adjacent storeys remain valid targets; outer walls still stop shots.
      if(P.inB&&p.inside===P.inB&&(p.step||p.interiorFloor))continue;
      if(!p.oneway&&b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        kill=true;if(b.rocket)explode(b.x,b.y,72,38,true);else burst(b.x,b.y,'#cfc8b0',4,2.2);break;}
    }
    if(!kill)for(j=0;j<enemies.length;j++){
      e=enemies[j];
      if(e.hidden||(e.inB||null)!==(P.inB||null))continue;
      if(e.dead||b.x<=e.x||b.x>=e.x+e.w||b.y<=e.y||b.y>=e.y+e.h)continue;
      /* A rifle round goes through the first body and takes the one standing
         behind it, and then it is spent. The list is per bullet, so one round
         cannot bill the same body twice as it crosses it. */
      if(b.hits){
        if(b.hits.indexOf(e)>=0)continue;
        b.hits.push(e);
      }
      playerHitEnemy(e,b.dmg);
      if(b.rocket)explode(b.x,b.y,68,28,true);
      if(b.pierce>0){b.pierce--;burst(b.x,b.y,b.col||'#fff',4,2);continue;}
      kill=true;break;
    }
    if(!kill&&boss&&boss.state!=='dead'&&b.x>boss.x+8&&b.x<boss.x+boss.w-6&&
       b.y>boss.y-38&&b.y<boss.y+boss.h){playerHitBoss(b.dmg);
      if(b.pierce>0)b.pierce--;else kill=true;}
    if(kill)bullets.splice(i,1);
  }
  for(i=ebullets.length-1;i>=0;i--){
    b=ebullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.rocket&&tick%2===0)addPart(b.x,b.y,rnd(-.4,.4),rnd(-.4,.2),'rgba(190,190,190,1)',16,3,0.01);
    if(b.shock)b.vy=0;
    var k2=(b.life<=0||b.x<cam.x-90||b.x>cam.x+view.w+90||b.y>640);
    if(!k2)for(j=0;j<level.plats.length;j++){
      p=level.plats[j];
      if(p.dead||(p.obstacle&&p.obstacle.dead))continue;
      if(p.inside&&p.inside!==P.inB)continue;
      if(!p.oneway&&b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        if(b.rocket)explode(b.x,b.y,60,0,false);else burst(b.x,b.y,'#ffbb66',4,2);
        k2=true;break;}
    }
    /* A shot aimed at a rolling Vinnie is not stopped by him, it goes through:
       no hit, no detonation, and the round carries on to whatever is behind. */
    if(!k2&&!playerPhased()&&hit(P,{x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2})){
      hurtPlayer(b.dmg||14,b.x);
      if(b.rocket)explode(b.x,b.y,50,0,false);
      k2=true;
    }
    if(k2)ebullets.splice(i,1);
  }
  for(i=nades.length-1;i>=0;i--){
    var n=nades[i];n.vy+=0.42;n.x+=n.vx;n.y+=n.vy;n.life--;n.sp+=n.vx*0.05;
    var landed=false;
    for(j=0;j<level.plats.length;j++){
      var q=level.plats[j];if(q.oneway)continue;
      if(q.inside&&q.inside!==P.inB)continue;
      if(n.x>q.x&&n.x<q.x+q.w&&n.y+6>q.y&&n.y<q.y+q.h){
        n.y=q.y-6;n.vy*=-0.35;n.vx*=0.6;
        if(Math.abs(n.vy)<1.2)landed=true;
      }
    }
    if(n.life<=0||(landed&&n.mine===false)||(landed&&n.life<60)){
      explode(n.x,n.y,n.mine?86:66,n.mine?70:20,n.mine);
      nades.splice(i,1);continue;
    }
    if(n.y>640)nades.splice(i,1);
  }
  for(i=swings.length-1;i>=0;i--){
    var s=swings[i];s.life--;
    s.x=P.x+(P.facing>0?P.w-4:-(s.w-4));s.y=P.y+(P.prone?P.h-26:2);
    for(j=0;j<enemies.length;j++){
      e=enemies[j];
      if(!e.dead&&hit(s,e)&&!s.done['e'+j]){s.done['e'+j]=true;playerHitEnemy(e,s.dmg);
        e.vx=P.facing*(s.kind==='bite'?2.2:4);e.vy=s.kind==='bite'?-2.2:-4;
        if(s.kind==='bite')burst(e.x+e.w/2,e.y+e.h/2,'#f0e2c0',5,2.2);
        cam.shake=Math.max(cam.shake,s.kind==='bite'?3:5);}
    }
    if(s.kind!=='bite')for(j=ebullets.length-1;j>=0;j--){
      var eb=ebullets[j];
      if(hit(s,{x:eb.x-eb.r,y:eb.y-eb.r,w:eb.r*2,h:eb.r*2})){
        burst(eb.x,eb.y,'#ffe07a',8,3.4);ebullets.splice(j,1);tone(880,0.06,'square',0.05,1500);}
    }
    if(boss&&boss.state!=='dead'&&hit(s,boss)&&!s.done.boss){s.done.boss=true;playerHitBoss(s.dmg);}
    if(s.life<=0)swings.splice(i,1);
  }
  for(i=items.length-1;i>=0;i--){
    var it=items[i];it.bob+=0.08;
    if(hit(P,it)){
      if(it.kind==='mission'){SFX.pick();completeObjective();}
      else if(it.kind==='cheese'){P.hp=Math.min(P.maxHp,P.hp+38);SFX.cheese();score+=50;
        burst(it.x+13,it.y+13,'#ffd94a',12,3);}
      else if(it.kind==='nade'){P.nades=Math.min(9,P.nades+3);SFX.pick();score+=50;}
      else if(it.kind==='token'){
        setTokens(tokens+1);score+=250;SFX.pick();
        tone(880,.09,'triangle',.05,1320);tone(1180,.12,'triangle',.04,1560);
        burst(it.x+it.w/2,it.y+it.h/2,'#ffd76a',12,3);
        addLight(it.x+it.w/2,it.y+it.h/2,90,'#ffd76a',16);
      }
      else {
        /* Guns are routed before they are handed over: a drop meant for the
           brother who stayed home becomes the piece this one can use, and
           Vinnie's second pistol becomes the pair. */
        var got=resolvePickup(it.wep,P.bro,P.weapons),gw=WEAPONS[got];
        if(it.kind==='ammo'){
          /* A clip for a gun he has tops it up; a clip for one he does not is
             worth the gun and a couple of rounds rather than nothing at all. */
          var have=P.weapons.indexOf(got)>=0;
          var give=gw.ammo===Infinity?Infinity:Math.max(1,Math.round(gw.ammo*(have?0.5:0.3)));
          if(have){
            P.weaponAmmo[got]=(P.weaponAmmo[got]===Infinity)?Infinity:(P.weaponAmmo[got]||0)+give;
            if(P.weapon===got)P.ammo=P.weaponAmmo[got];
          } else equipWeapon(got,give,false);
          SFX.pick();score+=40;
          burst(it.x+13,it.y+13,gw.col||'#fff',9,2.4);
        } else {
          equipWeapon(got,gw.ammo,gw.power>WEAPONS[P.weapon].power);SFX.pick();score+=100;
          burst(it.x+13,it.y+13,gw.col||'#fff',14,3);
        }
      }
      addLight(it.x+13,it.y+13,110,'#ffe6a8',14);
      items.splice(i,1);
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var pa=parts[i];pa.x+=pa.vx;pa.y+=pa.vy;pa.vy+=pa.gr;pa.vx*=0.985;pa.life--;
    if(pa.life<=0)parts.splice(i,1);
  }
  for(i=flashes.length-1;i>=0;i--){flashes[i].life--;if(flashes[i].life<=0)flashes.splice(i,1);}
  for(i=lights.length-1;i>=0;i--){lights[i].life--;if(lights[i].life<=0)lights.splice(i,1);}
  for(i=marks.length-1;i>=0;i--){marks[i].life--;if(marks[i].life<=0)marks.splice(i,1);}
}

/* ==================== WORLD PAINTING ==================== */
var _skyG=null,_skyK='';
function paintSky(){
  var th=level.theme,x0=cam.x,y0=cam.y,vw=view.w,vh=view.h;
  var k=stage+'|'+Math.round(y0)+'|'+Math.round(vh);
  if(k!==_skyK){_skyK=k;_skyG=lin(g,0,y0,0,y0+vh,[[0,th.sky[0]],[0.52,th.sky[1]],[1,th.sky[2]]]);}
  g.fillStyle=_skyG;
  g.fillRect(x0,y0,vw,vh);
  // moon / backlight
  var mx=x0+vw*0.72-cam.x*0.02, my=y0+vh*0.16;
  g.fillStyle=rad(g,mx,my,4,vh*0.42,[[0,'rgba(255,240,210,.30)'],[0.35,'rgba(255,220,180,.09)'],[1,'rgba(0,0,0,0)']]);
  g.fillRect(x0,y0,vw,vh);
  g.fillStyle='rgba(255,246,225,.72)';ell(g,mx,my,26,26);g.fill();
}
function silhouette(band,color,par,baseY){
  var th=level.theme,i,x0=cam.x,vw=view.w;
  g.fillStyle=color;
  g.beginPath();
  var bottom=cam.y+view.h;
  g.moveTo(x0-40,bottom);
  for(i=0;i<level.props.length;i++){
    var pr=level.props[i];if(pr.band!==band)continue;
    var sx=pr.x+cam.x*(par-1), w=pr.w, top=baseY-pr.h*(band?0.7:1);
    if(sx+w<x0-60||sx>x0+vw+60)continue;
    if(th.prop==='city'){
      g.lineTo(sx,bottom);g.lineTo(sx,top);g.lineTo(sx+w,top);g.lineTo(sx+w,bottom);
    } else if(th.prop==='pipe'){
      g.lineTo(sx,bottom);g.lineTo(sx,top+30);
      g.quadraticCurveTo(sx+w/2,top-24,sx+w,top+30);g.lineTo(sx+w,bottom);
    } else if(th.prop==='junk'){
      g.lineTo(sx,bottom);g.lineTo(sx+w*0.2,top+40);g.lineTo(sx+w*0.55,top);
      g.lineTo(sx+w*0.8,top+55);g.lineTo(sx+w,bottom);
    } else {
      g.lineTo(sx,bottom);g.lineTo(sx+w*0.12,top);g.lineTo(sx+w*0.3,top);
      g.lineTo(sx+w*0.3,top+50);g.lineTo(sx+w,top+50);g.lineTo(sx+w,bottom);
    }
  }
  g.lineTo(x0+vw+40,bottom);g.closePath();g.fill();
  // Small lit/readable marks prevent the parallax masses from feeling flat.
  for(i=0;i<level.props.length;i++){
    var dp=level.props[i];if(dp.band!==band)continue;
    var dx=dp.x+cam.x*(par-1),dw=dp.w,dtop=baseY-dp.h*(band?0.7:1);
    if(dx+dw<x0-60||dx>x0+vw+60)continue;
    if(th.prop==='city'){
      g.fillStyle=hexA(th.lamp,band?0.075:0.045);
      for(var wy=dtop+18;wy<Math.min(baseY-22,dtop+dp.h*.62);wy+=25)
        for(var wx=dx+13;wx<dx+dw-10;wx+=22)if(((wx+wy+dp.x)|0)%3)g.fillRect(wx,wy,7,10);
    } else if(th.prop==='pipe'){
      g.strokeStyle='rgba(150,180,165,'+(band?.08:.05)+')';g.lineWidth=3;
      g.beginPath();g.moveTo(dx+8,dtop+28);g.quadraticCurveTo(dx+dw/2,dtop-14,dx+dw-8,dtop+28);g.stroke();
    } else if(th.prop==='junk'){
      g.strokeStyle='rgba(205,150,75,'+(band?.07:.04)+')';g.lineWidth=2;
      g.beginPath();g.moveTo(dx+dw*.18,baseY-12);g.lineTo(dx+dw*.55,dtop+8);g.lineTo(dx+dw*.82,baseY-18);g.stroke();
    }
  }
}
function paintFog(){

    var y=380-i*70+Math.sin(tick*0.006+i)*10;

      [0.5,hexA(th.fog,a)],[1,'rgba(0,0,0,0)']]);

function hexA(h,a){
  var r=parseInt(h.substr(1,2),16),gg=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);
  return 'rgba('+r+','+gg+','+b+','+a+')';
}
function paintRays(){

    g.fillStyle=lin(g,bx,cam.y,bx+90,540,[[0,hexA(th.lamp,0.10)],[1,'rgba(0,0,0,0)']]);
    g.beginPath();g.moveTo(bx,cam.y);g.lineTo(bx+70,cam.y);g.lineTo(bx+180,540);g.lineTo(bx+30,540);
    g.closePath();g.fill();
  }
  g.globalCompositeOperation='source-over';
}
function paintLamps(){
  var th=level.theme,i;

function paintIngress(){
  if(!level.flow||level.boss||cam.x>260)return;

    g.fillStyle='#17191a';ell(g,x,y+1,38,10);g.fill();g.strokeStyle='#697276';g.lineWidth=4;g.stroke();
    g.fillStyle='#343a3d';ell(g,x-31,y-12,30,8);g.fill();

    g.fillStyle='#242a2d';rr(g,x-40,y-62,70,59,4);g.fill();g.strokeStyle='#78868a';g.lineWidth=3;g.stroke();

    g.fillStyle='#171316';g.fillRect(x-38,y-96,70,93);g.strokeStyle='#665a50';g.lineWidth=6;g.strokeRect(x-38,y-96,70,93);
    g.fillStyle='rgba(150,205,220,.24)';g.fillRect(x-28,y-84,50,45);
  } else if(k==='roof hatch'||k==='container gap'){
    g.fillStyle='#263039';g.fillRect(x-45,y-84,30,84);g.fillRect(x+22,y-84,30,84);g.strokeStyle='#68747b';g.lineWidth=2;g.strokeRect(x-41,y-76,22,60);g.strokeRect(x+26,y-76,22,60);

  g.fillStyle='rgba(10,9,10,.7)';rr(g,x-55,y-120,110,20,4);g.fill();

    g.fillStyle='#242a2e';rr(g,ex-45,gy-76,78,72,5);g.fill();g.strokeStyle='#89969b';g.lineWidth=4;g.stroke();
    g.lineWidth=2;for(var vr=0;vr<6;vr++){g.beginPath();g.moveTo(ex-34,gy-65+vr*10);g.lineTo(ex+22,gy-65+vr*10);g.stroke();}
  } else {
    var breached=(k==='blastdoor'&&e.open);
    g.fillStyle=breached?'#090a0b':'#4b5357';rr(g,ex-48,gy-122,88,122,5);g.fill();
    g.strokeStyle='#899196';g.lineWidth=6;g.stroke();
    if(k==='blastdoor'&&!e.open){g.fillStyle='#d5a932';g.fillRect(ex-50,gy-70,92,13);g.fillStyle='#17191a';
      for(var hz=0;hz<6;hz++){g.save();g.translate(ex-45+hz*18,gy-64);g.rotate(-.65);g.fillRect(-2,-12,7,25);g.restore();}}
  }
  var feet=P.y+P.h,near=P.x+P.w>ex-45&&P.x<ex+50&&Math.abs(feet-gy)<38;
  var locked=level.objective&&!level.objective.done,miniLocked=!level.miniBossDefeated;
  var label=locked?(level.objective.taskDone?('DEFEAT '+level.miniBossInfo.name):'OBJECTIVE LOCKED'):
    (!e.open?'GRENADE THE DOOR':e.label);
  g.fillStyle='rgba(12,12,14,.82)';rr(g,ex-74,gy-160,148,24,4);g.fill();
  g.fillStyle=locked?'#d45b4a':'#ffe28a';g.font='bold 11px Impact,sans-serif';g.textAlign='center';g.fillText(label,ex,gy-144);g.textAlign='left';
  if(near&&!locked&&!miniLocked&&e.open){
    g.globalAlpha=.55+.45*Math.abs(Math.sin(tick*.11));g.fillStyle='#9be36a';
    g.beginPath();if(isDown){g.moveTo(ex,gy-94);g.lineTo(ex+9,gy-106);g.lineTo(ex-9,gy-106);}else{g.moveTo(ex,gy-112);g.lineTo(ex+9,gy-100);g.lineTo(ex-9,gy-100);}g.closePath();g.fill();g.globalAlpha=1;
  }
}
function playerReachedExit(){
  if(!level.exit||P.dead)return false;
  if(level.objective&&!level.objective.done)return false;
  if(!level.miniBossDefeated)return false;
  var e=level.exit,feet=P.y+P.h,near=P.x+P.w>e.x-40&&P.x<e.x+48&&Math.abs(feet-e.y)<34;
  if(!near||!e.open)return false;
  return (e.kind==='toilet'||e.kind==='containerdrop')?pressed('down'):pressed('up');
}

/* ==================== CHARACTER PAINTING ==================== */
function shadowBlob(x,y,w,a){
  g.fillStyle='rgba(0,0,0,'+(a||0.35)+')';
  ell(g,x,y,w,w*0.28);g.fill();
}
function limb(x1,y1,x2,y2,w,col){
  g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.lineCap='butt';
}
/* A joint you can pick out. Two strokes meeting at an angle read as one bent
   stick; what makes a knee a knee is that it is rounder than the limb, that it
   takes the light on top, and that the skin creases on the inside of the bend.
   Same three things make an elbow, so they share this. */
function joint(x,y,r,col,lit,crease){
  g.fillStyle=col;ell(g,x,y,r,r*0.94);g.fill();ink(g,'rgba(8,6,8,.5)',1.1);
  g.fillStyle=lit;ell(g,x+r*0.16,y-r*0.30,r*0.52,r*0.40);g.fill();
  if(crease){
    g.strokeStyle='rgba(8,6,8,.45)';g.lineWidth=1;
    g.beginPath();g.moveTo(x-r*0.8,y+r*0.72);
    g.quadraticCurveTo(x,y+r*0.34,x+r*0.8,y+r*0.78);g.stroke();
  }
}
/* Rocco's work boots. The foot points +x, so the toe is the right-hand end.
   A brother is about ninety units tall on a screen where a unit is a pixel or
   two, so detail here has to be few and large: a pale welt between the leather
   and the sole is what says "boot" at this size, and it does more than a dozen
   stitches would. Then a capped toe with its own seam, a turned-down collar,
   laces, and a heel that stands proud of the tread. */
function workBoot(dx,far){
  /* Dark leather on purpose. Rocco's shins are bare fur, and a tan boot under a
     tan leg is one brown shape; dropping the leather two steps below the fur is
     what separates them, and the far boot drops two steps again so that a stride
     that crosses reads as one foot behind the other. */
  var bY=-15,w=20,i,ly,gx;
  g.fillStyle=lin(g,0,bY,0,-4,far?[[0,'#2a221c'],[1,'#181310']]:[[0,'#4a3c31'],[1,'#2b221b']]);
  rr(g,dx,bY,w,11.5,3);g.fill();ink(g,'rgba(8,6,8,.8)',1.9);
  g.fillStyle=far?'#372c23':'#5f4c3d';                                     // turned-down collar
  rr(g,dx+0.5,bY-1.8,w-3.5,3.8,1.4);g.fill();ink(g,'rgba(8,6,8,.6)',1.2);
  g.fillStyle='rgba(255,226,180,'+(far?0.05:0.16)+')';                     // toe cap
  g.beginPath();g.moveTo(dx+w-7,bY+2.4);
  g.quadraticCurveTo(dx+w+0.6,bY+3.4,dx+w-0.4,-3.6);
  g.lineTo(dx+w-7.6,-3.6);g.closePath();g.fill();
  g.strokeStyle='rgba(8,6,8,.55)';g.lineWidth=1.2;
  g.beginPath();g.moveTo(dx+w-7.2,bY+2.4);g.lineTo(dx+w-7.7,-3.6);g.stroke();
  g.strokeStyle=far?'rgba(16,10,6,.6)':'rgba(28,18,11,.8)';g.lineWidth=1.1;
  g.beginPath();                                                           // laces
  for(i=0;i<4;i++){ly=bY+2.4+i*2.5;g.moveTo(dx+2.6,ly);g.lineTo(dx+10,ly-1.2);}
  g.stroke();
  g.fillStyle=far?'#6b5842':'#a98d6b';                                     // the welt
  rr(g,dx-0.6,-4.3,w+1.2,1.9,0.8);g.fill();
  g.fillStyle=far?'#1a1512':'#2b241e';rr(g,dx-0.6,-3,w+1.2,3,1.2);g.fill();// tread
  g.fillStyle=far?'#160f0a':'#241c16';rr(g,dx-0.6,-5.4,6.4,5.4,1.4);g.fill();// heel block
  ink(g,'rgba(8,6,8,.6)',1.1);
  g.strokeStyle=far?'rgba(120,100,76,.22)':'rgba(160,134,102,.4)';g.lineWidth=1;
  g.beginPath();                                                           // lugs
  for(i=0;i<3;i++){gx=dx+8.4+i*3;g.moveTo(gx,-2.6);g.lineTo(gx,-0.5);}
  g.stroke();
}
/* Vinnie's high-tops. The white midsole does here what the welt does on the
   boot — it cuts the shoe off the ground and gives the red something to be red
   against. Over it: a rubber toe cap, the stripe down the side, a laced tongue,
   a padded ankle collar and the pull tab at the heel. */
function sneaker(dx,B,far){
  var sY=-11,w=18,i,ly;
  g.fillStyle=far?'#8d2b21':B.boot;
  rr(g,dx,sY,w,7.2,3);g.fill();ink(g,'rgba(8,6,8,.8)',1.7);
  g.fillStyle=far?'#8d2b21':'#d4503f';                                     // padded collar
  rr(g,dx+0.4,sY-2.2,7.4,4,1.8);g.fill();ink(g,'rgba(8,6,8,.6)',1.2);
  g.fillStyle=far?'#bcb9b2':B.bootL;                                       // rubber toe cap
  g.beginPath();g.moveTo(dx+w-5.6,-3.8);g.lineTo(dx+w-5.2,sY+2.6);
  g.quadraticCurveTo(dx+w+0.5,sY+3.4,dx+w+0.3,-3.8);g.closePath();g.fill();
  ink(g,'rgba(8,6,8,.5)',1);
  g.strokeStyle='rgba(255,255,255,'+(far?0.34:0.66)+')';g.lineWidth=1.7;   // side stripe
  g.beginPath();g.moveTo(dx+3,sY+1.4);
  g.quadraticCurveTo(dx+9,sY+6.4,dx+13.4,sY+4.4);g.stroke();
  g.strokeStyle='rgba(250,246,236,'+(far?0.4:0.75)+')';g.lineWidth=1;g.beginPath();
  for(i=0;i<3;i++){ly=sY+1.1+i*2;g.moveTo(dx+7.4,ly);g.lineTo(dx+12,ly-0.7);}
  g.stroke();
  g.fillStyle=far?'#b9b6af':B.bootL;rr(g,dx-0.7,-4.3,w+1.4,4.3,1.8);g.fill();
  ink(g,'rgba(8,6,8,.5)',1.1);
  g.fillStyle='rgba(0,0,0,.26)';g.fillRect(dx-0.7,-1.9,w+1.4,1.1);         // tread line
  g.fillStyle='rgba(0,0,0,.16)';rr(g,dx-0.7,-4.3,5.6,4.3,1.8);g.fill();    // heel wedge
  g.fillStyle=far?'#8d2b21':B.boot;rr(g,dx-1.2,sY-2.6,4,3.6,1.4);g.fill(); // pull tab
  ink(g,'rgba(8,6,8,.5)',1);
}
function drawWeaponArm(B,ang,wep,fireT){
  g.save();g.rotate(ang);
  /* Upper arm, elbow, forearm — bare fur for Rocco, a jacket sleeve for Vinnie.
     The crook is slight and fixed: it is how he holds a gun, and it keeps the
     hand at 17.5 where every weapon below is drawn from. */
  var uw=B.big?13:5.8, ex=B.big?8.2:8, ey=1.5;
  limb(0,-1.4,ex,ey,uw,B.big?B.fur:B.coat);
  joint(ex,ey,uw*0.56,B.big?B.fur:B.coat,B.big?B.furL:B.coatL,true);
  limb(ex,ey,15,0,uw*0.86,B.big?B.furD:B.coatD);
  if(B.big){                                       // a bicep worth drawing, and its scar
    g.fillStyle='rgba(255,255,255,.12)';ell(g,3.5,-2.6,4.4,2.6);g.fill();
    g.strokeStyle='rgba(255,255,255,.16)';g.lineWidth=1;
    g.beginPath();g.moveTo(2,3.4);g.lineTo(6.5,4.6);g.stroke();

  }

  ink(g,'rgba(8,6,8,.55)',1.2);
  g.fillStyle=B.glove;ell(g,17.5,0,5.2,4.8);g.fill();ink(g,'rgba(8,6,8,.65)',1.2);
  g.strokeStyle='rgba(8,6,8,.5)';g.lineWidth=0.9;g.beginPath();             // knuckles
  g.moveTo(19.4,-2.6);g.lineTo(20.2,-0.4);g.moveTo(19.6,0.6);g.lineTo(20.2,2.6);g.stroke();
  g.fillStyle='rgba(255,255,255,.10)';ell(g,16.5,-1.6,2.2,1.4);g.fill();
  /* Each gun is built the way a real one is: a receiver, then the barrel, then
     whatever hangs off it — magazine, stock, drum, scope. It is the parts
     sticking out that tell one from another at this size, not the body, so the

  if(wep==='scratch'){
    /* nothing in his hand — the claws are the weapon */
  } else if(wep==='ak'){
    g.fillStyle=lin(g,16,-6,16,6,[[0,'#5d646f'],[1,'#1b1e24']]);       // receiver
    rr(g,13,-5,20,10,2);g.fill();ink(g,'rgba(0,0,0,.7)',1.6);
    g.fillStyle='#2f343b';rr(g,32,-2.6,17,5.2,1.5);g.fill();           // barrel
    ink(g,'rgba(0,0,0,.6)',1.2);
    g.fillStyle='#3b424a';rr(g,44,-4.4,7,3,1);g.fill();                // gas block
    g.fillStyle='#7b4a28';                                             // curved magazine
    g.beginPath();g.moveTo(20,4);g.lineTo(29,4);g.quadraticCurveTo(31,15,26,17);
    g.quadraticCurveTo(20,17,19,8);g.closePath();g.fill();ink(g,'rgba(0,0,0,.65)',1.4);
    g.fillStyle='#8a5730';rr(g,4,-2,11,7,2);g.fill();ink(g,'rgba(0,0,0,.6)',1.3);  // stock
    g.fillStyle='#6b4326';rr(g,29,2.5,7,6,1.5);g.fill();               // fore grip
    g.fillStyle='rgba(255,255,255,.12)';rr(g,14,-4,18,2,1);g.fill();
  } else if(wep==='minigun'){
    g.fillStyle=lin(g,14,-9,14,9,[[0,'#565e6a'],[1,'#14171c']]);       // housing
    rr(g,11,-8,20,16,4);g.fill();ink(g,'rgba(0,0,0,.72)',1.8);
    var spin=Math.sin(tick*0.9)*2.4;                                   // the cluster turns
    g.fillStyle='#3d444d';
    for(var mb=0;mb<4;mb++){
      var by=-5.2+mb*3.4+spin*(mb%2?1:-1)*0.25;
      rr(g,29,by-1.3,26,2.7,1.2);g.fill();
    }
    ink(g,'rgba(0,0,0,.5)',1);
    g.fillStyle='#20242a';rr(g,53,-6,4,12,1.5);g.fill();               // muzzle plate
    g.fillStyle='#6f7883';ell(g,31,0,3.4,7.5);g.fill();ink(g,'rgba(0,0,0,.6)',1.3);

    g.fillStyle='rgba(255,255,255,.14)';rr(g,12,-7,16,2.4,1.2);g.fill();

    g.fillStyle=lin(g,15,-9,15,9,[[0,'#6b7663'],[1,'#1f2620']]);       // tube
    rr(g,10,-8,52,16,6);g.fill();ink(g,'rgba(0,0,0,.72)',1.8);
    g.fillStyle='#161a18';ell(g,62,0,5,9);g.fill();                    // muzzle bell
    g.fillStyle='#2b332c';
    g.beginPath();g.moveTo(58,-9);g.lineTo(66,-12);g.lineTo(66,12);g.lineTo(58,9);
    g.closePath();g.fill();ink(g,'rgba(0,0,0,.6)',1.4);
    g.fillStyle='#3d4a3d';rr(g,4,-6,8,12,2);g.fill();ink(g,'rgba(0,0,0,.6)',1.3);  // back plate
    g.fillStyle='#8b5a32';rr(g,22,6,9,9,2);g.fill();ink(g,'rgba(0,0,0,.55)',1.2);  // grip
    g.fillStyle='#26302a';rr(g,32,-13,15,5,1.5);g.fill();              // sight rail
    g.strokeStyle='#c9a24a';g.lineWidth=1.4;

    g.fillStyle='rgba(255,255,255,.10)';rr(g,14,-7,40,3,1.5);g.fill();
  } else if(wep==='sniper'){
    g.fillStyle=lin(g,16,-5,16,5,[[0,'#4a5158'],[1,'#15181c']]);       // long receiver
    rr(g,10,-4,26,8,2);g.fill();ink(g,'rgba(0,0,0,.7)',1.5);
    g.fillStyle='#23272c';rr(g,35,-2,26,4,1.4);g.fill();               // long barrel
    ink(g,'rgba(0,0,0,.6)',1.1);
    g.fillStyle='#31363c';rr(g,58,-3.2,6,6.4,1.4);g.fill();            // muzzle brake
    g.fillStyle='#1b1f24';rr(g,20,-12,22,7,2.4);g.fill();              // scope
    ink(g,'rgba(0,0,0,.7)',1.5);
    g.fillStyle='#8fd0ff';ell(g,41,-8.5,1.8,2.6);g.fill();             // lit objective
    g.fillStyle='#2a2f35';rr(g,24,-6,3,3,1);g.fill();rr(g,36,-6,3,3,1);g.fill();
    g.fillStyle=lin(g,0,-4,0,8,[[0,'#6d5233'],[1,'#3a2a18']]);         // cheek-piece stock
    g.beginPath();g.moveTo(11,-4);g.lineTo(11,4);g.lineTo(-2,9);
    g.quadraticCurveTo(-6,3,-2,-3);g.closePath();g.fill();ink(g,'rgba(0,0,0,.6)',1.4);
    g.strokeStyle='#2a2f35';g.lineWidth=1.6;                           // bipod, folded back
    g.beginPath();g.moveTo(44,2);g.lineTo(38,10);g.moveTo(44,2);g.lineTo(48,10);g.stroke();
  } else if(wep==='akimbo'){
    /* Two of them, one behind the other — the far gun sits low and dark so the
       pair reads as depth rather than as one wide gun. */
    var tw;
    for(tw=0;tw<2;tw++){
      var oy=tw?0:5.5,dk=!tw;
      g.fillStyle=dk?'#4c5158':lin(g,16,-5+oy,16,5+oy,[[0,'#c3c8cf'],[1,'#5d636b']]);
      rr(g,13,-4+oy,17,7,2);g.fill();ink(g,'rgba(0,0,0,.65)',1.4);
      g.fillStyle=dk?'#232a30':'#24282d';rr(g,29,-2.4+oy,8,4,1.2);g.fill();
      g.fillStyle=dk?'#4a3524':'#7a5334';                              // grip
      g.beginPath();g.moveTo(15,2+oy);g.lineTo(22,2+oy);g.lineTo(19,12+oy);
      g.lineTo(12,12+oy);g.closePath();g.fill();ink(g,'rgba(0,0,0,.6)',1.3);

    g.fillStyle='#3a4048';ell(g,19,1.5,4.2,4);g.fill();                // cylinder
    ink(g,'rgba(0,0,0,.55)',1.1);
    g.fillStyle=lin(g,10,0,10,12,[[0,'#8a5c38'],[1,'#4a3020']]);       // grip
    g.beginPath();g.moveTo(14,3);g.lineTo(21,3);g.lineTo(18,13);
    g.lineTo(10,13);g.closePath();g.fill();ink(g,'rgba(0,0,0,.6)',1.3);
    g.fillStyle='rgba(255,255,255,.20)';rr(g,15,-4,13,2,1);g.fill();

  if(fireT>0&&wep!=='scratch'){
    var mx=wep==='bazooka'?66:wep==='sniper'?64:wep==='minigun'?57:
           wep==='spread'?47:wep==='ak'?51:wep==='akimbo'?37:38;

}
function ratHead(B,big,aimUp){
  // origin at the neck joint; head faces +x
  // ---- back ear
  g.fillStyle=B.furD;
  g.save();g.translate(-12,-13);g.rotate(-0.30);
  ell(g,0,0,big?8.5:9,big?10:11.5);g.fill();ink(g,'rgba(8,6,8,.7)',1.6);
  g.fillStyle=B.skin;ell(g,0.5,0.5,big?4.6:5,big?6:7);g.fill();

  g.fillStyle=B.fur;
  g.save();g.translate(big?-2:-3,big?-18:-20);g.rotate(big?0.10:0.02);
  if(big){
    // A cat tore away the exposed upper half of Rocco's front ear.
    g.beginPath();g.moveTo(-3,11);g.bezierCurveTo(-11,8,-12,0,-8,-7);
    g.lineTo(-3,-5);g.lineTo(-1,-10);g.lineTo(3,-6);g.lineTo(7,-9);
    g.quadraticCurveTo(12,0,8,7);g.quadraticCurveTo(4,12,-3,11);g.closePath();
    g.fill();ink(g,'rgba(8,6,8,.78)',1.9);
    g.fillStyle=B.skin;
    g.beginPath();g.moveTo(-2,7);g.quadraticCurveTo(-7,4,-5,-2);
    g.lineTo(-2,0);g.lineTo(0,-4);g.lineTo(3,-1);g.lineTo(6,-3);
    g.quadraticCurveTo(8,4,4,7);g.quadraticCurveTo(1,9,-2,7);g.closePath();g.fill();

   front view for standing still, with the side view coming apart at the hip so
   the legs can walk.

   whole — assets, cutting scripts (scripts/cut-rig.py, scripts/cut-legs.py) and
   all — for the rework it still needs: an arm that follows the right stick and a

   sits on the brother's feet, as a fraction of its box; bh is how much of that
   box is body, from the soles to the top of the head, so the tail sweeping off
   to one side does not shrink him. Authored by eye against the collision box. */

  'rocco-back':  {ax:0.50,ay:1.00,bh:0.99},
  'rocco-front': {ax:0.50,ay:1.00,bh:0.99},
  'vinnie-side': {ax:0.63,ay:0.99,bh:0.97},
  'vinnie-back': {ax:0.48,ay:0.98,bh:0.97},
  'vinnie-front':{ax:0.46,ay:0.98,bh:0.96}

    g.fillStyle=B.metal;rr(g,bw-5,hip+0.4,7,9.2,1.4);g.fill();ink(g,'rgba(8,6,8,.7)',1.4);
    g.fillStyle='rgba(0,0,0,.35)';rr(g,bw-3.4,hip+2.4,3.8,5.2,1);g.fill();
  } else {
    /* One gold hoodie, worn loose: the body flares out from the narrow
       shoulders, the hood is bunched behind the neck, and the ribbed hem and
       cuffs are the red that ties him to his sneakers and his cap. */
    g.fillStyle=B.strap;                                          // backpack strap, behind
    g.beginPath();g.moveTo(-sh+2,chest+2);g.lineTo(-sh+7,chest+2);
    g.lineTo(-bw+3,hip+6);g.lineTo(-bw-2,hip+6);g.closePath();g.fill();
    g.fillStyle=lin(g,-sh-2,chest,sh+2,hip+8,[[0,B.coatL],[0.5,B.coat],[1,B.coatD]]);
    g.beginPath();
    g.moveTo(-sh-1,chest+3);
    g.quadraticCurveTo(-sh-4,chest+16,-bw-3,hip+6);
    g.lineTo(bw+3,hip+6);
    g.quadraticCurveTo(sh+4,chest+16,sh+1,chest+3);
    g.quadraticCurveTo(0,chest-3,-sh-1,chest+3);
    g.closePath();g.fill();ink(g,'rgba(8,6,8,.78)',1.8);
    // hood, slumped behind the neck
    g.fillStyle=B.coatD;
    g.beginPath();g.moveTo(-sh+1,chest+3);g.quadraticCurveTo(-sh-6,chest-7,-sh+3,chest-9);
    g.quadraticCurveTo(sh-3,chest-10,sh-2,chest+2);g.closePath();g.fill();
    ink(g,'rgba(8,6,8,.7)',1.6);
    g.fillStyle='rgba(0,0,0,.22)';
    g.beginPath();g.moveTo(-sh+3,chest+2);g.quadraticCurveTo(0,chest-5,sh-3,chest+1);
    g.quadraticCurveTo(0,chest+2,-sh+3,chest+2);g.closePath();g.fill();
    // kangaroo pocket
    g.fillStyle='rgba(0,0,0,.16)';
    rr(g,-bw-1,hip-9,bw*2+2,8.5,2.5);g.fill();
    g.strokeStyle='rgba(8,6,8,.34)';g.lineWidth=1.1;
    g.beginPath();g.moveTo(-bw-1,hip-9);g.lineTo(bw+1,hip-9);g.stroke();
    // drawstrings
    g.strokeStyle='#efe7d4';g.lineWidth=1.3;g.lineCap='round';
    g.beginPath();g.moveTo(2,chest+2);g.lineTo(3.5,chest+11);
    g.moveTo(6,chest+2);g.lineTo(8,chest+10);g.stroke();g.lineCap='butt';
    // ribbed hem
    g.fillStyle=B.trim;rr(g,-bw-3,hip+2,bw*2+6,5.4,1.6);g.fill();
    ink(g,'rgba(8,6,8,.6)',1.3);
    // the print on his chest, two bars is all that survives at this size
    g.fillStyle='rgba(196,44,36,.85)';
    rr(g,-5,chest+9,13,2.6,1);g.fill();rr(g,-3,chest+14,9,2.2,1);g.fill();
  }
  // rim light on the leading edge
  g.strokeStyle='rgba(255,228,182,.26)';g.lineWidth=2;
  g.beginPath();g.moveTo(sh-1,chest+5);g.quadraticCurveTo(sh+2,chest+16,bw-1,hip+6);g.stroke();

  // ================= head =================
  /* Rocco's head is bigger and sits straight on his shoulders with no neck to
     speak of; Vinnie's is smaller and carried further up and forward. */
  g.save();g.translate(big?5:3,neck-(big?8:12));
  if(big)g.scale(1.0,1.0);else g.scale(0.90,0.90);
  ratHead(B,big,aim.y<0);
  g.restore();

  // ================= material detail / readable gear =================
  if(big){
    // old scars across the chest and shoulder — he has been doing this a while
    g.strokeStyle='rgba(255,255,255,.16)';g.lineWidth=1.2;
    g.beginPath();
    g.moveTo(sh-8,chest+9);g.lineTo(sh-13,chest+17);
    g.moveTo(6,chest+16);g.lineTo(11,chest+22);g.stroke();
    g.strokeStyle='rgba(255,220,170,.22)';g.lineWidth=1;
    g.beginPath();g.moveTo(sh-2,chest+13);g.lineTo(sh-4,chest+22);g.stroke();
  } else {
    g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=1.1;   // a fold in the loose cotton
    g.beginPath();g.moveTo(-bw+1,hip-14);g.quadraticCurveTo(0,hip-11,bw-1,hip-15);g.stroke();
  }

  // ================= front arm + weapon =================
  g.save();
  g.translate(big?13:4,chest+(big?13:11));
  drawWeaponArm(B,Math.atan2(aim.y,aim.x*face),wep,fireT);
  g.restore();
  g.restore();
}

// Front-facing portraits are used only on character select. Keeping this separate
// preserves the readable side silhouettes used by gameplay and the title scene.
function drawBrotherPortrait(x,y,broIdx,scale,band,cardW){
  /* The card shows the same front view the game turns to when he stands still,
     so choosing a rat and playing one look like the same rat. */
  /* The painted figure if it is here, the drawn one if it is not. Scale is set
     from the card's own height so both brothers fill the same box whatever
     their pictures happen to measure, and Rocco keeps his edge in width
     because he is the wider of the two. */
  if(selectReady(broIdx)){
    /* Fill the gap between the HP line and the name, leaving a little air top
       and bottom. Rocco is drawn to the full height of it and Vinnie to a bit
       under, because Rocco is the bigger brother and the cards are the one
       place the two of them are seen side by side.

       They also need different width room. Both pictures are cropped tight, so
       matching their heights alone would say nothing about build — but Rocco is
       posed with his arms out and Vinnie is not, so his cap is far wider and
       his picture is allowed to be the broad one. */
    var pic=selectArt[broIdx];
    var bandH=band||126*scale, pad=bandH*0.07;
    var ph=(bandH-pad*2)*(broIdx===0?1:0.86);
    var pw=pic.naturalWidth/pic.naturalHeight*ph;
    var cap=(cardW||96*scale)*(broIdx===0?0.80:0.52);
    if(pw>cap){ph*=cap/pw;pw=cap;}
    g.save();g.translate(x,y);
    /* Light behind him and shadow beneath: the two things that stop a cut-out
       floating in front of whatever it was pasted onto. */
    g.fillStyle=rad(g,0,-ph*0.52,pw*0.10,pw*0.86,
      [[0,'rgba(255,214,150,.16)'],[0.55,'rgba(255,190,120,.05)'],[1,'rgba(0,0,0,0)']]);
    g.beginPath();g.arc(0,-ph*0.52,pw*0.86,0,6.283);g.fill();
    g.fillStyle='rgba(0,0,0,.42)';ell(g,0,-pad,pw*0.40,pw*0.095);g.fill();
    g.fillStyle='rgba(0,0,0,.26)';ell(g,0,-pad,pw*0.56,pw*0.14);g.fill();
    g.drawImage(pic,-pw/2,-ph-pad,pw,ph);
    g.restore();
    return;
  }
  var front=RIG_VIEWS[broIdx].front;
  if(USE_RIG_ART&&rigReady(front)){
    var A=RIG_ANCHOR[front],im=rigArt[front];
    var boxH=(P_STAND*scale*2.35)/A.bh,c=rigScaled(front,boxH),sc=c.height/im.naturalHeight;
    g.save();g.translate(x,y);
    g.drawImage(c,-A.ax*im.naturalWidth*sc,-A.ay*im.naturalHeight*sc,c.width,c.height);
    g.restore();
    return;
  }
  /* Front on, the same two builds: Rocco a wide slab of shoulder over short
     legs, Vinnie narrow and long-legged. Everything he is wearing is the outfit
     off the alley plate, drawn once here and once side-on for the game. */
  var B=BROS[broIdx],big=B.big,bodyW=big?58:34,headW=big?46:40,i,lx,s;
  var shW=big?bodyW*0.62:bodyW*0.42;        // shoulder half-width
  var wsW=big?bodyW*0.42:bodyW*0.32;        // waist half-width
  var top=big?-78:-64, waist=big?-42:-40;   // shoulder line and hem
  /* The head is drawn at one fixed size below, so the difference in stature is
     put in here: scaled about the neck and nudged, Rocco ends up a head shorter
     than his brother even though he is half again as wide. */
  var hs=big?1.04:0.88, hd=big?-4:8;
  g.save();g.translate(x,y);g.scale(scale,scale);
  g.strokeStyle=B.tail;g.lineWidth=big?7:5;g.lineCap='round';
  g.beginPath();g.moveTo(bodyW*.24,-29);g.quadraticCurveTo(bodyW*.9,-22,bodyW*.72,-5);g.stroke();g.lineCap='butt';

  // ---- legs, knees and feet
  for(i=0;i<2;i++){
    lx=(i?1:-1)*(big?bodyW*0.22:bodyW*0.20);
    g.lineCap='round';
    g.strokeStyle=B.pants;g.lineWidth=big?17:11;
    g.beginPath();g.moveTo(lx,waist);g.lineTo(lx*1.06,big?-19:-15);g.stroke();
    g.lineCap='butt';
    joint(lx*1.04,big?-30:-28,big?5.8:3.6,B.pants,big?'#8a7c63':'#5b6a83',true);
    if(big){
      g.fillStyle='#655a48';rr(g,lx-(i?11:-2),-30,9.5,9,1.6);g.fill();    // cargo pocket
      ink(g,'rgba(8,6,8,.45)',1.1);
      g.fillStyle='#7d7159';rr(g,lx+(i?-1.6:-7.6),-19.6,9.2,4.6,1.6);g.fill();
      ink(g,'rgba(8,6,8,.55)',1.2);
      // work boot, seen head on: dark leather, pale welt, capped toe
      g.fillStyle=lin(g,0,-18,0,-4,[[0,'#4a3c31'],[1,'#2b221b']]);
      rr(g,lx-9.5,-18,19,14,3.5);g.fill();ink(g,'rgba(8,6,8,.8)',1.7);
      g.fillStyle='#5f4c3d';rr(g,lx-8.6,-19.6,17.2,3.8,1.4);g.fill();
      ink(g,'rgba(8,6,8,.6)',1.2);
      g.strokeStyle='rgba(24,17,11,.75)';g.lineWidth=1.2;g.beginPath();
      for(s=0;s<3;s++){g.moveTo(lx-5,-16+s*3);g.lineTo(lx+5,-16+s*3);}
      g.stroke();
      g.fillStyle='#a98d6b';rr(g,lx-10.2,-4.6,20.4,2,0.8);g.fill();        // welt
      g.fillStyle='#2b241e';rr(g,lx-10.2,-3.2,20.4,3.2,1.2);g.fill();
    } else {
      g.fillStyle='#6f7f99';rr(g,lx-6,-20,12,5,1.6);g.fill();             // turn-up
      ink(g,'rgba(8,6,8,.55)',1.1);
      g.fillStyle=B.boot;rr(g,lx-8.5,-15,17,11,3.5);g.fill();ink(g,'rgba(8,6,8,.8)',1.6);
      g.fillStyle='#d4503f';rr(g,lx-7.6,-17.4,15.2,4,1.8);g.fill();       // padded collar
      ink(g,'rgba(8,6,8,.6)',1.2);
      g.strokeStyle='rgba(250,246,236,.8)';g.lineWidth=1.1;g.beginPath();
      for(s=0;s<3;s++){g.moveTo(lx-4,-13.4+s*2.6);g.lineTo(lx+4,-13.4+s*2.6);}
      g.stroke();
      g.fillStyle=B.bootL;rr(g,lx-9.2,-4.6,18.4,4.6,1.8);g.fill();        // white midsole
      ink(g,'rgba(8,6,8,.5)',1.1);
      g.fillStyle='rgba(0,0,0,.24)';g.fillRect(lx-9.2,-2.2,18.4,1);
    }
  }

  // ---- torso
  if(big){
    g.fillStyle=lin(g,-shW,top,shW,waist,[[0,B.chest],[1,B.chestD]]);     // bare chest
    g.beginPath();
    g.moveTo(-shW,top+6);g.quadraticCurveTo(-shW-2,top+26,-wsW,waist+4);
    g.lineTo(wsW,waist+4);g.quadraticCurveTo(shW+2,top+26,shW,top+6);
    g.quadraticCurveTo(0,top-2,-shW,top+6);g.closePath();g.fill();
    ink(g,'rgba(8,6,8,.78)',2);
    g.strokeStyle='rgba(8,6,8,.28)';g.lineWidth=1.6;                      // sternum
    g.beginPath();g.moveTo(0,top+8);g.lineTo(0,waist+2);g.stroke();
    g.fillStyle='rgba(255,255,255,.10)';
    ell(g,-shW*0.42,top+15,shW*0.30,8);g.fill();
    ell(g,shW*0.42,top+15,shW*0.30,8);g.fill();
    // the vest, open in a V down the front
    for(s=-1;s<=1;s+=2){
      g.fillStyle=lin(g,0,top,0,waist,s<0?[[0,B.coat],[1,B.coatD]]:[[0,B.coatL],[1,B.coat]]);
      g.beginPath();
      g.moveTo(s*shW,top+5);
      g.quadraticCurveTo(s*(shW+2),top+26,s*wsW,waist+5);
      g.lineTo(s*wsW*0.34,waist+5);g.lineTo(s*shW*0.30,top+7);
      g.closePath();g.fill();ink(g,'rgba(8,6,8,.78)',1.9);
    }
    g.fillStyle=B.fleece;                                                 // shearling collar
    g.beginPath();
    g.moveTo(-shW-1,top+7);g.quadraticCurveTo(0,top-6,shW+1,top+7);
    g.quadraticCurveTo(shW*0.5,top+3,shW*0.28,top+13);
    g.lineTo(-shW*0.28,top+13);g.quadraticCurveTo(-shW*0.5,top+3,-shW-1,top+7);
    g.closePath();g.fill();ink(g,'rgba(8,6,8,.66)',1.6);
    // bandolier over one shoulder
    g.save();
    g.beginPath();g.moveTo(-shW,top+5);g.lineTo(shW,top+5);
    g.lineTo(wsW,waist+5);g.lineTo(-wsW,waist+5);g.closePath();g.clip();
    g.strokeStyle='#4b3a22';g.lineWidth=8;
    g.beginPath();g.moveTo(shW-4,top+6);g.lineTo(-wsW+1,waist+7);g.stroke();
    for(i=0;i<5;i++){
      var t=i/4,bx=(shW-4)+(-wsW+1-(shW-4))*t,by=(top+6)+(waist+1-top)*t;
      g.save();g.translate(bx,by);g.rotate(-1.15);
      g.fillStyle=B.trim;rr(g,-2.6,-4.4,5.2,6.4,1.2);g.fill();
      g.fillStyle='#8f3a2a';rr(g,-2.6,1.6,5.2,3,1);g.fill();
      g.restore();
    }
    g.restore();
    // shell belt and buckle
    g.fillStyle='#5c4728';rr(g,-wsW-3,waist+2,wsW*2+6,9,2);g.fill();ink(g,'rgba(8,6,8,.75)',1.5);
    for(s=-2;s<=2;s++){g.fillStyle=B.trim;rr(g,s*9-2.4,waist+2.8,4.8,7.4,1.4);g.fill();}
    g.fillStyle=B.metal;rr(g,-4,waist+1.4,8,10.2,1.5);g.fill();ink(g,'rgba(8,6,8,.7)',1.4);
    g.fillStyle='rgba(0,0,0,.35)';rr(g,-2,waist+3.6,4,5.8,1);g.fill();
  } else {
    g.fillStyle=B.strap;                                                  // backpack straps
    rr(g,-shW*0.72,top+4,7,30,2);g.fill();rr(g,shW*0.72-7,top+4,7,30,2);g.fill();
    g.fillStyle=lin(g,-shW,top,shW,waist+6,[[0,B.coatL],[0.5,B.coat],[1,B.coatD]]);
    g.beginPath();
    g.moveTo(-shW,top+6);g.quadraticCurveTo(-shW-4,top+22,-wsW-2,waist+4);
    g.lineTo(wsW+2,waist+4);g.quadraticCurveTo(shW+4,top+22,shW,top+6);
    g.quadraticCurveTo(0,top-1,-shW,top+6);g.closePath();g.fill();
    ink(g,'rgba(8,6,8,.78)',1.9);
    g.fillStyle=B.coatD;                                                  // hood behind the neck
    g.beginPath();g.moveTo(-shW*0.66,top+7);g.quadraticCurveTo(0,top-11,shW*0.66,top+7);
    g.quadraticCurveTo(0,top+2,-shW*0.66,top+7);g.closePath();g.fill();
    ink(g,'rgba(8,6,8,.68)',1.5);
    g.strokeStyle='#efe7d4';g.lineWidth=1.5;g.lineCap='round';            // drawstrings
    g.beginPath();g.moveTo(-4,top+8);g.lineTo(-5.5,top+22);
    g.moveTo(4,top+8);g.lineTo(5.5,top+21);g.stroke();g.lineCap='butt';
    g.fillStyle='rgba(0,0,0,.15)';                                        // kangaroo pocket
    rr(g,-wsW+1,waist-15,wsW*2-2,13,3);g.fill();
    g.strokeStyle='rgba(8,6,8,.3)';g.lineWidth=1.2;
    g.beginPath();g.moveTo(-wsW+1,waist-15);g.lineTo(wsW-1,waist-15);g.stroke();
    g.fillStyle='#c42c24';                                                // the print
    rr(g,-11,top+19,22,4,1.4);g.fill();rr(g,-7,top+27,14,3.4,1.2);g.fill();
    g.fillStyle=B.trim;rr(g,-wsW-2,waist+3,wsW*2+4,6,2);g.fill();         // ribbed hem
    ink(g,'rgba(8,6,8,.6)',1.3);
  }

  /* Arms, with an elbow each and the right cuff at the wrist. The joints are
     placed off the shoulder line rather than off the hem, because the hem is
     where the two builds differ most — Vinnie's hoodie stops high on a long
     body, and hanging his elbow from it put his forearm on upside down. */
  var elX=big?4:6, wrX=big?6:8;
  var shY=top+(big?13:10), elY=top+(big?26:21), wrY=big?-37:-28;
  for(i=0;i<2;i++){
    s=i?1:-1;
    g.lineCap='round';
    g.strokeStyle=big?B.fur:B.coat;g.lineWidth=big?16:8.5;
    g.beginPath();g.moveTo(s*shW*0.86,shY);g.lineTo(s*(shW+elX),elY);g.stroke();
    g.lineCap='butt';
    joint(s*(shW+elX),elY,big?6.8:4,big?B.fur:B.coat,big?B.furL:B.coatL,false);
    g.lineCap='round';
    g.strokeStyle=big?B.furD:B.coatD;g.lineWidth=big?13.5:7;
    g.beginPath();g.moveTo(s*(shW+elX),elY);g.lineTo(s*(shW+wrX),wrY);g.stroke();
    g.lineCap='butt';
    if(!big){g.fillStyle=B.trim;rr(g,s*(shW+wrX)-4,wrY-1,8,4.6,1.6);g.fill();ink(g,'rgba(8,6,8,.55)',1.1);}
    g.fillStyle=B.glove;ell(g,s*(shW+wrX),wrY+5,big?7.4:5,big?8.4:5.8);g.fill();
    ink(g,'rgba(8,6,8,.6)',1.3);
  }
  g.save();g.translate(0,hd);g.translate(0,-70);g.scale(hs,hs);g.translate(0,70);
  g.fillStyle=B.fur;ell(g,-headW*.38,-97,big?13:14,big?16:18);g.fill();ink(g,'rgba(8,6,8,.75)',1.8);
  ell(g,headW*.38,-97,big?13:14,big?16:18);g.fill();ink(g,'rgba(8,6,8,.75)',1.8);
  g.fillStyle=B.skin;ell(g,-headW*.38,-97,big?7:8,big?10:12);g.fill();ell(g,headW*.38,-97,big?7:8,big?10:12);g.fill();
  g.fillStyle=lin(g,-headW*.5,-111,headW*.5,-72,[[0,B.furL],[.58,B.fur],[1,B.furD]]);
  ell(g,0,-91,headW*.52,big?25:24);g.fill();ink(g,'rgba(8,6,8,.82)',2);
  g.fillStyle=B.furL;ell(g,-11,-82,13,11);g.fill();ell(g,11,-82,13,11);g.fill();
  g.fillStyle=B.eye;ell(g,-9,-96,6,6.5);g.fill();ell(g,9,-96,6,6.5);g.fill();
  g.fillStyle='#171310';ell(g,-8,-95,big?2.2:2,3);g.fill();ell(g,8,-95,big?2.2:2,3);g.fill();
  g.strokeStyle='rgba(12,9,8,.9)';g.lineWidth=2.3;g.beginPath();
  if(big){g.moveTo(-16,-104);g.lineTo(-4,-100);g.moveTo(16,-104);g.lineTo(4,-100);}
  else{g.moveTo(-16,-102);g.lineTo(-4,-104);g.moveTo(16,-102);g.lineTo(4,-104);}g.stroke();
  g.fillStyle=B.skin;ell(g,0,-84,6,4.5);g.fill();ink(g,'rgba(8,6,8,.55)',1.1);
  g.strokeStyle='rgba(25,15,16,.75)';g.lineWidth=1.4;g.beginPath();g.moveTo(0,-80);g.lineTo(0,-76);g.stroke();
  g.fillStyle='#f6f2e4';rr(g,-5,-77,4.5,9,1);g.fill();rr(g,.5,-77,4.5,9,1);g.fill();
  if(big){
    g.strokeStyle='rgba(150,70,65,.9)';g.lineWidth=2;g.beginPath();g.moveTo(4,-107);g.lineTo(11,-86);g.stroke();
  }else{
    // the red cap, brim out toward you
    g.fillStyle=lin(g,-19,-118,19,-99,[[0,B.capL],[1,B.cap]]);
    g.beginPath();g.arc(0,-105,19,Math.PI,Math.PI*2);g.lineTo(17,-100);g.lineTo(-17,-100);
    g.closePath();g.fill();ink(g,'rgba(8,6,8,.75)',1.6);
    g.strokeStyle='rgba(8,6,8,.28)';g.lineWidth=1.2;
    g.beginPath();g.moveTo(0,-124);g.lineTo(0,-100);g.stroke();
    g.fillStyle=B.capD;
    g.beginPath();g.moveTo(-18,-101);g.quadraticCurveTo(0,-92,18,-101);
    g.quadraticCurveTo(0,-97,-18,-101);g.closePath();g.fill();ink(g,'rgba(8,6,8,.7)',1.5);
    g.fillStyle=B.capL;ell(g,0,-123,2.4,2);g.fill();
  }
  g.strokeStyle='rgba(255,255,255,.34)';g.lineWidth=1;g.beginPath();
  g.moveTo(-12,-82);g.lineTo(-31,-86);g.moveTo(-12,-79);g.lineTo(-32,-76);
  g.moveTo(12,-82);g.lineTo(31,-86);g.moveTo(12,-79);g.lineTo(32,-76);g.stroke();
  g.restore();
  g.restore();
}
/* ==================== THE CATMAN'S PEOPLE ====================
   One cat, built to order. Every one of them is the same animal — pointed ears,
   short muzzle, heavy tail, eyes that catch the light — at a different size,
   dressed for a different job, holding a different thing. That last part is
   what actually reads in a fight: at this scale you have about a second to tell
   a rocket from a pistol, and the silhouette of what it is carrying is the only
   cue fast enough. Build and dress are what tell them apart when they are
   standing still.

   Local space is the same as everything else that draws a body here: the feet
   sit on y=0, up is negative, and the caller has already turned it to face the
   right way. Proportions are fractions of H so a doorman and an alley cat are
   the same drawing at different heights rather than two drawings. */
function catFigure(e,k){
  var H=k.H,W=k.W,i;
  var sw=Math.sin(e.anim),bob=e.onGround?Math.abs(Math.cos(e.anim))*H*0.012:0;
  var stride=(e.onGround&&Math.abs(e.vx)>0.15)?sw*H*0.10:0;
  var hipY=-H*0.46+bob, chestY=-H*0.70+bob, headY=-H*0.865+bob;
  var hr=H*0.155;                                  // head radius
  var fur=k.fur,furD=k.furD,furL=k.furL;

  // ---- tail: heavy at the root, curling away behind
  g.strokeStyle=furD;g.lineWidth=H*0.055;g.lineCap='round';
  g.beginPath();g.moveTo(-W*0.80,hipY+H*0.06);
  g.quadraticCurveTo(-W*2.4,hipY-H*0.06+sw*H*0.05,-W*2.7,hipY+H*0.28+sw*H*0.03);
  g.stroke();
  g.strokeStyle=fur;g.lineWidth=H*0.030;g.stroke();
  g.lineCap='butt';

  // ---- legs, the far one a shade back
  for(i=0;i<2;i++){
    /* Set wide enough apart to read as two. At this size a stance narrower
       than the leg is thick just makes one dark column with a foot on it. */
    var far=i===0,lx=far?-W*0.58:W*0.52,off=far?-stride:stride;
    g.strokeStyle=far?k.pantD:k.pant;g.lineWidth=H*(k.heavy?0.098:0.072);
    g.lineCap='round';
    g.beginPath();g.moveTo(lx,hipY);g.lineTo(lx+off*0.5,hipY+H*0.26);
    g.lineTo(lx+off,hipY+H*0.44);g.stroke();g.lineCap='butt';
    g.fillStyle=far?'#15181c':'#22262c';
    rr(g,lx+off-W*0.40,-H*0.052,W*0.92,H*0.052,H*0.016);g.fill();
    ink(g,'rgba(6,6,8,.7)',1.3);
  }

  // ---- far arm, hanging
  g.strokeStyle=k.sleeveD||furD;g.lineWidth=H*(k.heavy?0.075:0.055);g.lineCap='round';
  g.beginPath();g.moveTo(-W*0.55,chestY+H*0.05);
  g.lineTo(-W*0.75-stride*0.4,chestY+H*0.28);g.stroke();g.lineCap='butt';

  // ---- torso
  g.fillStyle=lin(g,-W,chestY,W,hipY+H*0.05,[[0,k.coatL],[1,k.coatD]]);
  g.beginPath();
  g.moveTo(-W,chestY+H*0.02);
  g.quadraticCurveTo(-W*1.12,chestY+H*0.16,-W*0.72,hipY+H*0.04);
  g.lineTo(W*0.72,hipY+H*0.04);
  g.quadraticCurveTo(W*1.12,chestY+H*0.16,W,chestY+H*0.02);
  g.quadraticCurveTo(0,chestY-H*0.05,-W,chestY+H*0.02);
  g.closePath();g.fill();ink(g,'rgba(6,6,8,.78)',1.9);
  if(k.stripe){                                    // pinstripes, for the suits
    g.strokeStyle='rgba(230,235,245,.16)';g.lineWidth=1;
    g.beginPath();
    for(i=-2;i<=2;i++){g.moveTo(i*W*0.32,chestY+H*0.03);g.lineTo(i*W*0.32,hipY+H*0.02);}
    g.stroke();
  }
  if(k.shirt){                                     // collar and tie
    g.fillStyle=k.shirt;
    g.beginPath();g.moveTo(-W*0.22,chestY);g.lineTo(W*0.22,chestY);
    g.lineTo(0,chestY+H*0.16);g.closePath();g.fill();
    g.fillStyle=k.tie||'#8a2f2a';
    g.beginPath();g.moveTo(-W*0.07,chestY+H*0.05);g.lineTo(W*0.07,chestY+H*0.05);
    g.lineTo(W*0.05,hipY-H*0.02);g.lineTo(-W*0.05,hipY-H*0.02);g.closePath();g.fill();
  }
  if(k.plate){                                     // strapped-on armour
    g.fillStyle='#4b535d';rr(g,-W*0.82,chestY+H*0.05,W*1.64,H*0.17,H*0.02);g.fill();
    ink(g,'rgba(6,6,8,.75)',1.6);
    g.fillStyle='rgba(255,255,255,.10)';rr(g,-W*0.74,chestY+H*0.07,W*1.48,H*0.035,H*0.012);g.fill();
    g.fillStyle='#c9a24a';
    for(i=-1;i<=1;i++){ell(g,i*W*0.5,chestY+H*0.20,W*0.06,W*0.06);g.fill();}
  }
  if(k.belt){
    g.fillStyle='#3a2c1c';rr(g,-W*0.78,hipY-H*0.05,W*1.56,H*0.05,H*0.012);g.fill();
    g.fillStyle=k.beltStud||'#c9a24a';
    for(i=-1;i<=2;i++){rr(g,i*W*0.36-W*0.05,hipY-H*0.045,W*0.10,H*0.04,1);g.fill();}
  }

  // ---- head: the shape that says cat before anything else does
  g.save();g.translate(W*0.10,headY);
  // ears, set wide and pricked
  g.fillStyle=furD;
  g.beginPath();g.moveTo(-hr*0.92,-hr*0.30);g.lineTo(-hr*1.20,-hr*1.42);
  g.lineTo(-hr*0.16,-hr*0.86);g.closePath();g.fill();ink(g,'rgba(6,6,8,.72)',1.4);
  g.fillStyle=fur;
  g.beginPath();g.moveTo(hr*0.30,-hr*0.92);g.lineTo(hr*0.62,-hr*1.66);
  g.lineTo(hr*1.02,-hr*0.52);g.closePath();g.fill();ink(g,'rgba(6,6,8,.72)',1.4);
  g.fillStyle=k.inner||'#c98a86';
  g.beginPath();g.moveTo(hr*0.44,-hr*0.86);g.lineTo(hr*0.62,-hr*1.34);
  g.lineTo(hr*0.84,-hr*0.66);g.closePath();g.fill();
  // skull, wide at the cheeks and short in the muzzle
  g.fillStyle=lin(g,-hr,-hr,hr,hr,[[0,furL],[0.6,fur],[1,furD]]);
  g.beginPath();
  g.moveTo(-hr*0.95,-hr*0.10);
  g.quadraticCurveTo(-hr*0.90,-hr*1.00,0,-hr*0.98);
  g.quadraticCurveTo(hr*0.92,-hr*0.95,hr*1.02,-hr*0.10);
  g.quadraticCurveTo(hr*1.10,hr*0.70,hr*0.30,hr*0.86);
  g.quadraticCurveTo(-hr*0.70,hr*0.94,-hr*0.95,-hr*0.10);
  g.closePath();g.fill();ink(g,'rgba(6,6,8,.8)',1.9);
  // cheek ruffs
  g.fillStyle=furL;
  g.beginPath();g.moveTo(hr*0.10,hr*0.30);g.quadraticCurveTo(hr*1.16,hr*0.34,hr*0.72,hr*0.86);
  g.quadraticCurveTo(hr*0.10,hr*0.90,hr*0.10,hr*0.30);g.closePath();g.fill();
  // eyes: slit pupils, and the reason you can see it in the dark
  g.fillStyle=k.eye||'#8fe36a';
  ell(g,hr*0.62,-hr*0.16,hr*0.27,hr*0.23);g.fill();
  ell(g,-hr*0.16,-hr*0.18,hr*0.24,hr*0.21);g.fill();
  g.fillStyle='#0d1208';
  ell(g,hr*0.66,-hr*0.16,hr*0.075,hr*0.20);g.fill();
  ell(g,-hr*0.13,-hr*0.18,hr*0.070,hr*0.18);g.fill();
  g.strokeStyle='rgba(8,8,10,.75)';g.lineWidth=hr*0.09;g.lineCap='round';
  g.beginPath();
  g.moveTo(hr*0.30,-hr*0.50);g.lineTo(hr*0.92,-hr*0.38);
  g.moveTo(-hr*0.46,-hr*0.44);g.lineTo(hr*0.06,-hr*0.52);g.stroke();g.lineCap='butt';
  // muzzle and nose
  g.fillStyle=furL;
  ell(g,hr*0.52,hr*0.46,hr*0.44,hr*0.28);g.fill();
  g.fillStyle=k.nose||'#3a2a26';
  g.beginPath();g.moveTo(hr*0.70,hr*0.26);g.lineTo(hr*1.00,hr*0.30);
  g.lineTo(hr*0.85,hr*0.48);g.closePath();g.fill();
  g.strokeStyle='rgba(255,255,255,.34)';g.lineWidth=1;
  g.beginPath();
  g.moveTo(hr*0.80,hr*0.44);g.lineTo(hr*1.85,hr*0.20);
  g.moveTo(hr*0.80,hr*0.56);g.lineTo(hr*1.85,hr*0.66);g.stroke();
  if(k.fangs){
    g.fillStyle='#f2ede0';
    g.beginPath();g.moveTo(hr*0.42,hr*0.58);g.lineTo(hr*0.58,hr*0.58);
    g.lineTo(hr*0.50,hr*0.92);g.closePath();g.fill();
  }
  if(k.hat==='fedora'){
    g.fillStyle=k.hatCol||'#2a2f38';
    g.beginPath();g.ellipse(hr*0.10,-hr*0.90,hr*1.45,hr*0.24,0,0,6.283);g.fill();
    ink(g,'rgba(6,6,8,.75)',1.5);
    g.beginPath();g.moveTo(-hr*0.62,-hr*0.92);g.quadraticCurveTo(-hr*0.44,-hr*1.86,hr*0.30,-hr*1.80);
    g.quadraticCurveTo(hr*0.90,-hr*1.70,hr*0.82,-hr*0.92);g.closePath();g.fill();
    ink(g,'rgba(6,6,8,.75)',1.5);
    g.fillStyle='rgba(0,0,0,.42)';rr(g,-hr*0.60,-hr*1.16,hr*1.44,hr*0.22,2);g.fill();
  } else if(k.hat==='flatcap'){
    g.fillStyle=k.hatCol||'#3a3f34';
    g.beginPath();g.moveTo(-hr*0.86,-hr*0.86);g.quadraticCurveTo(0,-hr*1.66,hr*0.86,-hr*0.90);
    g.lineTo(hr*1.42,-hr*0.78);g.lineTo(-hr*0.80,-hr*0.72);g.closePath();g.fill();
    ink(g,'rgba(6,6,8,.72)',1.5);
  } else if(k.hat==='helmet'){
    g.fillStyle=k.hatCol||'#4a525c';
    g.beginPath();g.arc(hr*0.06,-hr*0.42,hr*1.06,Math.PI*1.02,Math.PI*2.02);
    g.lineTo(hr*1.20,-hr*0.30);g.lineTo(-hr*1.04,-hr*0.34);g.closePath();g.fill();
    ink(g,'rgba(6,6,8,.8)',1.8);
    g.fillStyle='rgba(255,255,255,.12)';rr(g,-hr*0.70,-hr*1.20,hr*1.40,hr*0.20,2);g.fill();
    g.fillStyle='#d84a3a';                                  // targeting eye
    ell(g,hr*0.88,-hr*0.20,hr*0.16,hr*0.12);g.fill();
    addLight&&0;
  }
  g.restore();

  // ---- near arm, and the thing it is holding
  g.save();
  g.translate(W*0.72,chestY+H*0.12);
  g.rotate(k.aim||0);
  var aw=H*(k.heavy?0.082:0.058);
  /* Outlined, because the sleeve is usually the same family of colour as the
     coat behind it and without a line the arm disappears into the body. */
  g.strokeStyle='rgba(6,6,8,.62)';g.lineWidth=aw+2.2;g.lineCap='round';
  g.beginPath();g.moveTo(-W*0.10,0);g.lineTo(H*0.20,H*0.02);g.stroke();
  g.strokeStyle=k.sleeve||fur;g.lineWidth=aw;
  g.beginPath();g.moveTo(-W*0.10,0);g.lineTo(H*0.20,H*0.02);g.stroke();g.lineCap='butt';
  g.fillStyle=k.glove||furD;ell(g,H*0.225,H*0.02,aw*0.56,aw*0.52);g.fill();
  ink(g,'rgba(6,6,8,.65)',1.3);
  catWeapon(e,k,H);
  g.restore();
}
/* What each of them brought to work. Drawn from the paw outward, so a role can
   be given a different weapon without touching the body it hangs off. */
function catWeapon(e,k,H){
  var wx=H*0.26,wy=H*0.02;
  if(k.arm==='claws'){
    g.strokeStyle='#e8e2d2';g.lineWidth=Math.max(1.4,H*0.016);g.lineCap='round';
    g.beginPath();
    g.moveTo(wx,wy-H*0.03);g.lineTo(wx+H*0.10,wy-H*0.07);
    g.moveTo(wx,wy);g.lineTo(wx+H*0.12,wy-H*0.01);
    g.moveTo(wx,wy+H*0.03);g.lineTo(wx+H*0.10,wy+H*0.05);
    g.stroke();g.lineCap='butt';
  } else if(k.arm==='pistol'){
    g.fillStyle='#c3c8cf';rr(g,wx,wy-H*0.022,H*0.13,H*0.040,H*0.010);g.fill();
    ink(g,'rgba(6,6,8,.7)',1.3);
    g.fillStyle='#24282d';rr(g,wx+H*0.12,wy-H*0.012,H*0.05,H*0.022,1);g.fill();
    g.fillStyle='#6b4a31';
    g.beginPath();g.moveTo(wx+H*0.01,wy+H*0.016);g.lineTo(wx+H*0.06,wy+H*0.016);
    g.lineTo(wx+H*0.045,wy+H*0.075);g.lineTo(wx-H*0.005,wy+H*0.075);g.closePath();g.fill();
  } else if(k.arm==='shotgun'){
    g.fillStyle='#6a707a';rr(g,wx-H*0.04,wy-H*0.028,H*0.26,H*0.026,H*0.008);g.fill();
    ink(g,'rgba(6,6,8,.7)',1.3);
    g.fillStyle='#8a512d';rr(g,wx-H*0.10,wy-H*0.010,H*0.10,H*0.045,H*0.010);g.fill();
    ink(g,'rgba(6,6,8,.6)',1.2);
    g.fillStyle='#12151a';rr(g,wx+H*0.20,wy-H*0.026,H*0.02,H*0.024,1);g.fill();
  } else if(k.arm==='bottle'){
    g.fillStyle='rgba(120,200,150,.85)';
    g.beginPath();g.moveTo(wx,wy-H*0.030);g.lineTo(wx+H*0.075,wy-H*0.030);
    g.lineTo(wx+H*0.075,wy+H*0.030);g.lineTo(wx,wy+H*0.030);g.closePath();g.fill();
    g.fillStyle='rgba(150,220,180,.8)';rr(g,wx+H*0.073,wy-H*0.014,H*0.05,H*0.028,2);g.fill();
    ink(g,'rgba(6,6,8,.5)',1.1);
    g.fillStyle='#d8b06a';rr(g,wx+H*0.118,wy-H*0.020,H*0.022,H*0.040,1);g.fill();
    if(e.timer<26){                                   // lit, and about to leave
      g.fillStyle='rgba(255,170,60,.9)';
      ell(g,wx+H*0.14,wy-H*0.03,H*0.022,H*0.030);g.fill();
    }
  } else if(k.arm==='bazooka'){
    var hot=e.rocketeer&&e.engaged&&e.timer<48&&e.shots>0;
    g.fillStyle=lin(g,wx,wy-H*0.06,wx,wy+H*0.06,[[0,'#6b7663'],[1,'#1f2620']]);
    rr(g,wx-H*0.12,wy-H*0.052,H*0.42,H*0.104,H*0.030);g.fill();
    ink(g,'rgba(6,6,8,.8)',1.8);
    g.fillStyle='#161a18';ell(g,wx+H*0.30,wy,H*0.030,H*0.058);g.fill();
    g.fillStyle='#2b332c';rr(g,wx+H*0.02,wy-H*0.095,H*0.10,H*0.034,2);g.fill();
    g.fillStyle='#8b5a32';rr(g,wx-H*0.02,wy+H*0.040,H*0.06,H*0.058,2);g.fill();
    if(hot){
      /* The tube lights before it fires. Without this the rocket is a coin
         toss; with it, it is a thing you saw coming and did not move. */
      var pulse=0.45+0.55*Math.abs(Math.sin(tick*0.35));
      g.fillStyle='rgba(255,150,60,'+(0.30+0.45*pulse)+')';
      ell(g,wx+H*0.30,wy,H*0.048,H*0.080);g.fill();
      g.strokeStyle='rgba(255,120,50,'+(0.35+0.4*pulse)+')';g.lineWidth=2;
      rr(g,wx-H*0.12,wy-H*0.052,H*0.42,H*0.104,H*0.030);g.stroke();
    }
  } else if(k.arm==='fists'){
    g.fillStyle='#68717b';rr(g,wx-H*0.01,wy-H*0.035,H*0.10,H*0.070,H*0.018);g.fill();
    ink(g,'rgba(6,6,8,.7)',1.4);
    g.fillStyle='#c9a24a';
    for(var q=0;q<3;q++){ell(g,wx+H*0.02+q*H*0.026,wy-H*0.024,H*0.011,H*0.011);g.fill();}
  }
}
/* ---- the roles ----
   Each of these is a size, a wardrobe and a weapon. Nothing else differs. */
function catRole(e){
  var lo={fur:'#8b8f98',furD:'#4e535b',furL:'#b3b8c0',eye:'#8fe36a'};
  if(e.t==='thug')return {H:46,W:9,fur:'#6f6a62',furD:'#3d3a35',furL:'#948d82',
    eye:'#c8e36a',coatL:'#4a4038',coatD:'#241f1b',pant:'#33302a',pantD:'#211f1b',
    arm:'claws',fangs:true,heavy:false,inner:'#b07a76'};
  if(e.t==='gunner')return {H:52,W:10,fur:lo.fur,furD:lo.furD,furL:lo.furL,eye:'#e3c56a',
    coatL:'#3d4250',coatD:'#1c1f27',pant:'#2b2f3a',pantD:'#1a1d24',stripe:true,
    shirt:'#d8d2c0',tie:'#8a2f2a',hat:'fedora',hatCol:'#22262e',
    sleeve:'#343947',sleeveD:'#22262e',glove:'#1f2228',arm:'pistol'};
  if(e.t==='enforcer')return {H:56,W:12,fur:'#7d7468',furD:'#453f38',furL:'#a49a8c',
    eye:'#6ad8e3',coatL:'#41493c',coatD:'#1f241c',pant:'#2c322a',pantD:'#1b1f19',
    hat:'flatcap',hatCol:'#333a30',belt:true,fangs:true,
    sleeve:'#3a4236',sleeveD:'#242a20',glove:'#1c211a',arm:'shotgun'};
  if(e.t==='brute')return {H:72,W:17,fur:'#c98a3a',furD:'#7a4d18',furL:'#e8b566',
    eye:'#8fe36a',coatL:'#4c545f',coatD:'#20242b',pant:'#22262c',pantD:'#15181c',
    heavy:true,belt:true,fangs:true,plate:false,
    sleeve:'#c98a3a',sleeveD:'#7a4d18',glove:'#5c3c14',arm:'fists'};
  if(e.t==='prowler')return {H:44,W:8,fur:'#5a4f6b',furD:'#332c40',furL:'#7d7091',
    eye:'#ffd76a',coatL:'#2f2a3c',coatD:'#191626',pant:'#241f30',pantD:'#161320',
    arm:'bottle',fangs:true,inner:'#9a7aa8'};
  return {H:62,W:15,fur:'#6e6a66',furD:'#3c3a38',furL:'#928d88',eye:'#ff7a5a',
    coatL:'#40474f',coatD:'#1c2026',pant:'#262a2f',pantD:'#171a1e',
    heavy:true,plate:true,hat:'helmet',hatCol:'#49515b',
    sleeve:'#3c434b',sleeveD:'#252a30',glove:'#1a1d21',arm:'bazooka'};
}
/* Every one of them is drawn through here. The size knob, the mini-boss bump
   and the squash on landing all apply the same way they always did. */
function drawCatFoe(e){
  var x=e.x+e.w/2,y=e.y+e.h,sq=e.squash/10;
  var k=catRole(e);
  var elite=(e.miniBoss?1.28:1)*charScale;
  /* The figure is authored at k.H units tall and the box it lives in is e.bh,
     so this is the one number that keeps the drawing on its own feet whatever
     the size knob is doing. */
  var fit=(e.bh||e.h)/(k.H*0.86);
  g.save();
  g.translate(x,y);
  g.scale(e.facing*fit*elite*(1+sq*0.28),fit*elite*(1-sq*0.40));
  if(e.flash>0)g.globalAlpha=0.75;
  catFigure(e,k);
  g.restore();
}
/* ==================== THE CATMAN ====================
   Not a machine. A very large cat in a very good suit, who has not had to get
   up from a chair in years and is getting up now. He is built out of the same
   parts as everyone else on his payroll — pointed ears, short muzzle, heavy
   tail — at three times the size and with the tailoring to match.

   His health is on the bar at the top of the screen, so nothing here has to
   double as a readout; what the drawing does instead is show the fight wearing
   him down. The cigar goes out, the suit opens, the calm goes out of his face. */
function drawBoss(){
  if(!boss)return;
  var x=boss.x+boss.w/2,y=boss.y+boss.h;
  var frac=clamp(boss.hp/boss.maxHp,0,1),hurt=1-frac;
  var gl=0.55+Math.sin(boss.anim*3)*0.45;
  var brk=boss.state==='dead'?1:hurt;              // how far gone he is
  var sw=Math.sin(boss.anim*1.1),bob=Math.abs(Math.cos(boss.anim*1.1))*2.2;
  g.save();g.translate(x,y);g.scale(boss.facing,1);
  if(boss.flash>0)g.globalAlpha=0.8;

  // ---- tail, thick as an arm, sweeping behind him
  g.strokeStyle='#5c3a12';g.lineWidth=17;g.lineCap='round';
  g.beginPath();g.moveTo(-34,-44);
  g.quadraticCurveTo(-118,-70+sw*14,-140,-6+sw*8);g.stroke();
  g.strokeStyle='#8a5a1e';g.lineWidth=9;g.stroke();
  g.lineCap='butt';

  // ---- legs: pinstripe trousers into black oxfords
  var i;
  for(i=0;i<2;i++){
    var far=i===0,lx=far?-30:26,off=far?-sw*5:sw*5;
    g.strokeStyle=far?'#191d26':'#252b36';g.lineWidth=30;g.lineCap='round';
    g.beginPath();g.moveTo(lx,-70);g.lineTo(lx+off,-17);g.stroke();g.lineCap='butt';
    g.fillStyle=far?'#0b0d10':'#14171c';
    rr(g,lx+off-25,-17,50,17,5);g.fill();ink(g,'rgba(3,3,5,.85)',2.2);

function drawWeaponIcon(c,x,y,wep,col,scale){
  c.save();c.translate(x,y);c.scale(scale||1,scale||1);c.lineJoin='round';c.lineCap='round';
  c.strokeStyle='rgba(5,6,7,.9)';c.lineWidth=1.5;c.fillStyle=col;
  if(wep==='scratch'){
    c.strokeStyle='#e8d6a8';c.lineWidth=3;c.beginPath();
    c.moveTo(-9,7);c.quadraticCurveTo(-2,-5,5,-9);c.moveTo(-3,9);c.quadraticCurveTo(4,-3,11,-7);c.stroke();
  }else if(wep==='pistol'){
    c.fillStyle='#c7cbd0';rr(c,-10,-6,18,7,2);c.fill();c.stroke();
    c.fillStyle='#3a4048';ell(c,-3,-1,3.4,3.2);c.fill();c.stroke();
    c.fillStyle='#7a5334';c.beginPath();c.moveTo(-6,0);c.lineTo(1,0);c.lineTo(-2,10);
    c.lineTo(-9,10);c.closePath();c.fill();c.stroke();
    c.fillStyle='#24282d';c.fillRect(8,-4,6,3);
  }else if(wep==='akimbo'){
    for(var t=0;t<2;t++){
      var oy=t?-3:3,dk=!t;
      c.fillStyle=dk?'#5a6068':'#c7cbd0';rr(c,-11,-3+oy,15,6,2);c.fill();c.stroke();
      c.fillStyle=dk?'#24282d':'#3a4048';c.fillRect(4,-2+oy,7,3);
      c.fillStyle=dk?'#4a3020':'#7a5334';
      c.beginPath();c.moveTo(-8,2+oy);c.lineTo(-2,2+oy);c.lineTo(-4,9+oy);
      c.lineTo(-10,9+oy);c.closePath();c.fill();c.stroke();
    }
  }else if(wep==='ak'){
    c.fillStyle='#4a5158';rr(c,-9,-4,17,7,2);c.fill();c.stroke();
    c.fillStyle='#2f343b';c.fillRect(7,-2.5,9,3.5);
    c.fillStyle='#7b4a28';c.beginPath();c.moveTo(-3,3);c.lineTo(4,3);
    c.quadraticCurveTo(6,11,1,12);c.quadraticCurveTo(-4,12,-4,6);c.closePath();c.fill();c.stroke();
    c.fillStyle='#8a5730';c.beginPath();c.moveTo(-9,-3);c.lineTo(-16,-6);c.lineTo(-16,3);
    c.lineTo(-8,2);c.closePath();c.fill();c.stroke();
  }else if(wep==='minigun'){
    c.fillStyle='#4a525c';rr(c,-10,-7,14,14,4);c.fill();c.stroke();
    c.fillStyle='#33393f';
    for(var mb=0;mb<4;mb++)rr(c,3,-5+mb*3,14,2.2,1);
    c.fill();
    c.fillStyle='#20242a';rr(c,16,-5,3,10,1);c.fill();c.stroke();
    c.fillStyle='#2a2f36';ell(c,-8,8,6,4.6);c.fill();c.stroke();
    c.fillStyle='#c9a24a';ell(c,-8,8,2,1.6);c.fill();
  }else if(wep==='spread'){
    c.rotate(-.1);
    c.fillStyle='#6a707a';rr(c,-3,-5,18,4,1.6);c.fill();c.stroke();
    rr(c,-3,0,18,4,1.6);c.fill();c.stroke();
    c.fillStyle='#12151a';c.fillRect(15,-4,2,2.4);c.fillRect(15,1,2,2.4);
    c.fillStyle='#8a512d';c.beginPath();c.moveTo(-3,-5);c.lineTo(-3,4);
    c.quadraticCurveTo(-15,9,-17,2);c.quadraticCurveTo(-15,-5,-3,-5);c.closePath();c.fill();c.stroke();
  }else if(wep==='sniper'){
    c.fillStyle='#4a5158';rr(c,-8,-3,14,6,2);c.fill();c.stroke();
    c.fillStyle='#23272c';c.fillRect(5,-1.6,13,3.2);
    c.fillStyle='#1b1f24';rr(c,-4,-9,13,5,2);c.fill();c.stroke();
    c.fillStyle='#8fd0ff';ell(c,8,-6.5,1.5,2);c.fill();
    c.fillStyle='#6d5233';c.beginPath();c.moveTo(-8,-3);c.lineTo(-8,3);c.lineTo(-16,7);
    c.quadraticCurveTo(-19,1,-16,-3);c.closePath();c.fill();c.stroke();
  }else if(wep==='bazooka'){
    c.rotate(-.08);c.fillStyle='#4f633b';rr(c,-13,-5,25,10,4);c.fill();c.stroke();
    c.fillStyle='#b86a32';c.beginPath();c.moveTo(10,-7);c.lineTo(16,-3);c.lineTo(16,3);c.lineTo(10,7);c.closePath();c.fill();c.stroke();
    c.fillStyle='#26302a';rr(c,-4,-10,10,3,1);c.fill();
    c.strokeStyle='#252b22';c.lineWidth=3;c.beginPath();c.moveTo(-4,5);c.lineTo(-2,11);c.stroke();
  }
  c.restore();
}
function paintItems(){
  var i;
  for(i=0;i<items.length;i++){
    var it=items[i],x=it.x+it.w/2,y=it.y+it.h/2+Math.sin(it.bob)*4;
    if(x<cam.x-50||x>cam.x+view.w+50)continue;
    g.globalAlpha=it.inB?(0.22+0.78*it.inB.cut):1;
    /* Icon art is authored at 1x around (x,y); scale about that centre so the
       drawn pickup matches its enlarged collision box. */
    g.save();g.translate(x,y);g.scale(ITEM_SCALE,ITEM_SCALE);g.translate(-x,-y);
    g.globalCompositeOperation='lighter';
    g.fillStyle=rad(g,x,y,2,44,[[0,'rgba(255,220,140,.20)'],[1,'rgba(0,0,0,0)']]);
    g.beginPath();g.arc(x,y,44,0,6.283);g.fill();
    g.globalCompositeOperation='source-over';
    if(it.kind==='mission'){
      g.fillStyle=lin(g,x-13,y-11,x+13,y+11,[[0,'#f2df9c'],[1,'#9d7b35']]);
      rr(g,x-13,y-11,26,22,3);g.fill();ink(g,'rgba(25,16,8,.85)',2);
      g.fillStyle='#b52f28';g.fillRect(x-9,y-5,18,3);g.fillRect(x-9,y+1,13,2);
      g.strokeStyle='#e8c25a';g.lineWidth=2;g.beginPath();g.arc(x,y,18+Math.sin(tick*.08)*2,0,6.283);g.stroke();
    } else if(it.kind==='cheese'){
      g.fillStyle=lin(g,x-14,y-12,x+14,y+12,[[0,'#ffe27a'],[1,'#d99a1c']]);
      g.beginPath();g.moveTo(x-14,y+11);g.lineTo(x+14,y+11);g.lineTo(x+14,y-8);g.closePath();g.fill();
      ink(g,'rgba(60,40,8,.8)',2);
      g.fillStyle='#c98a12';
      ell(g,x+3,y+4,3,2.6);g.fill();ell(g,x-5,y+7,2.2,1.9);g.fill();ell(g,x+9,y+1,2,1.7);g.fill();
      g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x-14,y+9,28,2);
    } else if(it.kind==='token'){
      /* A brass turnstile slug, square-punched, with a bite out of the rim —
         the brothers' money, and the thing an arcade has always taken. */
      g.fillStyle=lin(g,x-10,y-10,x+9,y+10,[[0,'#ffe9a2'],[0.5,'#e0aa3c'],[1,'#8a6018']]);
      ell(g,x,y,10,10);g.fill();ink(g,'rgba(40,26,6,.85)',2);
      g.fillStyle='rgba(120,80,16,.55)';ell(g,x,y,6.6,6.6);g.fill();
      g.fillStyle='#3a2708';rr(g,x-2.4,y-2.4,4.8,4.8,1);g.fill();
      g.fillStyle='#2a1c05';                                   // the bitten rim
      g.beginPath();g.arc(x+8.4,y-5.2,3.1,0,6.283);g.fill();
      g.fillStyle='rgba(255,255,255,.45)';ell(g,x-3.6,y-4,2.6,2);g.fill();
      g.strokeStyle='rgba(255,246,214,'+(0.35+0.3*Math.sin(tick*0.12+it.bob))+')';
      g.lineWidth=1.4;ell(g,x,y,12.5,12.5);g.stroke();
    } else if(it.kind==='nade'){
      g.fillStyle=lin(g,x-9,y-9,x+9,y+9,[[0,'#6b7d46'],[1,'#2c3520']]);
      ell(g,x,y+2,9,10);g.fill();ink(g,'rgba(6,8,4,.8)',2);
      g.fillStyle='#2a3018';g.fillRect(x-4,y-11,8,5);
      g.fillStyle='#c9a05a';g.fillRect(x+2,y-13,9,3);
      g.fillStyle='rgba(255,255,255,.18)';ell(g,x-3,y-1,2.6,3.4);g.fill();
    } else if(it.kind==='ammo'){
      /* A clip, not a crate: shorter than a weapon box and stamped in the colour
         of whatever it feeds, so you can tell across a room which gun it is for
         without reading anything. */
      var acol=(WEAPONS[it.wep]||WEAPONS.pistol).col||'#fff';
      g.fillStyle=lin(g,x-12,y-9,x+12,y+9,[[0,'#3d4a3a'],[1,'#1a201a']]);
      rr(g,x-12,y-9,24,18,3);g.fill();ink(g,'rgba(6,8,6,.85)',2);
      g.fillStyle='rgba(255,255,255,.07)';rr(g,x-9.5,y-6.5,19,7,2);g.fill();
      g.fillStyle=acol;
      for(var ai=0;ai<3;ai++){rr(g,x-8+ai*5.6,y+0.5,3.6,6.5,1);g.fill();}
      g.fillStyle='rgba(0,0,0,.45)';
      for(ai=0;ai<3;ai++){rr(g,x-8+ai*5.6,y+0.5,3.6,1.8,0.8);g.fill();}
      g.strokeStyle=hexA(acol,0.5);g.lineWidth=1.2;rr(g,x-12,y-9,24,18,3);g.stroke();
    } else {
      var col=WEAPONS[it.wep].col||'#fff';
      g.fillStyle=lin(g,x-14,y-13,x+14,y+13,[[0,'#4a4034'],[1,'#1d1a16']]);
      rr(g,x-14,y-13,28,26,4);g.fill();ink(g,'rgba(6,6,8,.85)',2);
      g.fillStyle='rgba(255,255,255,.08)';rr(g,x-11,y-10,22,20,3);g.fill();
      drawWeaponIcon(g,x,y,it.wep,col,1);
    }
    g.restore();
    g.globalAlpha=1;
  }
}
/* Counter-Strike style headshot sting: a skull with a blade driven through it,
   floating up off the kill. Authored around the origin at 1x and scaled with
   the cast so it stays legible at any character size. */
function paintHeadshots(){
  var i;
  for(i=0;i<marks.length;i++){
    var m=marks[i],t=1-m.life/m.max,k=0.95*charScale;
    var x=m.x,y=m.y-14*charScale-t*26;
    g.save();
    g.globalAlpha=m.life>16?1:m.life/16;
    g.translate(x,y);g.scale(k,k);
    // skull
    g.fillStyle='#efe7d6';
    g.beginPath();g.moveTo(-8,2);g.quadraticCurveTo(-9.5,-9,0,-9.6);
    g.quadraticCurveTo(9.5,-9,8,2);g.quadraticCurveTo(8,6.4,4.4,6.6);
    g.lineTo(-4.4,6.6);g.quadraticCurveTo(-8,6.4,-8,2);g.closePath();g.fill();
    ink(g,'rgba(24,16,12,.85)',1.5);
    g.fillStyle='#2b231d';
    ell(g,-3.5,-1.6,2.5,2.9);g.fill();ell(g,3.5,-1.6,2.5,2.9);g.fill();
    g.beginPath();g.moveTo(0,1.4);g.lineTo(1.7,4.4);g.lineTo(-1.7,4.4);g.closePath();g.fill();
    g.fillStyle='rgba(43,35,29,.9)';
    g.fillRect(-4.2,5.2,1.7,2.6);g.fillRect(-1.1,5.2,1.7,2.6);g.fillRect(2,5.2,1.7,2.6);
    // knife driven through, hilt low-left to point high-right
    g.rotate(-0.55);
    g.fillStyle='#4a3320';rr(g,-19,-2.3,9.5,4.6,1.8);g.fill();ink(g,'rgba(16,10,6,.7)',1);
    g.fillStyle='#8a6a3c';rr(g,-10.4,-3.8,2.8,7.6,1);g.fill();
    g.fillStyle='#e2e9ef';
    g.beginPath();g.moveTo(-7.6,-2.7);g.lineTo(11,-1.7);g.lineTo(16.5,0);
    g.lineTo(11,1.7);g.lineTo(-7.6,2.7);g.closePath();g.fill();ink(g,'rgba(18,22,26,.8)',1);
    g.fillStyle='rgba(255,255,255,.55)';g.fillRect(-6,-1.5,15,1.1);
    g.fillStyle='#b52f28';                                   // blood at the entry wound
    ell(g,-6,0,2.4,2.9);g.fill();
    g.restore();
  }
}
/* Weapon gallery, drawn in world space over the brother's head while a swipe

    g.strokeStyle=ob.done?'rgba(120,210,80,.75)':'rgba(201,162,74,.65)';g.lineWidth=1.5;rr(g,ox+.5,oy+.5,ow-1,33,5);g.stroke();
    var missionLine=ob.done?'MISSION COMPLETE — REACH EXTRACTION':
      (ob.taskDone?'FINAL OBJECTIVE — ELIMINATE '+level.miniBossInfo.name:ob.text+prog);
    txt(missionLine,w/2,oy+15,Math.min(13,w*.027),ob.done?'#9be36a':ob.taskDone?'#ffd06a':'#e8d6a8','center');
    txt(campaign.name+'  //  TRAIL TO THE CATMAN',w/2,oy+28,Math.min(9,w*.020),'#8a8070','center');
  }
  var mini=null;
  for(i=0;i<enemies.length;i++)if(enemies[i].miniBoss&&!enemies[i].dead){mini=enemies[i];break;}
  if(mini){
    /* One bar. The quarter mark is drawn on it, so the turn is something you can
       see coming rather than something that just happens. */
    var mw=w*.58,mx=(w-mw)/2,my=hh+78,rage=miniEnraged(mini),frac=clamp(mini.hp/mini.maxHp,0,1);
    var barCol=rage?'#f2bd35':'#df4438';
    g.fillStyle='rgba(7,6,8,.84)';rr(g,mx,my,mw,10,3);g.fill();
    g.fillStyle=barCol;rr(g,mx+1,my+1,Math.max(0,(mw-2)*frac),8,2);g.fill();
    if(rage){
      g.fillStyle='rgba(255,255,255,'+(0.16+0.12*Math.sin(tick*0.22))+')';
      rr(g,mx+1,my+1,Math.max(0,(mw-2)*frac),8,2);g.fill();
    }
    g.fillStyle='rgba(255,245,205,.65)';g.fillRect(mx+mw*MINI_RAGE_AT,my-2,1.5,14);
    g.strokeStyle=rage?'rgba(255,245,205,.95)':'rgba(255,215,120,.45)';g.lineWidth=rage?1.8:1;
    rr(g,mx+.5,my+.5,mw,10,3);g.stroke();
    txt(miniRecovering(mini)?mini.name+' — RELOADING — HIT IT NOW':
        mini.name+' — '+mini.title+(rage?'  //  ENRAGED — HUNTING YOU':''),
      w/2,my+26,12,miniRecovering(mini)?'#fffbe8':barCol,'center');
  }
  if(boss&&boss.state!=='dead'){
    var bw2=w*0.72,bx2=(w-bw2)/2,by2=hh+10;
    g.fillStyle='rgba(0,0,0,.65)';rr(g,bx2,by2,bw2,12,3);g.fill();
    g.fillStyle=lin(g,bx2,0,bx2+bw2,0,[[0,'#ff5a3a'],[1,'#8a1010']]);
    rr(g,bx2+1,by2+1,Math.max(0,(bw2-2)*(boss.hp/boss.maxHp)),10,2);g.fill();
    g.strokeStyle='rgba(201,162,74,.7)';g.lineWidth=1;rr(g,bx2+.5,by2+.5,bw2,12,3);g.stroke();
    txt('THE CATMAN',w/2,by2+26,13,'#e8b0a0','center');
  }
}

function comicBurst(cx,cy,rx,ry){
  var pts=32,i,a,r;
  g.beginPath();
  for(i=0;i<pts;i++){
    a=-Math.PI/2+i*6.283/pts;r=(i%2?0.78:1)*(0.94+0.08*Math.sin(i*7.3));
    var x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r;
    if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
  }
  g.closePath();
}
function titleHeroAction(offset){
  var p=(tick+offset)%420,a={duck:false,jump:0,roll:0,slide:0,fire:0,walk:tick*0.035};
  if(p>=80&&p<128)a.fire=(p%8)<5?6:0;
  else if(p>=132&&p<180)a.duck=true;
  else if(p>=184&&p<252){
    var rt=(p-184)/68;a.duck=true;a.roll=rt*6.283;a.slide=Math.sin(rt*Math.PI)*34;
  } else if(p>=270&&p<338){
    var jt=(p-270)/68;a.jump=Math.sin(jt*Math.PI)*42;a.walk+=jt*5;
  } else if(p>=354&&p<404)a.fire=(p%10)<5?6:0;
  return a;
}

/* ==================== LEVEL SELECT ====================
   A column of jobs, scrolled. Each row is a small square of the place itself —
   its own sky and ground colours, with the thing that stage is made of drawn on
   top: pipes for the sewers, crates for the warehouse, a vent grille for the way
   into the tower. A palette swatch alone made eleven cards that were hard to
   tell apart; a pipe and a crate are not. */
var levelIdx=0, levelScroll=0, levelDrag=null;
function levelRowH(){
  /* Rows stay small — the thumbnail is a stamp, not a poster. */
  return clamp(view.cssH*0.16,58,84);
}
function levelListBox(){
  /* The list is only tall enough for three and a bit rows, so the rest is
     plainly below the fold and the screen is not filled edge to edge. */
  var w=view.cssW,h=view.cssH,rh=levelRowH();
  var top=h*0.20,bot=h-Math.min(38,h*0.07)-30;
  var lh=Math.min(rh*3.5,Math.max(rh*2,bot-top));
  return {x:Math.max(12,w*0.5-260),y:top,w:Math.min(520,w-24),h:lh};
}
function levelRows(){
  var box=levelListBox(),rh=levelRowH(),out=[],i;
  for(i=0;i<STAGES.length;i++)
    out.push({x:box.x,y:box.y+i*rh-levelScroll,w:box.w,h:rh-8,n:i+1});
  return out;
}
function levelMaxScroll(){
  var box=levelListBox();
  return Math.max(0,STAGES.length*levelRowH()-box.h);
}
function levelScrollTo(i){
  var box=levelListBox(),rh=levelRowH(),top=i*rh,bot=top+rh;
  if(top<levelScroll)levelScroll=top;
  else if(bot>levelScroll+box.h)levelScroll=bot-box.h;
  levelScroll=clamp(levelScroll,0,levelMaxScroll());
}
function levelButtons(){
  /* Under the list rather than pinned to the floor, so the screen reads as one
     block on a tall window instead of two things at opposite ends. */
  var w=view.cssW,h=view.cssH,box=levelListBox();
  var bw=Math.min(w*0.24,220),bh=Math.min(38,h*0.07),y=Math.min(box.y+box.h+34,h-bh-12);
  return [
    {id:'back',label:'BACK',x:w*0.5-bw-8,y:y,w:bw,h:bh},
    {id:'go',label:'CONTINUE',x:w*0.5+8,y:y,w:bw,h:bh}
  ];
}
/* What each place is made of, drawn small. Origin is the middle of the square,
   sized in units of it, so one routine serves any thumbnail size. */
function drawLevelIcon(cx,cy,s,n,th){
  var u=s/100,i;
  g.save();g.translate(cx,cy);g.scale(u,u);
  g.lineWidth=3;g.strokeStyle='rgba(8,7,6,.65)';
  var lit=th.lamp,dark='rgba(10,12,12,.55)';
  if(n===1||n===4){
    // sewer: a big bore pipe across, a flange, and a valve wheel
    g.fillStyle='#5d6b62';rr(g,-46,-16,92,32,6);g.fill();g.stroke();
    g.fillStyle='#39443d';rr(g,-14,-20,12,40,3);g.fill();g.stroke();
    g.fillStyle='#7d8b80';rr(g,-46,-16,92,7,3);g.fill();
    if(n===4){
      g.strokeStyle='#b9a06a';g.lineWidth=6;
      g.beginPath();g.arc(24,-2,17,0,6.283);g.stroke();
      for(i=0;i<4;i++){var a=i*1.5708;g.beginPath();g.moveTo(24,-2);g.lineTo(24+Math.cos(a)*17,-2+Math.sin(a)*17);g.stroke();}
    } else {
      g.fillStyle=hexA(lit,0.5);ell(g,26,4,9,7);g.fill();      // drip
      g.fillStyle='#2a332e';ell(g,-30,26,20,6);g.fill();
    }
  } else if(n===2){
    // street: a lamp over a manhole
    g.fillStyle='#4a4450';rr(g,-6,-34,7,62,2);g.fill();g.stroke();
    g.fillStyle='#4a4450';rr(g,-6,-38,34,7,3);g.fill();g.stroke();
    g.fillStyle=lit;ell(g,26,-30,9,9);g.fill();
    g.fillStyle=hexA(lit,0.22);ell(g,26,-6,26,22);g.fill();
    g.fillStyle='#3a3542';ell(g,-4,30,30,10);g.fill();g.stroke();
    g.fillStyle='#524a5c';ell(g,-4,28,24,7);g.fill();
  } else if(n===3){
    // tenement: a wall of lit windows
    g.fillStyle='#4a3a2a';rr(g,-42,-36,84,72,4);g.fill();g.stroke();
    for(i=0;i<6;i++){
      var wx=-32+(i%3)*28,wy=-26+Math.floor(i/3)*30;
      g.fillStyle=(i===1||i===4)?lit:'#241a12';
      rr(g,wx,wy,20,20,2);g.fill();
    }
  } else if(n===5||n===6){
    // warehouse: stacked crates
    g.fillStyle='#8a6438';rr(g,-44,-4,42,40,3);g.fill();g.stroke();
    g.fillStyle='#9c723f';rr(g,0,-4,42,40,3);g.fill();g.stroke();
    g.fillStyle='#7a5730';rr(g,-24,-44,44,40,3);g.fill();g.stroke();
    g.strokeStyle='rgba(40,26,10,.5)';g.lineWidth=3;
    g.beginPath();g.moveTo(-44,16);g.lineTo(-2,16);g.moveTo(0,16);g.lineTo(42,16);
    g.moveTo(-24,-24);g.lineTo(20,-24);g.stroke();
    if(n===6){g.fillStyle='#c9a24a';rr(g,-10,-40,16,7,2);g.fill();}   // shipping tag
  } else if(n===7){
    // corporate avenue: a tower and a company van
    g.fillStyle='#4b4322';rr(g,-40,-40,36,58,3);g.fill();g.stroke();
    for(i=0;i<6;i++){g.fillStyle=(i%2)?lit:'#2c2810';rr(g,-34+(i%2)*14,-32+Math.floor(i/2)*17,10,11,1);g.fill();}
    g.fillStyle='#c9c2a8';rr(g,2,0,42,20,4);g.fill();g.stroke();
    g.fillStyle='#8f8a72';rr(g,2,0,14,12,2);g.fill();
    g.fillStyle='#22201a';ell(g,12,22,7,7);g.fill();ell(g,36,22,7,7);g.fill();
  } else if(n===8){
    // ventilation: a grille with the fan behind it
    g.fillStyle='#2b3550';rr(g,-40,-36,80,72,5);g.fill();g.stroke();
    g.strokeStyle=hexA(lit,0.65);g.lineWidth=5;
    for(i=0;i<5;i++){g.beginPath();g.moveTo(-32,-24+i*13);g.lineTo(32,-24+i*13);g.stroke();}
    g.strokeStyle='rgba(8,7,6,.6)';g.lineWidth=3;rr(g,-40,-36,80,72,5);g.stroke();
  } else if(n===9){
    // hallway: a corridor of doors running away from you
    g.fillStyle='#232a3a';rr(g,-44,-36,88,72,4);g.fill();g.stroke();
    g.fillStyle='#3b465e';g.beginPath();g.moveTo(-44,36);g.lineTo(-14,4);g.lineTo(14,4);g.lineTo(44,36);g.closePath();g.fill();
    g.fillStyle='#4e5a76';rr(g,-40,-22,18,34,2);g.fill();rr(g,22,-22,18,34,2);g.fill();
    g.fillStyle=lit;rr(g,-8,-16,16,22,2);g.fill();
  } else if(n===10){
    // director's office: a desk, a chair, a lamp
    g.fillStyle='#5a3a24';rr(g,-44,0,88,14,3);g.fill();g.stroke();
    g.fillStyle='#3f291a';rr(g,-36,14,10,22,2);g.fill();rr(g,26,14,10,22,2);g.fill();
    g.fillStyle='#2c2a30';rr(g,-14,-34,28,34,4);g.fill();g.stroke();
    g.fillStyle=lit;ell(g,30,-10,9,9);g.fill();
    g.fillStyle=hexA(lit,0.25);ell(g,30,2,20,10);g.fill();
