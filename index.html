<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ratz &amp; Catz — The Catman Runs These Streets</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#08080a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:#08080a;}
  #stage{flex:1 1 100%;position:relative;overflow:hidden;background:#0a0d0f;}
  #panel{display:none;visibility:hidden;position:fixed;inset:0;z-index:8;pointer-events:none;}
  #panel canvas{position:absolute;inset:0;pointer-events:auto;}
  #mobilePause{display:none;position:fixed;right:max(10px,env(safe-area-inset-right));top:max(9px,env(safe-area-inset-top));
    z-index:11;width:38px;height:38px;border:1px solid rgba(255,255,255,.34);border-radius:10px;
    background:rgba(8,12,14,.36);color:rgba(255,255,255,.78);font:bold 15px Arial,sans-serif;backdrop-filter:blur(3px);}
  /* The size knob is hidden: it sat over the score and read as part of the game
     rather than a browser control. The setting itself is untouched — whatever
     size was last chosen is still restored from the save on load. */
  #sizeCtl{display:none !important;position:fixed;right:max(10px,env(safe-area-inset-right));top:max(9px,env(safe-area-inset-top));
    z-index:11;align-items:center;gap:6px;padding:4px 6px;border:1px solid rgba(255,255,255,.28);
    border-radius:10px;background:rgba(8,12,14,.42);backdrop-filter:blur(3px);}
  #sizeCtl button{width:30px;height:30px;border:1px solid rgba(255,255,255,.30);border-radius:8px;
    background:rgba(255,255,255,.08);color:rgba(255,255,255,.86);font:bold 17px Arial,sans-serif;line-height:1;}
  #sizeCtl button:active{background:rgba(232,194,90,.32);}
  #sizeVal{min-width:44px;text-align:center;color:#e8c25a;font:bold 13px Arial,sans-serif;letter-spacing:.5px;}
  #pauseModal{display:none;position:fixed;inset:0;z-index:12;align-items:center;justify-content:center;background:rgba(2,4,5,.70);}
  #pauseCard{min-width:min(330px,72vw);padding:25px;border:1px solid rgba(232,194,90,.48);border-radius:14px;
    background:linear-gradient(#172024,#080b0d);box-shadow:0 18px 60px #000;text-align:center;color:#e8c25a;}
  #pauseCard h2{font-size:30px;letter-spacing:2px;margin-bottom:18px;text-shadow:2px 2px #42120e;}
  #pauseCard button{display:block;width:100%;margin:10px 0;padding:12px;border:1px solid rgba(255,255,255,.26);border-radius:8px;
    background:rgba(255,255,255,.07);color:#eee;font:18px Impact,sans-serif;letter-spacing:1px;}
  @media (orientation:landscape) and (pointer:coarse){#panel,#mobilePause{display:block;}}
  canvas{display:block;width:100%;height:100%;}
  #stage canvas{box-shadow:inset 0 -14px 26px rgba(0,0,0,.7);}
  #rotate{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:28px;background:
    radial-gradient(circle at 50% 42%,#263b3b 0,#0b1214 52%,#050708 100%);color:#e8d6a8;}
  #rotate .phone{width:54px;height:92px;border:5px solid #e8c25a;border-radius:10px;
    transform:rotate(90deg);margin:12px 0 26px;box-shadow:0 0 30px rgba(232,194,90,.24);}
  #rotate h1{font-size:clamp(28px,9vw,48px);letter-spacing:1px;color:#e8c25a;
    text-shadow:3px 3px 0 #42120e;}
  #rotate p{font-family:Arial,sans-serif;font-weight:bold;font-size:15px;line-height:1.45;
    max-width:340px;color:#b9c6b0;margin-top:10px;}
  @media (orientation:portrait) and (pointer:coarse){
    #app{display:none;}#rotate{display:flex;}
  }
</style>
</head>
<body>
<div id="rotate" role="button" aria-label="Rotate device to landscape" tabindex="0">
  <div class="phone"></div>
  <h1>TURN IT SIDEWAYS!</h1>
  <p>Ratatatata! is a landscape-only operation. Rotate your phone, then tap anywhere to deploy.</p>
</div>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="panel"><canvas id="pad"></canvas></div>
</div>
<button id="mobilePause" aria-label="Pause game">Ⅱ</button>
<div id="sizeCtl">
  <button id="sizeDown" type="button" aria-label="Decrease character size">&minus;</button>
  <span id="sizeVal">1.00&times;</span>
  <button id="sizeUp" type="button" aria-label="Increase character size">+</button>
</div>
<div id="pauseModal"><div id="pauseCard"><h2>PAUSED</h2><button id="pauseContinue">CONTINUE</button><button id="pauseMenu">MAIN MENU</button></div></div>
<script>
(function(){
'use strict';

/* ==================== CANVAS / VIEW ==================== */
var stageEl=document.getElementById('stage'), panelEl=document.getElementById('panel');
var rotateEl=document.getElementById('rotate'),landscapeAsked=false;
var mobilePause=document.getElementById('mobilePause'),pauseModal=document.getElementById('pauseModal');
var gcv=document.getElementById('game'), g=gcv.getContext('2d');
var pcv=document.getElementById('pad'),  pg=pcv.getContext('2d');
/* Drop a painted logo in at this path and the title screen uses it; until one
   exists the lettering below is drawn instead, which is no worse for it. */
var titleLogo=new Image();titleLogo.src='assets/images/ui/ratz-catz-title.png';
var alleyArt=new Image();alleyArt.src='assets/images/ui/alley-start.jpg';

var view={w:520,h:900,scale:1,cssW:360,cssH:640};
var pad ={cssW:360,cssH:160};
var DPR=1, VIEW_BOTTOM=612, camY0=-300;
/* The vertical camera measures the brother against the street directly beneath
   him, not against a fixed line. Ground that rises and falls therefore moves
   nothing — the reference rises and falls with it — while anything he lands on
   above the street lifts the shot by exactly how high it is. The dead zone is
   smaller than one crate, so hopping a barrel is ignored and a stack of them is
   not. camAnchorY is the last surface he actually stood on; camGroundY is the
   street under his feet. */
var CAM_DEADZONE=34, camAnchorY=470, camGroundY=470;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  var r=stageEl.getBoundingClientRect();
  view.cssW=Math.max(1,r.width); view.cssH=Math.max(1,r.height);
  gcv.width=Math.round(view.cssW*DPR); gcv.height=Math.round(view.cssH*DPR);
  var a=view.cssW/view.cssH;
  if(a<520/560){ view.w=520; view.h=520/a; } else { view.h=560; view.w=560*a; }
  view.scale=view.cssW/view.w;
  camY0=VIEW_BOTTOM-view.h;
  var q=panelEl.getBoundingClientRect();
  pad.cssW=Math.max(1,q.width); pad.cssH=Math.max(1,q.height);
  pcv.width=Math.round(pad.cssW*DPR); pcv.height=Math.round(pad.cssH*DPR);
  layoutPad();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);});
function requestLandscape(){
  if(!matchMedia('(pointer:coarse)').matches)return;
  var root=document.documentElement,p=Promise.resolve();
  if(!document.fullscreenElement&&root.requestFullscreen)p=root.requestFullscreen().catch(function(){});
  p.then(function(){
    if(screen.orientation&&screen.orientation.lock)
      screen.orientation.lock('landscape').catch(function(){});
  });
  landscapeAsked=true;
}
function setPauseModal(show){pauseModal.style.display=show?'flex':'none';}
mobilePause.addEventListener('click',function(e){e.preventDefault();initAudio();requestLandscape();if(state==='PLAY'){state='PAUSE';setPauseModal(true);}});
document.getElementById('pauseContinue').addEventListener('click',function(){state='PLAY';setPauseModal(false);SFX.start();});
document.getElementById('pauseMenu').addEventListener('click',function(){Music.menu();state='TITLE';stateT=0;setPauseModal(false);});
rotateEl.addEventListener('click',requestLandscape);
rotateEl.addEventListener('touchend',function(e){e.preventDefault();requestLandscape();},{passive:false});

/* ==================== MATH ==================== */
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var rnd=function(a,b){return a+Math.random()*(b-a);};
var lerp=function(a,b,t){return a+(b-a)*t;};
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function lin(c,x0,y0,x1,y1,st){var q=c.createLinearGradient(x0,y0,x1,y1),i;
  for(i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}
function rad(c,x,y,r0,r1,st){var q=c.createRadialGradient(x,y,r0,x,y,r1),i;
  for(i=0;i<st.length;i++)q.addColorStop(st[i][0],st[i][1]);return q;}
function rr(c,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),0,0,6.283);}
/* House line weight. Every outline in the game is drawn relative to this, so
   the whole drawing can be made finer or heavier from one number while the
   relative weights — a boot heavier than a collar — stay as they were. */
var INK_SCALE=0.6;
function ink(c,col,lw){c.strokeStyle=col||'rgba(10,8,10,.75)';c.lineWidth=(lw||2)*INK_SCALE;c.stroke();}

/* ==================== INPUT ==================== */
/* upjump is a synthetic control: a decisive upward push of the move stick,
   kept separate from `up` so climbing (which tolerates diagonals) and jumping
   (which must not fire when you merely angle the stick) can use the same axis. */
var NAMES=['left','right','up','down','jump','upjump','fire','nade','swap','start','pause'];
var kb={},tc={},inp={},prev={},keyPulse=false,anyKey=false;
var KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
  KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyZ:'jump',Space:'jump',KeyK:'jump',
  KeyX:'fire',KeyJ:'fire',KeyC:'nade',KeyL:'nade',ShiftLeft:'swap',KeyQ:'swap',
  Enter:'start',KeyR:'start',KeyP:'pause',Escape:'pause'};
window.addEventListener('keydown',function(e){var n=KEYS[e.code];
  if(!e.repeat){keyPulse=true;initAudio();}
  if(n){kb[n]=true;e.preventDefault();}});
window.addEventListener('keyup',function(e){var n=KEYS[e.code];if(n){kb[n]=false;e.preventDefault();}});
window.addEventListener('blur',function(){var i;for(i=0;i<NAMES.length;i++){kb[NAMES[i]]=false;tc[NAMES[i]]=false;}
  moveStick.ax=0;moveStick.ay=0;aimStick.ax=0;aimStick.ay=0;wepSwipe.id=-1;padOwner={};});

/* Is there anything worth spending a round on? Same space as the brother —
   a rat in another building is not a reason to fire down a corridor — and close
   enough to matter. The boss always counts. */
function threatNear(){
  if(!level||state!=='PLAY'||P.dead)return false;
  if(boss&&boss.state!=='dead')return true;
  var px=P.x+P.w/2,py=P.y+P.h/2,i,e;
  for(i=0;i<enemies.length;i++){
    e=enemies[i];
    if(e.dead||e.hidden||e.fallDead)continue;
    if((e.inB||null)!==(P.inB||null))continue;
    if(Math.abs(e.x+e.w/2-px)>TRIGGER_REACH_X)continue;
    if(Math.abs(e.y+e.h/2-py)>TRIGGER_REACH_Y)continue;
    return true;
  }
  return false;
}
function updateAimTrigger(){
  if(!coarsePointer()){mobileAutoFire=false;triggerLive=false;return;}
  var mag=Math.hypot(aimStick.ax,aimStick.ay);
  // A wide gap between the push that fires and the push that stops: steering
  // across the line should not cost a round.
  if(aimHot){if(mag<AUTOFIRE_OFF)aimHot=false;}
  else if(mag>AUTOFIRE_ON)aimHot=true;
  /* Held out at the rim, the safety is overruled — deliberate, and it stays
     overruled until the thumb comes back, so a crate can be worked on. */
  if(mag>RIM_PUSH)rimHeld++;else rimHeld=0;
  if(rimHeld>RIM_HOLD)rimOverride=true;
  if(!aimHot)rimOverride=false;
  /* The gun stays live for a moment after the last thing worth shooting has
     gone, so finishing a burst over a body does not die mid-trigger. */
  if(threatNear())triggerGrace=TRIGGER_GRACE;
  else if(triggerGrace>0)triggerGrace--;
  triggerLive=aimHot&&(rimOverride||triggerGrace>0);
  mobileAutoFire=triggerLive;
  tc.fire=triggerLive;
}
function poll(){var i,n;anyKey=keyPulse;keyPulse=false;for(i=0;i<NAMES.length;i++){n=NAMES[i];prev[n]=inp[n];inp[n]=!!(kb[n]||tc[n]);}}
function pressed(n){return inp[n]&&!prev[n];}
function anyButtonPressed(){for(var i=0;i<NAMES.length;i++)if(pressed(NAMES[i]))return true;return false;}

/* ---- arcade panel layout + touch ---- */
/* Twin-stick mobile layout: the left stick walks and climbs, the right stick
   aims through a full 360 degrees independently of where you are moving. Each
   stick carries the buttons its own thumb is expected to reach. */
var moveStick={cx:0,cy:0,r:0,ax:0,ay:0,vx:0,vy:0,id:-1};
var aimStick ={cx:0,cy:0,r:0,ax:0,ay:0,vx:0,vy:0,id:-1};
/* Weapon switching is a swipe across the brother himself. shown counts down the
   frames the gallery stays up over his head after the last drag. */
var wepSwipe={id:-1,lastX:0,shown:0}, WEAPON_SWIPE_PX=34;
/* touch identifier -> what that finger is driving ('move' | 'aim' | 'swipe' |
   button index). Ownership is decided once, when the finger lands, and held
   until it lifts. */
var padOwner={};
/* Shooting is the aim stick's job and jumping is the move stick's, so the only
   buttons left are the occasional ones: grenades on the left, and a jump button
   on the right kept for crouch-drops (down + jump cannot be expressed by one
   stick) and for jumping while stood at a ladder. */
var BTNS=[
  {n:'nade', l:'C', sub:'BOMB',  x:0,y:0,r:0,p:0,hue:'#e8b23a',side:'L'},
  {n:'jump', l:'A', sub:'JUMP',  x:0,y:0,r:0,p:0,hue:'#e2402f',side:'R'},
  {n:'swap', l:'D', sub:'SWAP',  x:0,y:0,r:0,p:0,hue:'#e8b23a',side:'R'}
];
/* The aim stick has to carry two intentions at once — where the brother looks
   and whether he shoots — and turning to face the way you are walking put the
   thumb straight through the trigger. So the gun keeps its own safety:

   - it holds fire while nothing worth shooting is near, so corridors and empty
     rooms cost no ammo at all;
   - it goes live by itself the moment something is, with no input from the
     player and nothing to arm, so it can never be caught switched off when a
     room turns out to be occupied;
   - and pushing the stick out to the rim and holding fires anyway, which is how
     you blow the lock off a crate with nothing alive nearby.

   The push that fires is out near the rim now rather than half way, and it lets
   go again only when the thumb comes well back, so drifting across the line
   while steering does not squeeze off a round. */
var AUTOFIRE_ON=0.80, AUTOFIRE_OFF=0.60, RIM_PUSH=0.93, RIM_HOLD=10;
var TRIGGER_REACH_X=460, TRIGGER_REACH_Y=280, TRIGGER_GRACE=80;
var AUTOFIRE_MIN=AUTOFIRE_ON;              // the ring the pad draws
var mobileAutoFire=false, aimHot=false, rimHeld=0, rimOverride=false, triggerLive=false, triggerGrace=0;
var SMALL=[
  {n:'start',l:'START',x:0,y:0,r:0,p:0},
  {n:'pause',l:'PAUSE',x:0,y:0,r:0,p:0}
];
function layoutPad(){
  var w=pad.cssW,h=pad.cssH;
  var sat=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')||0);
  var r=Math.min(h*0.135,w*0.082,66), br=Math.min(h*0.070,w*0.043,38);
  /* Weapon switching lives on the character now, so nothing reserves the right
     edge and the aim stick can mirror the move stick exactly. */
  var inset=Math.max(w*0.135,r+20+sat);
  moveStick.r=aimStick.r=r;
  moveStick.cx=inset;
  aimStick.cx=w-inset;
  moveStick.cy=aimStick.cy=h*0.72;
  /* Buttons sit clear above the ring of the stick their thumb shares:
     fire + bomb over the move stick, jump + swap over the aim stick. */
  var by=moveStick.cy-r-br*1.45;
  BTNS[0].x=moveStick.cx+br*0.2;  BTNS[0].y=by;              // BOMB
  BTNS[1].x=aimStick.cx-br*1.45;  BTNS[1].y=by;              // JUMP
  BTNS[2].x=aimStick.cx+br*1.55;  BTNS[2].y=by+br*0.62;      // SWAP
  BTNS[0].r=br;BTNS[1].r=br;BTNS[2].r=br*0.86;
  SMALL[0].r=0;SMALL[1].r=0;
}
/* The pad canvas covers the whole viewport, so it — not the game canvas —
   receives every touch. Character gestures therefore have to be resolved here,
   against the stage canvas' own rect so the mapping stays correct even if the
   two canvases are ever sized differently. */
function touchOnPlayer(t){
  if(!level||state!=='PLAY'||P.dead)return false;
  var r=gcv.getBoundingClientRect();
  var cx=(t.clientX-r.left)/r.width*view.cssW, cy=(t.clientY-r.top)/r.height*view.cssH;
  var k=view.scale*cam.zoom;
  var wx=cam.x+cx/k, wy=cam.y+cy/k, pad2=30;
  return wx>P.x-pad2&&wx<P.x+P.w+pad2&&wy>P.y-pad2*1.6&&wy<P.y+P.h+pad2;
}
function stepWeaponSwipe(t){
  var dx=t.clientX-wepSwipe.lastX;
  wepSwipe.shown=90;
  /* Drag left for the next weapon, right for the previous — the gallery over
     the brother's head moves the same way the thumb does. */
  if(Math.abs(dx)>=WEAPON_SWIPE_PX){cycleWeapon(dx<0?1:-1);wepSwipe.lastX=t.clientX;}
}
/* Decides what a NEW touch belongs to. Only ever called on the frame a finger
   first lands; after that the touch keeps its owner (see padOwner) so dragging
   a thumb up out of a stick well cannot press the button sitting above it. */
function claimTouch(t,x,y){
  var k;
  for(k=0;k<BTNS.length;k++){
    var b=BTNS[k];
    if(Math.hypot(x-b.x,y-b.y)<b.r*1.32)return k;
  }
  /* Each stick owns the area around its own well, tested before the character,
     because the camera regularly parks the brother on top of the move stick. */
  if(Math.hypot(x-moveStick.cx,y-moveStick.cy)<moveStick.r*1.35)return 'move';
  if(Math.hypot(x-aimStick.cx,y-aimStick.cy)<aimStick.r*1.35)return 'aim';
  if(wepSwipe.id<0&&touchOnPlayer(t)){
    wepSwipe.id=t.identifier;wepSwipe.lastX=t.clientX;wepSwipe.shown=90;return 'swipe';
  }
  return (x<pad.cssW*0.5)?'move':'aim';
}
function padTouch(e){
  e.preventDefault(); initAudio();if(!landscapeAsked)requestLandscape();
  var i,k; for(k=0;k<NAMES.length;k++) tc[NAMES[k]]=false;
  for(k=0;k<BTNS.length;k++)BTNS[k].p=0;
  SMALL[0].p=0;SMALL[1].p=0;
  var mx=0,my=0,mHeld=false,ax=0,ay=0,aHeld=false,seen={};
  var r=pcv.getBoundingClientRect();
  for(i=0;i<e.touches.length;i++){
    var t=e.touches[i],id=t.identifier;
    var x=(t.clientX-r.left)/r.width*pad.cssW, y=(t.clientY-r.top)/r.height*pad.cssH;
    seen[id]=1;
    if(!(id in padOwner))padOwner[id]=claimTouch(t,x,y);
    var own=padOwner[id];
    if(own==='swipe'){stepWeaponSwipe(t);continue;}
    if(typeof own==='number'){var b2=BTNS[own];tc[b2.n]=true;b2.p=1;continue;}
    var s=(own==='aim')?aimStick:moveStick;
    var dx=x-s.cx, dy=y-s.cy, d=Math.hypot(dx,dy)||1, m=Math.min(1,d/(s.r*1.15));
    if(s===moveStick){mx=dx/d*m; my=dy/d*m; mHeld=true;}
    else {ax=dx/d*m; ay=dy/d*m; aHeld=true;}
  }
  for(var oid in padOwner){
    if(seen[oid])continue;
    if(padOwner[oid]==='swipe')wepSwipe.id=-1;
    delete padOwner[oid];
  }
  moveStick.ax=mHeld?mx:0; moveStick.ay=mHeld?my:0;
  aimStick.ax =aHeld?ax:0; aimStick.ay =aHeld?ay:0;
  var DZ=0.34;
  /* Movement comes from the left stick alone; the aim stick never walks the
     brother, which is what makes strafing and 360 aim independent. */
  tc.left = moveStick.ax<-DZ; tc.right= moveStick.ax>DZ;
  tc.up   = moveStick.ay<-DZ; tc.down = moveStick.ay>DZ;
  /* Jump wants a deliberate upward push, not the incidental up you get from
     steering, so the vertical axis has to dominate — but only just, because an
     up-and-back diagonal is how you ask for a backward leap. How far past the
     threshold the thumb sits is the jump's power (see stickUpThrottle). */
  tc.upjump = moveStick.ay<-0.55&&Math.abs(moveStick.ay)>Math.abs(moveStick.ax);
  /* The stick only reports where the thumb is; whether that pulls a trigger is
     decided once a frame in updateAimTrigger, which is the only place that can
     know whether there is anything to shoot at. */
}
['touchstart','touchmove','touchend','touchcancel'].forEach(function(n){
  pcv.addEventListener(n,padTouch,{passive:false});
});
var tapped=false,selectDeployTap=false;
function stageTouch(e){
  e.preventDefault();initAudio();if(!landscapeAsked)requestLandscape();
  if(state==='GAMEOVER'&&e.touches&&e.touches.length){
    var or3=gcv.getBoundingClientRect();
    if(gameOverPointer((e.touches[0].clientX-or3.left)/or3.width*view.cssW,

/* ==================== NET: TWO-PLAYER LOBBY ====================
   Two browsers cannot find each other unaided, so a room code is minted at a
   rendezvous (scripts/signal-server.js locally, scripts/cloudflare/worker.js on
   Cloudflare) and each peer leaves the other a description of how to be reached.
   The moment those descriptions have been swapped the browsers talk directly:
   the lobby — who is here, which rat each has picked — rides the peer connection
   itself, and the rendezvous never sees any of it.

   Signalling lives at the same origin as the page by default, which is what the
   bundled server arranges; ?signal=https://host overrides it for a game served
   from somewhere other than its Worker. */

  try{
    var q=new URLSearchParams(location.search).get('signal');

var actx=null;

  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(!actx)return;
  Music.init();
  /* Queue the music straight away, whether or not the context is allowed to run
     yet. A suspended context has a frozen clock: a source started against it
     makes no sound and loses no ground, and the moment the context is resumed
     the track begins from its first sample. So the arcade is playing from the
     instant the browser permits it rather than from the gesture after that.

     resume() is the reason it used to take two. It returns a promise, so the
     state is still 'suspended' on the line after the call — the old check for
     'running' could not be true on the gesture that did the resuming, and the
     music waited for whatever the player pressed next. */
  if(state==='TITLE'&&Music.mode!=='menu')Music.menu();
  if(actx.state!=='suspended')return;
  var r;
  try{r=actx.resume();}catch(e){}
  if(r&&r.then)r.then(function(){
    if(state==='TITLE'&&Music.mode!=='menu')Music.menu();
  },function(){});
}

   will not, and then the first key or tap does it. Either way nothing is lost. */

   browser long after the title screen, and coming back to a silent game is
   worse than the cost of one cheap call. */

  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  q.gain.setValueAtTime(vol||0.05,t); q.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(q);q.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);

          if(t.loopStart!==undefined)spec.loopStart=t.loopStart;
          if(t.loopEnd!==undefined)spec.loopEnd=t.loopEnd;
          if(t.gain!==undefined)spec.gain=t.gain;

     which is what want is for. */
  play:function(key,fade){
    if(!actx)return;
    var self=this;
    this.want=key;
    this.loadMeta().then(function(){return self.load(key);}).then(function(buf){
      if(self.want!==key)return;                       // moved on while loading
      if(!buf)return;                                 // nothing supplied for this slot
      if(self.voice&&self.voice.key===key)return;      // already on
      var old=self.voice;
      self.voice=self.makeVoice(buf,MUSIC_TRACKS[key],0);
      self.voice.key=key;
      self.fadeIn(self.voice,fade);
      self.fadeOut(old,fade);

  menu:function(){this.mode='menu';this.combat=false;this.play('menu',0.7);},
  game:function(n){

  playBoss:function(){this.combat=true;this.play('boss',0.5);},
  playAmbient:function(){this.combat=false;this.play(levelTrack(this.stage),0.5);},
  /* The music reads the fight: more of them near you and the filter opens and
     the level comes up, and a mini-boss or the boss swaps to its own piece if
     one was supplied. Without a boss track the level theme simply opens all the

  update:function(){

    }

    if(wantsBoss!==this.combat){
      if(wantsBoss){
        var self=this;
        this.load('boss').then(function(b){
          if(b)self.playBoss();
          else {self.combat=true;}                     // no boss track: stay and open up
        });

    }

    if(this.combat&&v.key!=='boss'){
      v.filter.frequency.setTargetAtTime(base*1.9,now,.5);
      v.gain.gain.setTargetAtTime(v.target*1.25,now,.5);
    } else if(!this.combat){
      v.filter.frequency.setTargetAtTime(Math.min(base*1.45,base+threat*95),now,.45);

/* Everything the game remembers between sessions, in one record under one key.
   Earlier builds kept a key per value; those are folded in the first time this
   runs, so a player who already unlocked half the campaign keeps it. The old
   keys are read and then left alone rather than deleted — an older tab may
   still be open on the same machine, and they cost nothing.

   Storage is never guaranteed: a private window or a file:// origin refuses it,
   and a full disk throws on write. Every access here is wrapped, and a refusal
   simply means the game forgets, which is what it did before any of this. */
var SAVE_KEY='rat.save.v1', SAVE_VERSION=1;
var Save=(function(){
  var d={version:SAVE_VERSION,cleared:{},tokens:null,hiScore:0,charScale:null,
         furthest:1,bro:0};
  function shelf(){try{return window.localStorage;}catch(err){return null;}}
  function get(k){var s=shelf();if(!s)return null;try{return s.getItem(k);}catch(err){return null;}}
  function parse(raw){try{var o=JSON.parse(raw);return (o&&typeof o==='object')?o:null;}catch(err){return null;}}
  function whole(v,lo){return (typeof v==='number'&&isFinite(v))?Math.max(lo,Math.floor(v)):null;}
  /* Take only what is recognisably ours. A record hand-edited, truncated by a
     dying tab or written by a future build should leave the game playable. */
  function adopt(o){
    if(!o)return;
    if(o.cleared&&typeof o.cleared==='object')d.cleared=o.cleared;
    var n;
    if((n=whole(o.tokens,0))!==null)d.tokens=n;
    if((n=whole(o.hiScore,0))!==null)d.hiScore=n;
    if((n=whole(o.furthest,1))!==null)d.furthest=n;
    if(typeof o.charScale==='number'&&isFinite(o.charScale))d.charScale=o.charScale;
    if(o.bro===0||o.bro===1)d.bro=o.bro;
  }
  function flush(){
    var s=shelf();if(!s)return;
    try{s.setItem(SAVE_KEY,JSON.stringify(d));}catch(err){}
  }
  var API={
    d:d,
    set:function(k,v){if(d[k]===v)return;d[k]=v;flush();},
    touch:flush
  };
  var found=parse(get(SAVE_KEY));
  if(found&&found.version===SAVE_VERSION)adopt(found);
  else {adopt({cleared:parse(get('rat.cleared')),charScale:parseFloat(get('rat.charScale'))});flush();}
  return API;
})();

  o.x+=(o.w-nw)/2;o.y+=centred?(o.h-nh)/2:(o.h-nh);o.w=nw;o.h=nh;
}
function applyCharScale(){

/* ==================== LEVEL ==================== */
function safeRespawn(x){
  var best=null,i,p;
  for(i=0;i<level.plats.length;i++){
    p=level.plats[i];
    if(!p.ground||p.w<90)continue;
    if(x>=p.x&&x<=p.x+p.w){best=p;break;}
    if(p.x+p.w<x&&(!best||p.x>best.x))best=p;
  }
  if(!best)return {x:60,y:360};
  return {x:clamp(x-56,best.x+24,best.x+best.w-56),y:best.y-60};
}
function groundYAt(lv,x){
  var i,p;
  for(i=0;i<lv.plats.length;i++){p=lv.plats[i];
    if(p.ground&&x>=p.x+10&&x<=p.x+p.w-10)return p.y;}
  return null;
}
function objectiveText(n,type,thing){
  return 'RECOVER THE '+thing.toUpperCase();
}
/* Would the objective sit inside something solid if it went here? Uses the same
   reachability rule as the buried-item sweep, against the box the objective
   would occupy. */
function routeSpotClear(lv,rs){
  var box={x:Math.round(rs.x-ITEM_D/2),y:Math.round(rs.y-28),w:ITEM_D,h:ITEM_D},i,o;
  for(i=0;i<lv.obstacles.length;i++){
    o=lv.obstacles[i];
    if(o.decorative||o.decor||!o.platform)continue;
    if(itemBuried(box,o))return false;
  }
  return true;
}
function configureObjective(lv,rng,n){
  if(lv.boss){lv.objective={type:'boss',text:'FINISH THE CATMAN',taskDone:false,done:false,progress:0,total:1};return;}
  var biomeLoot=lv.flow&&lv.flow.loot,thing=biomeLoot?biomeLoot[Math.floor(rng()*biomeLoot.length)]:campaign.things[(n-1)%campaign.things.length];
  var o=lv.objective={type:'recover',text:objectiveText(n,'recover',thing),taskDone:false,done:false,progress:0,total:1,thing:thing};
  /* The job sits on the way through, never down a branch. A stage has one path
     from its start to its exit; if the thing you came for is off that path then
     the detour is not a detour, it is the route with an extra step, and the
     player has no decision left to make. So the objective takes a route spot —
     the sump you have to walk, the roofs you have to cross, the container you
     have to climb — which is off the ground lane without being off the path. */
  /* Any route spot will do, but not one with a pipe or a plank standing in it:
     the objective is exempt from the buried-item sweep — moving it is what would
     take it off the path — so the clear spot has to be chosen here instead.
     Rotating through the list from a random start keeps the placement as varied
     as picking at random while still landing somewhere reachable. */
  var pick=null,ri,rs,n0=lv.routeSpots.length;
  if(n0){
    var start=Math.floor(rng()*n0);
    for(ri=0;ri<n0;ri++){
      rs=lv.routeSpots[(start+ri)%n0];
      if(routeSpotClear(lv,rs)){pick=rs;break;}
    }
    if(!pick){pick=lv.routeSpots[start];pick.crowded=true;}
  }
  if(pick){
    var mi={x:Math.round(pick.x-ITEM_D/2),y:Math.round(pick.y-28),w:ITEM_D,h:ITEM_D,
            kind:'mission',bob:rng()*6.28,objective:true};
    /* Every route spot on this stage has something standing in it. Lifting the
       objective onto the lid nudges it off the declared spot, which is a shame;
       leaving it inside the pipe makes the stage impossible to finish, which is
       not. Reachable wins. */
    if(pick.crowded)liftClear(lv,mi);
    lv.items.push(mi);
    var ug=groundYAt(lv,pick.x);
  } else {
    var ix=Math.round(lv.length*.45),iy=(groundYAt(lv,ix)||470)-28;
    lv.items.push({x:ix,y:iy,w:ITEM_D,h:ITEM_D,kind:'mission',bob:rng()*6.28,objective:true});
  }
}
/* Everything you may walk past. A pocket is worth the climb or it is not worth
   building: a weapon, a slug for the wallet, a grenade — never the objective,
   and never something the stage cannot be finished without. */
function stockPockets(lv,rng){
  for(var i=0;i<lv.pockets.length;i++){
    var k=lv.pockets[i],r=rng();
    if(k.inB)continue;
    var kind=r<0.30?'token':r<0.62?'weapon':r<0.85?'nade':'cheese';
    if(k.plat)deckItem(lv,rng,k.plat,k.x,kind);
    else lv.items.push({x:Math.round(k.x-ITEM_D/2),y:Math.round(k.y-ITEM_D-6),w:ITEM_D,h:ITEM_D,
                        kind:kind,bob:rng()*6.28,
                        wep:rollWeapon(rng)});
  }
}
function configureMiniBoss(lv,n){
  if(lv.boss)return;
  var m=MINI_BOSSES[(n-1)%MINI_BOSSES.length],mx=lv.length-610,my=groundYAt(lv,mx);
  while(my===null&&mx>lv.length-1000){mx-=35;my=groundYAt(lv,mx);}
  if(my===null)my=500;
  lv.miniBossInfo=m;lv.miniBossDefeated=false;
  lv.spawns.push({x:Math.round(mx),y:Math.round(my-(m.type==='brute'?52:m.type==='prowler'?80:m.type==='gunner'?38:32)),
    t:m.type,used:false,miniBoss:m});
}
function enemySpawnSize(t){var z=t==='brute'?{w:40,h:52}:t==='prowler'?{w:34,h:24}:t==='terminator'?{w:36,h:46}:t==='enforcer'?{w:28,h:40}:t==='gunner'?{w:26,h:38}:{w:24,h:32};
  z.w*=charScale;z.h*=charScale;return z;}
function enemySpawnBlocked(lv,s,x,y){
  var z=enemySpawnSize(s.t),r={x:x,y:y,w:z.w,h:z.h},i,p;
  for(i=0;i<lv.obstacles.length;i++){
    var o=lv.obstacles[i];
    // The surface you are standing on is not something you are standing in.
    if(s.deck&&o===s.deck.obstacle)continue;
    if(!o.dead&&!o.decorative&&hit(r,{x:o.x-5,y:o.y-3,w:o.w+10,h:o.h+6}))return true;
  }
  if(s.inB)for(i=0;i<lv.plats.length;i++){
    p=lv.plats[i];if(p.inside===s.inB&&p.step&&hit(r,{x:p.x-3,y:p.y-3,w:p.w+6,h:p.h+6}))return true;
  }
  return false;
}
function interiorSpawnSupported(lv,s,x,y,z){
  var foot=y+z.h,cx=x+z.w/2;
  if(Math.abs(foot-s.inB.gy)<5)return true;
  for(var i=0;i<lv.plats.length;i++){
    var p=lv.plats[i];
    if(p.inside===s.inB&&p.interiorFloor&&cx>p.x+3&&cx<p.x+p.w-3&&Math.abs(foot-p.y)<5)return true;
  }
  return false;
}
function sanitizeEnemySpawns(lv){
  var safe=[],offsets=[0,62,-62,124,-124,190,-190,260,-260,340,-340];
  for(var i=0;i<lv.spawns.length;i++){
    var s=lv.spawns[i],z=enemySpawnSize(s.t),placed=false;
    if(s.perch){safe.push(s);continue;}
    /* A deck spawn stands on its deck. Dropping it to ground level like an
       ordinary outdoor spawn would empty every catwalk and rooftop in the game. */
    if(s.deck){
      s.x=Math.round(clamp(s.x,s.deck.x+4,s.deck.x+s.deck.w-z.w-4));
      s.y=Math.round(s.deck.y-z.h);
      if(!enemySpawnBlocked(lv,s,s.x,s.y))safe.push(s);
      continue;
    }
    for(var j=0;j<offsets.length;j++){
      var nx=s.x+offsets[j],ny=s.y;
      if(s.inB){
        if(nx<s.inB.x+16||nx+z.w>s.inB.x+s.inB.w-16)continue;
        if(!interiorSpawnSupported(lv,s,nx,ny,z))continue;
      } else if(s.t!=='prowler'){
        var gy=groundYAt(lv,nx+z.w/2);if(gy===null)continue;ny=gy-z.h;
      }
      if(enemySpawnBlocked(lv,s,nx,ny))continue;
      s.x=Math.round(nx);s.y=Math.round(ny);placed=true;break;
    }
    if(placed)safe.push(s);
  }
  lv.spawns=safe;
}
function completeObjective(){
  if(!level||!level.objective||level.objective.taskDone)return;
  level.objective.taskDone=true;
  if(level.miniBossDefeated)level.objective.done=true;
  score+=750;SFX.clear();
  burst(P.x+P.w/2,P.y,'#ffe26a',18,4);
}
function countObjectiveElimination(e){
  if(!e)return;
  if(e.miniBoss&&!e.miniBossCounted){
    e.miniBossCounted=true;level.miniBossDefeated=true;score+=2000;SFX.clear();
    if(level.objective&&level.objective.taskDone)level.objective.done=true;
    burst(e.x+e.w/2,e.y+e.h/2,'#ffd35a',28,6);
  }
  if(!e.objective||e.objectiveCounted||!level.objective||level.objective.taskDone)return;
  e.objectiveCounted=true;level.objective.progress++;
  if(level.objective.progress>=level.objective.total)completeObjective();
}
function structureKind(th){
  if(th.prop==='pipe')return 'sewer';
  if(th.prop==='city')return 'downtown';
  if(th.prop==='dock')return 'dockhouse';
  return 'industrial';
}
function addBuilding(lv,rng,x,gy,kind){
  /* Every authored dimension here is in 1x units multiplied by S, so the whole
     structure keeps its proportions while growing to fit the scaled cast.
     Storey count drops from 3-4 to 2-3: at S=1.75 a four-storey block would
     tower off the top of the camera's fixed vertical framing. */
  var S=BUILD_SCALE;
  var fh=82*S, w=Math.round((360+rng()*60)*S);
  /* Blocks are three to five storeys, threaded by flights that alternate ends of
     the floor so each storey is crossed to reach the next. That makes them
     taller than the camera's outdoor framing, which is what a city looks like
     from the street; inside, the camera follows the storey the brother is on
     (see updateCamera) rather than trying to hold the whole block at once. */
  var floors=3+Math.floor(rng()*3);
  var b={x:x,y:gy-floors*fh,w:w,h:floors*fh,gy:gy,fh:fh,floors:floors,cut:0,scale:S,
         slabs:[],steps:[],stairs:[],windows:[],door:{x:x+18*S,w:38*S},doorOpen:0,seed:rng(),lit:rng(),kind:kind||'downtown'};
  var f,i;
  lv.plats.push({x:x-7*S,y:b.y-11*S,w:w+14*S,h:11*S,roof:true});  // roof: always solid
  lv.plats.push({x:x-9*S,y:b.y,w:10*S,h:b.h,inside:b});           // walls: solid only from inside
  lv.plats.push({x:x+w-1,y:b.y,w:10*S,h:b.h,inside:b});
  for(f=1;f<floors;f++){
    var fy=gy-f*fh, lower=gy-(f-1)*fh;
    /* Treads are half the size they used to be — twice as many, half as deep and
       half as tall — so a flight reads as a staircase instead of a ladder of
       crates. They are scenery and enemy collision only: what the player walks
       on is the flight's ramp platform below, whose surface is a continuous
       function of x. A ramp has no seams, so there is nowhere along a flight —
       visible or not — for the player to drop between two treads. */
    var steps=12, stw=12*S, sth=fh/steps, runW=steps*stw, riser=sth+6*S;
    // A flight runs from the floor it leaves to the landing it meets, so odd
    // storeys run left-to-right starting just past the door and even storeys run
    // back the other way. Both ends are flush: the low end sits on the floor
    // below and the top tread hands straight over to its landing slab.
    var goRight=(f%2===1), lowX=goRight?(x+66*S):(x+w-40*S-runW), sl;
    var flLowX=goRight?lowX:lowX+runW, flHighX=goRight?lowX+runW:lowX;
    b.stairs.push({lowX:flLowX,lowY:lower,highX:flHighX,highY:fy,goRight:goRight,floor:f});
    lv.plats.push({x:lowX,y:fy,w:runW,h:lower-fy,inside:b,step:true,
      ramp:{x1:flLowX,y1:lower,x2:flHighX,y2:fy}});
    for(i=0;i<steps;i++){
      // Tread tops straddle the ramp line, so feet always look planted on one.
      var stx=lowX+(goRight?i:(steps-1-i))*stw, sty=lower-(i+0.5)*sth;
      lv.plats.push({x:stx,y:sty,w:stw+1,h:riser,inside:b,step:true});
      b.steps.push({x:stx,y:sty,w:stw+1,h:riser});
    }
    /* The storey above is a whole floor, wall to wall, with the flight hanging
       underneath it rather than a ledge that stops at the stairwell. Walking the
       upper floor therefore carries straight on over the stairs to the rest of
       that floor; going down is a matter of asking for the stairs at their head.
       Floors are one-way besides: you land on one from above and pass straight
       up through it from below, so a jump made under a floor reaches it instead
       of stopping dead on its underside, and crouch + JUMP drops back through. */
    sl={x:x+8*S,y:fy,w:w-16*S,h:11*S};
    b.slabs.push(sl);
    lv.plats.push({x:sl.x,y:sl.y,w:sl.w,h:sl.h,inside:b,interiorFloor:true,oneway:true});
  }
  for(f=0;f<floors;f++){
    var base=gy-f*fh;
    for(i=0;i<3;i++){
      var wx=x+28*S+i*((w-96*S)/2);
      if(wx+40*S>x+w-18*S)continue;
      if(f===0&&wx+40*S>b.door.x-16*S&&wx<b.door.x+b.door.w+16*S)continue; // no window in the doorway
      var landing=(f===0);
      for(var q=0;q<b.slabs.length;q++){
        var sb=b.slabs[q];
        if(Math.abs(sb.y-base)<2&&wx+34*S>sb.x&&wx+6*S<sb.x+sb.w){landing=true;break;}
      }
      var win={x:wx,y:base-54*S,w:40*S,h:46*S,open:false,broken:false,f:f,base:base,b:b};
      b.windows.push(win);
    }
    // A narrow window in the right edge is the building's deliberate escape
    // point. Façade windows still shatter, but never change interior state.
    b.windows.push({x:x+w-24*S,y:base-50*S,w:22*S,h:42*S,open:false,broken:false,
      f:f,base:base,b:b,sideExit:true});
  }
  lv.buildings.push(b);
  return b;
}
/* ==================== THEME PROPS ====================
   Replaces the old free-floating slabs. Every stage now climbs over objects
   that belong to it: pipework in the sewers, street furniture and parked cars
   downtown, crates and haulage on the warehouse floors. Everything here is
   jumpable and — the crane mast aside — destructible, so a route made of props
   can also be blown out of the way. */
/* A standing jump peaks at v^2/2g = 11.9^2 / (2*0.52) ~= 136px, so anything the
   player is expected to hop over stays at or under PROP_MAX_H, leaving real
   clearance rather than a frame-perfect scrape. Taller pieces (the crane mast)
   must be scenery, never a solid box, or they wall the level off. */
var PROP_MAX_H=100;
var PROP_SETS={
  sewer:{
    ground:[
      {t:'pipe',    w:[130,300],h:[28,50],hp:95},
      {t:'pipeup',  w:[34,50], h:[76,100],hp:110},
      {t:'valvebox',w:[56,80], h:[46,66], hp:75}
    ],
    /* Sewer climbs stay in the air — wall-run pipes of varying bore, threaded
       through where the bare platforms used to hang. */
    climb:{air:true,spec:{t:'pipe',w:[120,250],h:[24,44],hp:95}}
  },
  street:{
    ground:[
      {t:'crate',     w:[50,88],  h:[48,78], hp:50},
      {t:'binbank',   w:[66,110], h:[52,74], hp:65},
      {t:'phonebooth',w:[46,56],  h:[92,100],hp:80},
      {t:'car',       w:[172,216],h:[66,80], hp:150,blast:true}
    ],
    climb:{air:false,tiers:[{t:'crate',w:[56,84]},{t:'binbank',w:[70,96]},{t:'crate',w:[62,92]}]}
  },
  warehouse:{
    ground:[
      {t:'crate',     w:[50,116], h:[48,100],hp:60},
      {t:'cargotruck',w:[232,286],h:[94,104],hp:210,blast:true},
      {t:'crane',     w:[36,44],  h:[150,186],hp:0}
    ],
    climb:{air:false,tiers:[{t:'crate',w:[58,98]},{t:'crate',w:[64,104]},{t:'crate',w:[58,96]}]}
  }
};
function propSetFor(th){return th.prop==='pipe'?'sewer':th.prop==='junk'?'warehouse':'street';}
function rngRange(rng,r){return Math.round(r[0]+rng()*(r[1]-r[0]));}
function propSpaceFree(lv,x,w,pad){
  var i,o;
  pad=pad||70;
  for(i=0;i<lv.buildings.length;i++){
    var b=lv.buildings[i];
    if(x+w>b.x-130&&x<b.x+b.w+130)return false;
  }
  for(i=0;i<lv.obstacles.length;i++){
    o=lv.obstacles[i];
    if(x+w>o.x-pad&&x<o.x+o.w+pad)return false;
  }
  if(lv.exit&&x+w>lv.exit.x-200)return false;
  return true;
}
/* Collectibles go down before the barrels, the dumpsters and the themed props,
   and not one of those passes knew an item was already standing there — so a
   clip could end up inside a barrel: drawn behind it, and impossible to walk
   into because the barrel is solid. This is the last word on it, run after
   everything else is placed. Anything still buried is lifted onto the lid of
   whatever swallowed it when that lid is somewhere a brother can reach, and
   pushed out to the side when it is not.

   The retry is bounded because moving an item clear of one body can put it
   inside the next, and two overlapping props could otherwise pass it back and
   forth forever. */
/* Is this item genuinely out of reach inside that body, or merely touching it?
   The distinction matters: a pickup clipping the corner of a crate is still
   walked into, and moving those was shunting mission objectives off the route
   they were deliberately placed on.

   Out of reach means both of: most of the item is inside the body horizontally,
   so it cannot be brushed from either side; and its top edge is below the body's
   lid, so standing on the lid does not reach down to it either. */
function itemBuried(it,o){
  var ovx=Math.min(it.x+it.w,o.x+o.w)-Math.max(it.x,o.x);
  if(ovx<it.w*0.5)return false;
  if(it.y+it.h<=o.y||it.y>=o.y+o.h)return false;
  return it.y>o.y+4;
}
function freeItems(lv){
  var i,j,it,o,tries,top,moved=0;
  for(i=0;i<lv.items.length;i++){
    it=lv.items[i];
    if(it.inB)continue;                      // indoors is deliberate placement
    /* The objective is placed on a declared route spot on purpose, and lifting
       it onto a crate lid takes it off that spot — which is the whole design
       guarantee that every stage has one path through it. Scenery never gets to
       overrule the mission, so it is left where the generator put it and
       items-test asserts separately that nothing ever buries one. */
    if(it.objective)continue;
    for(tries=0;tries<12;tries++){
      top=null;
      for(j=0;j<lv.obstacles.length;j++){
        o=lv.obstacles[j];
        if(o.decorative||o.decor||!o.platform)continue;   // scenery you walk through
        if(!itemBuried(it,o))continue;
        if(!top||o.y<top.y)top=o;            // the highest lid over this spot
      }
      if(!top)break;
      it.y=Math.round(top.y-it.h-5);
      moved++;
    }
  }
  return moved;
}
/* Always up, never sideways. Sliding an item out of one crate drops it into the
   next one along a stacked wall and it can shuttle between the two forever;
   lifting is monotone, so a stack resolves in as many steps as it has boxes and
   then stops. */
function liftClear(lv,it){
  var tries,j,o,top,moved=0;
  for(tries=0;tries<12;tries++){
    top=null;
    for(j=0;j<lv.obstacles.length;j++){
      o=lv.obstacles[j];
      if(o.decorative||o.decor||!o.platform)continue;
      if(!itemBuried(it,o))continue;
      if(!top||o.y<top.y)top=o;
    }
    if(!top)break;
    it.y=Math.round(top.y-it.h-5);
    moved++;
  }
  return moved;
}
/* Registers a prop as both a destructible obstacle and the platform you stand
   on, matching how the pre-existing barrels and dumpsters already work. */
function addProp(lv,type,x,y,w,h,hp,opt){
  opt=opt||{};
  var o={x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h),type:type,
         hp:hp,dead:false,prop:true,v:opt.v===undefined?Math.random():opt.v};
  if(opt.blast)o.blast=true;
  if(hp<=0)o.indestructible=true;
  lv.obstacles.push(o);
  /* Scenery (decor) is drawn but never collides — used for anything too tall to
     clear, which would otherwise seal the route. */
  if(!opt.decor){
    o.platform={x:o.x,y:o.y,w:o.w,h:o.h,obstacle:o};
    if(opt.oneway)o.platform.oneway=true;
    lv.plats.push(o.platform);
  }
  return o;
}
function placeGroundProp(lv,rng,spec,x,gy){
  var w=rngRange(rng,spec.w),h=rngRange(rng,spec.h);
  if(!propSpaceFree(lv,x,w))return null;
  if(spec.t==='crane'){
    /* The mast is pure scenery — at 150-186 tall a solid box would be an
       unjumpable, indestructible wall. The jib overhead is the real platform,
       and a crate always lands alongside so the jib stays reachable: 92 tall
       crate + a 136 jump clears it comfortably. */
    var mast=addProp(lv,'crane',x,gy-h,w,h,0,{decor:true,v:rng()});
    addProp(lv,'craneJib',x-96,gy-h-16,w+192,16,0,{oneway:true,v:rng()});
    var cw=rngRange(rng,[62,86]),ch=rngRange(rng,[74,92]);
    addProp(lv,'crate',x+w+26,gy-ch,cw,ch,60,{v:rng()});
    return mast;
  }
  return addProp(lv,spec.t,x,gy-Math.min(h,PROP_MAX_H),w,Math.min(h,PROP_MAX_H),spec.hp,{blast:spec.blast,v:rng()});
}
function buildPropClimb(lv,rng,set,px,gy){
  var climb=set.climb,k;
  if(climb.air){
    /* Same tier heights the bare platforms used, now drawn as pipework. */
    var dir=rng()<0.5?-1:1,spec=climb.spec;
    for(k=0;k<3;k++){
      var pw=rngRange(rng,spec.w),ph=rngRange(rng,spec.h);
      var pxk=px+k*118*dir-(dir<0?pw:0),pyk=gy-64-k*48;
      if(!propSpaceFree(lv,pxk,pw,30))continue;
      addProp(lv,'pipe',pxk,pyk,pw,ph,spec.hp,{oneway:true,v:rng()});
    }
    return;
  }
  /* Ground stacks step up in jumpable increments so the high lane stays
     reachable even though each tier can be destroyed. */
  /* A tier is a step, and a step only works if the one below it got placed and
     the floor under it exists. A lone 164-tall crate standing over a gap in the
     ground is not a climb, it is a wall — and one the player cannot jump, since
     a standing jump tops out at 136. */
  var cx=px,tierH=[56,110,164],landed=0;
  for(k=0;k<climb.tiers.length;k++){
    var t=climb.tiers[k],tw=rngRange(rng,t.w),th=tierH[k];
    if(k>landed||groundYAt(lv,cx+tw/2)!==gy||!propSpaceFree(lv,cx,tw,26)){cx+=tw+14;continue;}
    addProp(lv,t.t,cx,gy-th,tw,th,t.t==='binbank'?65:60,{v:rng()});
    landed=k+1;cx+=tw+14;
  }
}
/* ==================== TERRAIN ====================
   Ground used to be one lane with scenery standing on it, which is why every
   stage played the same way in a different colour. Each biome now climbs in its
   own language. The sewers drop into sumps you climb out of and carry catwalks
   overhead. The street leaves the pavement entirely: up a fire escape, across
   the rooftops, and down the far side to the exit. The warehouse stacks crates
   small, medium, large into a staircase over a container too tall to jump — the
   sizes are the instruction.

   What they share is a second lane worth going to and an honest way back down
   from it, and that everything load-bearing is indestructible. A route that can
   be shot away is a route that can strand the player at the bottom of a pit, and
   no amount of level design is worth that. */

function addLadder(lv,x,bottomY,topY,topX){
  lv.ladders.push({x:Math.round(x),w:26,bottomY:Math.round(bottomY),
                   topY:Math.round(topY),topX:Math.round(topX)});
}
/* A deck is terrain wearing a prop's clothes: it draws and collides like the
   rest of the scenery, but nothing can destroy it, and unless it is asked to be
   solid it is one-way — you drop off the front rather than being fenced in. */
function addDeck(lv,type,x,y,w,h,opt){
  opt=opt||{};
  var o=addProp(lv,type,x,y,w,h,0,{oneway:!opt.solid,v:opt.v===undefined?0.42:opt.v});
  o.deck=true;
  // Which movement built it. Two pieces can use the same dressing — a fire
  // escape landing serves both the roof climb and a scaffold lane — so the tag
  // is the only way to tell one flight from another after the fact.
  if(opt.tag)o.tag=opt.tag;
  return o.platform;
}
/* Enemies posted to a deck belong to it. Ordinary outdoor spawns are dropped to
   ground level during the sanitising pass, which would empty every catwalk and
   rooftop in the game; a deck spawn is pinned to its own surface instead. */
function deckSpawn(lv,plat,x,t){
  var z=enemySpawnSize(t);
  if(plat.w<z.w+20)return;
  lv.spawns.push({x:Math.round(clamp(x,plat.x+8,plat.x+plat.w-z.w-8)),
                  y:Math.round(plat.y-z.h),t:t,used:false,deck:plat});
}
function deckItem(lv,rng,plat,x,kind){
  lv.items.push({x:Math.round(clamp(x,plat.x+8,plat.x+plat.w-ITEM_D-8)),
                 y:Math.round(plat.y-ITEM_D-6),w:ITEM_D,h:ITEM_D,kind:kind,bob:rng()*6.28,
                 wep:rollWeapon(rng)});
}
/* propSpaceFree asks only about x, which is the right question for scenery that
   stands on the floor and the wrong one for a street with rooftops 290px over
   it: every position under the roof run would read as occupied. This asks the
   same question about the ground lane alone. */
function groundSpaceFree(lv,x,w,gy){
  var i,o;
  for(i=0;i<lv.buildings.length;i++){
    var b=lv.buildings[i];
    if(x+w>b.x-140&&x<b.x+b.w+140)return false;
  }
  for(i=0;i<lv.obstacles.length;i++){
    o=lv.obstacles[i];
    if(o.y+o.h<gy-40)continue;                    // hanging above the street, not in the way
    if(x+w>o.x-60&&x<o.x+o.w+60)return false;
  }
  if(lv.exit&&x+w>lv.exit.x-220)return false;
  return true;
}
/* Terrain only hangs over ground the player can actually stand on, so a span is
   usable only when one unbroken segment carries the whole of it. */
function flatRun(lv,x,w){
  var y=groundYAt(lv,x);
  if(y===null)return null;
  for(var t=x+60;t<=x+w;t+=60)if(groundYAt(lv,t)!==y)return null;
  return groundYAt(lv,x+w)===y?y:null;
}

/* --- sewers: a level down into the sump, a level up onto the catwalk --- */
/* ==================== SET PIECES ====================
   A stage used to build the same movement in the same place every time: the
   sewers dug a channel, the street raised a fire escape a fifth of the way in,
   the warehouse stacked crates — always the first position that fitted, always
   the only movement that biome knew. Two stages of the same biome therefore
   played as the same stage twice.

   Each biome now owns three movements. A stage shuffles them, draws one per band
   of its length, rolls fresh dimensions for each and puts it at a random place
   inside its band. Whatever comes up, at least one piece has to be a gate —
   something the ground lane cannot get past — so the route still leaves the
   floor however the dice fell. */
var PIT_DROP=104, CATWALK_UP=168, ROOF_UP=290, FIRE_STEP=72;

function shuffleRng(a,rng){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

/* Two or three treads bridging a floor and a surface above it, each within a
   jump of the last, with the final hop no bigger than the rest. Crates stand on
   the floor as solid boxes; pipes, planks and fire-escape landings are thin
   decks you land on from above and can pass up through. */
function stepsBetween(lv,rng,type,x,lowY,highY,w,dir){
  var rise=lowY-highY;
  if(rise<40)return;
  var n=Math.max(2,Math.min(3,Math.round(rise/62))),k,cx=x;
  for(k=1;k<=n;k++){
    var top=lowY-Math.round(rise*k/(n+1));
    if(type==='crate')addDeck(lv,'crate',cx,top,w,lowY-top,{solid:true,v:rng()});
    else addDeck(lv,type,cx,top,w,type==='plank'?12:20);
    cx+=(w-12)*dir;
    if(dir<0&&cx<0)return;
  }
}

/* How much room there is above a surface before something solid stops you. A
   wall put up under a rooftop needs to leave a body's worth or its own top is a
   nine-pixel slot nobody can stand in — and the wall is placed on ground-lane
   clearance, which deliberately ignores whatever is hanging overhead. */
/* Whether a wall of this height can stand here. Two ways it cannot: it spears
   something solid on the way up, or its own top comes out so close under
   something that nobody could stand on it. Both were reported as "nothing
   overhead" by an earlier reading, which is how a barricade ended up run
   straight through a rooftop. Returns the room above its top, or a large
   negative if it collides with anything at all. */
function wallRoom(lv,x,w,topY,botY){
  var best=1e9,i,o;
  for(i=0;i<lv.obstacles.length;i++){
    o=lv.obstacles[i];
    if(o.dead||!o.platform)continue;
    if(o.x+o.w<=x||o.x>=x+w)continue;
    /* Nothing may be run through, one-way or not: a wall standing through a
       plank leaves a stretch of walkway nobody can stand on. */
    if(o.y<botY&&o.y+o.h>topY)return -1e9;
    /* Headroom, though, counts only what would actually stop you. You jump up
       through a plank; you do not bang your head on it. */
    if(!o.platform.oneway&&o.y+o.h<=topY&&topY-(o.y+o.h)<best)best=topY-(o.y+o.h);
  }
  return best;
}
/* The tallest wall from this list that fits, or 0 if none of them do. */
function wallHeight(lv,x,w,gy,tall){
  for(var i=0;i<tall.length;i++)
    if(wallRoom(lv,x,w,gy-tall[i],gy)>=86)return tall[i];
  return 0;
}
/* A gate: something the ground lane cannot get past, with a flight up one side
   and down the other. The wall and the treads are biome dressing — a bulkhead
   over pipes, a hoarding over fire-escape landings, a freight container over
   crates — but the geometry is the same everywhere, and it is the geometry that
   matters: the wall stands taller than a standing jump so the steps are the only
   way, and no step is more than a jump above the last. */
function addGate(lv,rng,x,spec,tight,loose){
  var wh=Math.round(spec.h[0]+rng()*(spec.h[1]-spec.h[0]));
  var ww=tight?190:Math.round(200+rng()*120);
  var n=tight?2:(2+(rng()<0.5?1:0)),k,rise=[],tw=[],run=0;
  for(k=1;k<=n;k++){rise.push(Math.round(wh*k/(n+1)));tw.push(tight?66:Math.round(74+rng()*40));run+=tw[k-1];}
  var need=ww+run*2+40, gy=flatRun(lv,x,need);
  if(gy===null)return false;
  /* The loose check asks only about the ground lane — anything hanging overhead
     is not in the way of a wall standing on the floor. It is what the last-resort
     pass uses when the ordinary clearance has found nowhere at all. */
  if(loose?!groundSpaceFree(lv,x-30,need+60,gy):!propSpaceFree(lv,x-40,need+80,40))return false;
  if(loose&&wallRoom(lv,x,need,gy-wh,gy)<86)return false;
  var cx=x;
  for(k=0;k<n;k++){addDeck(lv,spec.tread,cx,gy-rise[k],tw[k],rise[k],{solid:true,v:rng()});cx+=tw[k];}
  var wallX=cx,top=addDeck(lv,spec.wall,wallX,gy-wh,ww,wh,{solid:true,v:rng()});
  cx+=ww;
  for(k=n-1;k>=0;k--){addDeck(lv,spec.tread,cx,gy-rise[k],tw[k],rise[k],{solid:true,v:rng()});cx+=tw[k];}
  lv.routeSpots.push({x:wallX+ww/2,y:gy-wh});
  deckSpawn(lv,top,wallX+ww*0.5,lv.n>=6?'enforcer':'gunner');
  /* Something hanging over it that you may climb to and need not. */
  if(spec.over&&rng()<0.75){
    var gan=addDeck(lv,spec.over,wallX-60,gy-wh-108,ww+120,14);
    lv.pockets.push({x:wallX+ww/2,y:gy-wh-108,plat:gan});
    if(rng()<0.6)deckSpawn(lv,gan,wallX+20,'thug');
  }
  return true;
}

/* A high lane: a deck up out of the way with a way up at one end and a way back
   down at the other, so it is a loop rather than a dead end. Optional — a pocket
   worth the climb, never part of the route. */
function addLane(lv,rng,x,spec,tight){
  var h=Math.round(spec.h[0]+rng()*(spec.h[1]-spec.h[0]));
  var w=tight?270:Math.round(300+rng()*240), gy=flatRun(lv,x,w+260);
  if(gy===null||!propSpaceFree(lv,x-70,w+330,50))return false;
  var y=gy-h, deck=addDeck(lv,spec.deck,x,y,w,spec.deck==='plank'?12:14);
  if(spec.up==='ladder')addLadder(lv,x+12,gy,y,x+24);
  else stepsBetween(lv,rng,spec.up,x+8,gy,y,84,1);
  stepsBetween(lv,rng,spec.down,x+w-10,gy,y,84,1);
  lv.pockets.push({x:x+w*0.5,y:y,plat:deck});
  deckSpawn(lv,deck,x+w*0.32,lv.n>=5?'enforcer':'gunner');
  if(rng()<0.6)deckSpawn(lv,deck,x+w*0.74,lv.n>=4?'gunner':'thug');
  return true;
}

/* The street's big movement, and the only piece with a shape of its own: a fire
   escape up the side of a block, a run of roofs with planks over some of the
   gaps, and a flight down the far side. */
/* Returns 0 for nothing built, 1 for a run of roofs that could not be sealed —
   still worth having as a pocket, and never rebuilt from scratch on the next
   attempt — and 2 for a sealed run, which is a gate. */
function addRoofRun(lv,rng,x){
  var gy=flatRun(lv,x,300);
  if(gy===null||!propSpaceFree(lv,x-40,340,40))return 0;
  var k,ly=gy,lx=x,side=rng()<0.5?1:-1;
  for(k=0;k<3;k++){
    ly-=FIRE_STEP;lx+=(k%2?-84:84)*side;
    addDeck(lv,'firestep',lx,ly,134,15,{tag:'climb'});
  }
  /* A roof is solid — you do not fall through one — so it must never be built
     over the landing that reaches it, or the last step of the climb has fifty
     pixels of headroom and the way up is walled off. The first roof therefore
     starts a stride past the top landing. */
  var roofY=gy-Math.round(ROOF_UP*(0.86+rng()*0.28)), rx=lx+150, made=0, d=null, prev=null, roofs=[];
  var want=2+Math.floor(rng()*3);
  while(rx<lv.length-1400&&made<want){
    var rw=Math.round(280+rng()*190), ry=made?roofY+Math.round((rng()-0.5)*64):roofY;
    if(made&&!propSpaceFree(lv,rx-30,rw+60,30)){
      rx+=110;
      if(rx-(d.x+d.w)>170)break;
      continue;
    }
    /* Two roofs a short jump apart are two roofs somebody has already laid a
       plank between. The plank sits at the lower of the two roof lines, so you
       step down onto it and up off it. */
    if(prev&&rng()<0.5){
      var pl=Math.max(prev.y,ry);
      addDeck(lv,'plank',prev.x+prev.w-12,pl,rx-(prev.x+prev.w)+24,11);
    }
    d=addDeck(lv,'rooftop',rx,ry,rw,22,{solid:true});
    prev=d;
    if(rng()<0.7)addDeck(lv,'watertank',Math.round(rx+rw*0.82),ry-84,64,84,{solid:true});
    deckSpawn(lv,d,rx+rw*0.28,lv.n>=7?'enforcer':'gunner');
    if(rng()<0.72)deckSpawn(lv,d,rx+rw*0.56,lv.n>=5&&rng()<0.4?'brute':'thug');
    roofs.push({x:rx+rw*0.5,y:ry,plat:d});
    lv.spawns.push({x:Math.round(rx+rw*0.5),y:Math.round(ry-150),t:'prowler',used:false});
    rx+=rw+Math.round(94+rng()*40);
    made++;
  }
  if(!d)return 0;
  /* And down the far side, stepping clear of the roof's edge rather than back
     under it, for the same headroom reason. */
  var ex=d.x+d.w+10, ey=d.y;
  for(k=0;k<4;k++){
    ey+=FIRE_STEP;
    if(ey>gy-46)break;
    addDeck(lv,'firestep',ex,ey,134,15,{tag:'descent'});
    ex+=46;
  }
  /* And the reason to have gone up at all: a mob hoarding sealing the street
     between the two flights, so the pavement stops being an option. Placed last,
     once both ends of the climb are known. */
  var b1=x+220,b2=ex-160,bx,sealed=false;
  for(bx=Math.round(b1);bx<b2;bx+=90){
    var bgy=flatRun(lv,bx,80);
    if(bgy===null||!groundSpaceFree(lv,bx-40,140,bgy))continue;
    /* Cut down until it clears whatever it is standing under, but never below
       150 — a standing jump peaks at 136, and a wall that can be hopped is not a
       gate at all. */
    var bh=wallHeight(lv,bx,58,bgy,[252,224,196,168,150]);
    if(!bh)continue;
    addDeck(lv,'barricade',bx,bgy-bh,58,bh,{solid:true,v:rng()});
    sealed=true;break;
  }
  /* Sealed, the roofs are the way through and the job may sit on them. Open,
     they are a view and a stash, and nothing that has to be reached goes up. */
  for(k=0;k<roofs.length;k++)(sealed?lv.routeSpots:lv.pockets).push(roofs[k]);
  return sealed?2:1;
}

var PIECES={
  sewer:[
    {kind:'lane',gate:false,deck:'catwalk', up:'ladder',down:'pipe',h:[150,205]},
    {kind:'gate',gate:true, wall:'bulkhead',tread:'pipe',h:[176,215],over:'catwalk'},
    {kind:'lane',gate:false,deck:'pipe',    up:'pipe',  down:'pipe',h:[118,164]},
    {kind:'gate',gate:true, wall:'pipeup',  tread:'pipe',h:[182,222]}
  ],
  street:[
    {kind:'roof',gate:true},
    {kind:'lane',gate:false,deck:'plank',    up:'firestep',down:'firestep',h:[164,214]},
    {kind:'gate',gate:true, wall:'barricade',tread:'firestep',h:[192,238]}
  ],
  warehouse:[
    {kind:'gate',gate:true, wall:'container',tread:'crate',h:[186,228],over:'catwalk'},
    {kind:'lane',gate:false,deck:'catwalk',  up:'crate',  down:'crate',h:[174,228]},
    {kind:'lane',gate:false,deck:'plank',    up:'crate',  down:'crate',h:[128,172]},
    {kind:'gate',gate:true, wall:'crate',    tread:'crate',h:[190,232]}
  ]
};

function buildPiece(lv,rng,spec,b0,b1,loose){
  /* Random stabs inside the band first — a march from the band's left edge is
     what made every stage of a biome land its movement in the same place. If the
     band is crowded, fall back to a sweep, and then to a narrower build, rather
     than giving up and leaving the stage flat. */
  for(var k=0;k<16;k++){
    var tight=k>=10;
    var x=k<8?Math.round(b0+rng()*Math.max(1,b1-b0-560))
             :Math.round(b0+(k%8)*Math.max(130,(b1-b0)/8));
    var ok=spec.kind==='gate'?(addGate(lv,rng,x,spec,tight||loose,loose)?2:0):
           spec.kind==='lane'?(addLane(lv,rng,x,spec,tight)?1:0):addRoofRun(lv,rng,x);
    if(ok)return ok;
  }
  return 0;
}
function addTerrain(lv,rng,routeStart){
  var menu=shuffleRng(PIECES[propSetFor(lv.theme)].slice(),rng),i;
  var lo=560,hi=routeStart-560,span=hi-lo;
  if(span<900)return;
  var gated=false;
  for(i=0;i<lv.plats.length;i++)if(lv.plats[i].sunken)gated=true;
  /* The gate goes down first with the pick of the whole level, because the one
     thing that must be true of every stage is that the ground lane stops
     somewhere. A stage already cut by a pit is already stopped, and gets to
     spend all its bands on lanes instead. */
  var forced=!gated;
  if(forced)
    for(i=0;i<menu.length;i++){
      if(!menu[i].gate)continue;
      var r=buildPiece(lv,rng,menu[i],lo,hi);
      if(r){menu.splice(i,1);i--;}
      if(r===2){gated=true;break;}
    }
  /* The gate is extra rather than the whole budget, so even a short stage gets a
     lane of its own on top of it and no two runs through are the same handful of
     pieces. */
  var want=clamp(Math.floor(span/1600),1,3);
  var bandW=span/want;
  for(i=0;i<want&&i<menu.length;i++)
    buildPiece(lv,rng,menu[i],lo+i*bandW,lo+(i+1)*bandW);
  /* Last resort. A stage with no terrain at all is a flat walk from end to end,
     which is the one outcome none of this is allowed to produce, so a final
     attempt drops the scenery clearance and asks only for floor that is not
     somebody's doorway. */
  if(gated)return;
  for(i=0;i<PIECES[propSetFor(lv.theme)].length;i++){
    var g2=PIECES[propSetFor(lv.theme)][i];
    if(g2.gate&&buildPiece(lv,rng,g2,lo,hi,true)===2)return;
  }
}

/* A pit is the one movement that has to be cut into the ground itself, so it
   runs before the route and the buildings are measured against it. Not every
   stage gets one, and the one that does gets it somewhere random along its
   length rather than in the first segment wide enough to take it. */
function digPits(lv,rng,routeStart){
  if(rng()<0.32)return;
  var tread=propSetFor(lv.theme)==='sewer'?'pipe':propSetFor(lv.theme)==='street'?'plank':'crate';
  var most=1+((routeStart>4600&&rng()<0.4)?1:0),made=0,segs=[],i;
  for(i=1;i<lv.plats.length;i++){
    var g=lv.plats[i];
    if(g.ground&&g.w>=640&&g.x>=560&&g.x+g.w<=routeStart-420)segs.push(g);
  }
  shuffleRng(segs,rng);
  for(i=0;i<segs.length&&made<most;i++){
    var s=segs[i];
    var lipL=Math.round(190+rng()*160),pitW=Math.round(270+rng()*170);
    if(lipL+pitW+200>s.w)continue;
    var floorY=Math.min(556,s.y+Math.round(PIT_DROP*(0.82+rng()*0.36))),drop=floorY-s.y;
    var pitX=s.x+lipL,rightX=pitX+pitW;
    lv.plats.push({x:pitX,y:floorY,w:pitW,h:620-floorY,ground:true,sunken:true});
    lv.plats.push({x:rightX,y:s.y,w:s.x+s.w-rightX,h:620-s.y,ground:true});
    s.w=lipL;
    /* Down the near side on treads, up the far side on a ladder: a channel you
       drop into on purpose and can always climb out of, at either end. */
    stepsBetween(lv,rng,tread,pitX+6,floorY,s.y,78,1);
    addLadder(lv,rightX-42,floorY,s.y,rightX+18);
    lv.routeSpots.push({x:pitX+pitW*0.5,y:floorY});
    lv.items.push({x:Math.round(pitX+pitW*0.5),y:floorY-30,w:ITEM_D,h:ITEM_D,
                   kind:rng()<0.5?'cheese':'nade',bob:rng()*6.28});
    made++;
  }
}
function buildLevel(n){

function damageEnemy(e,d){

     bullet or a blast landing in the same frame would otherwise run the whole

  if(e.dead)return;
  if(e.miniBoss){
    /* Elite armour keeps a high-DPS weapon from erasing the fight — except while
       it is reloading, when it is open and hitting it is the point.

       Armour is the whole of it. There used to be a floor here as well: a killing
       blow inside the first thirty seconds of a fight left the mini-boss on 1hp
       instead. The intent was a duel that could not be deleted, but 1hp out of two
       thousand draws an empty bar, so what it actually produced was a boss that
       stood there with no health left, refusing to die, for as long as half a
       minute. A fight that ends too quickly is a number to tune, never a reason to
       ignore the damage the player has already dealt. */

    countObjectiveElimination(e);

    burst(e.x+e.w/2,e.y+e.h/2,e.t==='brute'?'#e0954a':e.t==='prowler'?'#7b57a8':'#a6a6b0',9,4);
    SFX.enemyDeath(e.t,!!e.miniBoss);

       of a gun rather than a clip for one you already carry; a mouse is worth a
       handful of rounds and not much else. */

    var gunOdds=e.t==='terminator'?0.85:e.t==='brute'?0.55:e.t==='enforcer'?0.34:e.t==='gunner'?0.24:0.10;
    var roll=Math.random();

    else if(e.t==='prowler')items.push({x:e.x,y:e.y,w:ITEM_D,h:ITEM_D,kind:'nade',bob:0});
    else if(roll<gunOdds+0.43)items.push({x:e.x,y:e.y,w:ITEM_D,h:ITEM_D,kind:'cheese',bob:0});
    else if(roll<gunOdds+0.50)items.push({x:e.x,y:e.y,w:ITEM_D,h:ITEM_D,kind:'nade',bob:0});

/* An enraged mini-boss hunts in two dimensions: it springs at floors above it,

   has gone below. It is chasing a person, not walking a beat. */

/* ---- mini-boss tactics ----------------------------------------------------
   A mini-boss should be beatable by fighting it properly rather than by out-
   typing it, which means it needs habits a player can read and answer:

     it shoots and then gets out of the way,
     it jumps when a round is on its way in,
     and after emptying a volley it has to reload.

   That last one is the whole fight. The reload is the invitation: while it is
   reloading it cannot shoot, it barely moves, and it takes better than twice
   the damage. Catzilla's rockets are murder to stand in front of and trivial to
   roll through, so Vinnie goes in during the volley and collects in the pause
   afterwards. Rocco has no such dodge, but he lands on people, and a stomp
   during a reload is worth two of them.

   which is why a weasel plays differently from a cat without either being a

    if(dx*(b.vx||0)<=0)continue;                 // travelling away

  }

    b=nades[i];

              addLight(ecx+e.facing*20,e.y+13,72,'#ffe08a',7);
              tone(700,0.05,'square',0.035,260);noise(0.05,0.05,2400);
            }
          } else {
            e.shots=e.rocketeer?1:e.t==='enforcer'?5:e.miniBoss&&miniEnraged(e)?4:stage>5?3:2;
            e.timer=(e.rocketeer?96+Math.random()*50:e.t==='enforcer'?48:64+Math.random()*46)*(e.miniAttackRate||1);
            if(e.miniBoss){e.retreatT=28;e.recoverT=Math.max(e.recoverT||0,34);}   // shoot, then break off
          }
        }
        if(e.y>640){recoverEnemyTerritory(e);continue;}
      }
    } else {
      e.vy+=0.55;
      var d2=pcx-ecx;
      var catDist=Math.abs(d2);
      if(setEnemyEngaged(e,catDist,520,640,190)){
        e.state='engage';e.facing=d2<0?-1:1;
        if(e.miniBoss&&miniEnraged(e))e.vx=catDist>110?e.facing*1.35*e.miniMove:e.vx*.65;
        else e.vx=e.facing*(catDist>330?0.9:catDist<210?-0.65:0.15)*(e.miniMove||1);
      } else {e.state='patrol';patrolGround(e,0.62);}
      moveGroundEnemy(e,false,true);
      e.timer--;
      if(e.engaged&&e.timer<=0&&catDist<520&&catDist>80){
        e.timer=Math.max(50,130-stage*5)*(e.miniAttackRate||1);
        aimedShot(ecx+e.facing*24,e.y+16,pcx,pcy-6,4.6,{rocket:true,r:7,dmg:26,life:200});
        addLight(ecx+e.facing*30,e.y+16,90,'#ffb45a',8);
        tone(150,0.14,'sawtooth',0.05,60);noise(0.12,0.07,900);
      }
      if(e.y>640){recoverEnemyTerritory(e);continue;}
    }
    if(e.squash>0)e.squash--;
    if(e.hidden)continue;
    if(e.inB&&e.inB!==P.inB)continue;
    if(canStomp(e)){doStomp(e);}
    else if(e.touchCd<=0&&hit(P,e)){
      if(P.bro===1&&P.rollT>0){e.touchCd=12;burst(P.x+P.w/2,P.y+P.h/2,'#a8e8ff',4,2);}
      else {hurtPlayer(e.dmg,ecx);e.touchCd=30;}
    }
  }
}
function updateBoss(){
  if(!boss)return;
  boss.anim+=0.1;
  if(boss.flash>0)boss.flash--;
  var pcx=P.x+P.w/2,bcx=boss.x+boss.w/2;
  boss.facing=pcx<bcx?-1:1;
  if(boss.state==='dead'){
    boss.timer--;
    if(boss.timer%6===0){
      burst(boss.x+rnd(0,boss.w),boss.y+rnd(0,boss.h),'#ffb347',9,4.5);
      addLight(boss.x+rnd(0,boss.w),boss.y+rnd(20,120),180,'#ff9a3a',20);
      SFX.boom();cam.shake=9;
    }
    if(boss.timer<=0){state='WIN';stateT=0;SFX.clear();}
    return;
  }
  boss.vy+=0.6;boss.timer--;
  var sm=boss.phase===2?1.5:1;
  switch(boss.state){
    case 'enter':
      boss.vx=-1.6;
      if(boss.x<level.length*0.55){boss.vx=0;boss.state='idle';boss.timer=40;}
      break;
    case 'idle':
      boss.vx*=0.85;
      if(boss.timer<=0){
        var pk=Math.random();
        if(pk<0.4){boss.state='volley';boss.timer=20;boss.shots=boss.phase===2?5:3;}
        else if(pk<0.72){boss.state='jump';boss.timer=26;}
        else {boss.state='summon';boss.timer=40;}
      }
      break;
    case 'volley':
      boss.vx*=0.9;
      if(boss.timer<=0&&boss.shots>0){
        boss.shots--;boss.timer=Math.round(20/sm);
        var oy=boss.y+56+(boss.shots%2)*38;
        aimedShot(bcx+boss.facing*58,oy,P.x+P.w/2,P.y+16,5.0,{rocket:true,dmg:24,r:8});
        if(boss.phase===2)aimedShot(bcx+boss.facing*58,oy,P.x+P.w/2,P.y-54,4.6,{rocket:true,dmg:20,r:7});
        addLight(bcx+boss.facing*70,oy,140,'#ff9a4a',10);
        tone(140,0.16,'sawtooth',0.05,55);noise(0.12,0.07,800);
      }
      if(boss.shots<=0&&boss.timer<=0){boss.state='idle';boss.timer=45;}
      break;
    case 'jump':
      if(boss.onGround&&boss.timer<=0){boss.vy=-13;boss.vx=(pcx<bcx?-1:1)*4.2*sm;boss.timer=200;}
      if(boss.onGround&&boss.vy===0&&boss.timer<190&&boss.timer>0){
        cam.shake=16;SFX.boom();
        var k;for(k=0;k<2;k++)ebullets.push({x:bcx,y:boss.y+boss.h-14,vx:(k?1:-1)*5,vy:0,
          life:120,r:9,dmg:18,shock:true});
        burst(bcx,boss.y+boss.h,'#c9a06a',22,5);
        addLight(bcx,boss.y+boss.h,220,'#ffd08a',18);
        boss.state='idle';boss.timer=40;
      }
      break;
    case 'summon':
      if(boss.timer<=0){
        var alive=0,z;for(z=0;z<enemies.length;z++)if(!enemies[z].dead)alive++;
        if(alive<7){
          spawnEnemy('thug',cam.x+40,380);
          spawnEnemy('thug',cam.x+view.w-60,380);
          spawnEnemy('prowler',bcx,140);
        }
        tone(500,0.2,'square',0.05,210);
        boss.state='idle';boss.timer=50;
      }
      break;
  }
  boss.x+=boss.vx;boss.y+=boss.vy;boss.onGround=false;
  if(boss.y+boss.h>=470){boss.y=470-boss.h;boss.vy=0;boss.onGround=true;boss.vx*=0.8;}
  boss.x=clamp(boss.x,20,level.length-boss.w-20);
  if(hit(P,boss))hurtPlayer(20,boss.x+boss.w/2);
}
